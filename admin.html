<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130b"><title>Бибибайк · CRM квеста</title><link rel="stylesheet" href="/static/admin.css"><link rel="stylesheet" href="/static/vendor/leaflet.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/assets/leaflet-1.9.4.js"></script>
<style>
body{background:#07110a}.crm{min-height:100dvh;display:grid;grid-template-columns:230px 1fr}.side{position:sticky;top:0;height:100dvh;padding:24px 16px;border-right:1px solid var(--line);background:#08150d}.side .brand{margin:0 8px 35px}.nav{display:grid;gap:7px}.nav button{min-height:50px;border:0;border-radius:14px;padding:0 15px;background:transparent;color:var(--muted);text-align:left;font-weight:850;font-size:15px}.nav button.active{background:#153923;color:#fff;box-shadow:inset 3px 0 var(--green)}.content{min-width:0;padding:28px 30px 60px}.content-inner{max-width:1320px;margin:auto}.admin-head{display:flex;justify-content:space-between;align-items:start;gap:18px;margin-bottom:23px}.admin-head h1{margin:0}.admin-head p{margin:7px 0 0;color:var(--muted)}.updated{flex-shrink:0;color:var(--muted);font-size:13px;white-space:nowrap}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}.metric,.panel{min-width:0;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:20px}.metric span{color:var(--muted);font-size:12px;font-weight:850;text-transform:uppercase}.metric strong{display:block;margin:10px 0 3px;font:950 34px/1 var(--display)}.metric.green{border-color:#38e86455}.metric.yellow{border-color:#ffd12f55}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.grid>*{min-width:0}.full{grid-column:1/-1}.panel h2{margin-bottom:7px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel-head>*{min-width:0}.funnel{display:grid;gap:14px}.frow{display:grid;grid-template-columns:minmax(130px,.7fr) 1fr 44px;align-items:center;gap:10px}.bar{height:10px;border-radius:9px;background:#26392c;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:var(--green)}.people,.qr-list,.point-list{display:grid;gap:10px}.person,.qr-row,.point-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#0a180f}.person>*,.qr-row>*,.point-row>*{min-width:0}.person p,.qr-row p,.point-row p{margin:4px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#193b24;color:#87ef9c;font-size:12px;font-weight:850}.tag.off{background:#31261a;color:#ffd98d}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar .btn{width:auto;min-height:44px;padding:9px 14px}.map-card{position:relative;height:460px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0a1a10}.admin-map{width:100%;height:100%}.map-lock{position:absolute;z-index:800;left:14px;top:14px;width:auto;min-height:44px;padding:8px 12px}.map-legal{position:absolute;z-index:800;right:8px;bottom:7px;display:flex;min-height:44px;align-items:center;padding:4px 9px;border-radius:7px;background:#07130bd9;color:#c6d4c9!important;font-size:10px;text-decoration:none}.leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important}.leaflet-tile-pane{filter:brightness(.65) saturate(.75) sepia(.18) hue-rotate(78deg) contrast(1.08)}.point-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qr-preview{display:block;width:min(260px,100%);margin:15px auto;border:10px solid #fff;border-radius:12px}.code{text-align:center}.status-select{width:auto;min-width:160px;margin:0}.danger-small{min-height:44px;border:1px solid #ff5d7066;border-radius:10px;background:#ff5d7015;color:#ff9aa7;padding:8px 10px;font-weight:800}.privacy-link{display:inline-flex;min-height:44px;align-items:center;padding:4px 0}.mobile-nav{display:none}.empty-admin{padding:36px;text-align:center;color:var(--muted)}
@media(max-width:850px){.crm{display:block}.side{display:none}.content{padding:18px 14px 92px}.admin-head{align-items:center}.admin-head h1{font-size:31px}.metric-grid{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.mobile-nav{position:fixed;z-index:900;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);padding:7px;border:1px solid var(--line);border-radius:18px;background:#0b1a11f2;backdrop-filter:blur(14px)}.mobile-nav button{min-width:0;min-height:52px;border:0;border-radius:12px;padding:3px;background:transparent;color:var(--muted);font-size:10px;font-weight:850}.mobile-nav button.active{background:#153923;color:#fff}.map-card{height:360px}.point-form-grid{grid-template-columns:1fr}.frow{grid-template-columns:110px 1fr 35px;font-size:12px}.person,.qr-row,.point-row{align-items:flex-start}.metric strong{font-size:29px}}
@media(max-width:380px){.admin-head{align-items:flex-start;flex-wrap:wrap;gap:8px}.updated{width:100%}.panel-head{align-items:flex-start;flex-direction:column}.metric,.panel{padding:16px}.frow{grid-template-columns:96px minmax(40px,1fr) 30px;gap:7px}.map-lock{left:8px;top:8px}.qr-row,.point-row,.person{flex-direction:column}.qr-row>div:last-child,.point-row>button,.person>div:last-child{width:100%}}
@media print{.crm,.mobile-nav,.toast{display:none!important}.modal{position:static;display:block;background:#fff;padding:0}.sheet{border:0;background:#fff;color:#000;max-height:none}.sheet .btn,.sheet .icon-btn,.sheet p{display:none}.qr-preview{width:85mm}.code{color:#000}}
    .btn.danger{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1);color:#ff8f8f}
    .btn.danger:active{background:rgba(255,107,107,.18)}
    .login-wrap{min-height:calc(100dvh - 80px);display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:0 22px 70px #0008}.login-card img{width:68px;height:68px;border-radius:18px;display:block;margin-bottom:20px}.login-card h1{margin:0 0 8px}.login-card p{margin:0 0 20px;color:var(--muted);line-height:1.5}.login-error{min-height:20px;margin:10px 0;color:#ff9aa7;font-size:13px}.logout-btn{width:auto;min-height:44px;padding:8px 12px;margin-top:10px}body.admin-modal-open{overflow:hidden}.request-list{display:grid;gap:10px}.request-card{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:15px;border:1px solid #38e86455;border-radius:15px;background:#0b1d11}.request-card p{margin:5px 0 0;color:var(--muted);font-size:13px}.request-card .btn{width:auto;min-height:44px}.request-card>div:last-child{text-align:right}.request-actions{display:grid;justify-items:end;gap:7px}.request-actions .btn+.btn{margin-top:0}.copy-btn.copied{border-color:var(--green);background:#153923;color:#a5f5b4}.support-list{display:grid;gap:10px}.support-card{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:16px;background:#0a180f;color:inherit;text-align:left}.support-card.unread{border-color:#57ec76;background:#0e2415;box-shadow:inset 3px 0 #57ec76}.support-card p{margin:5px 0 0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.support-card small{display:block;margin-top:5px;color:var(--muted)}.support-card-meta{display:grid;justify-items:end;gap:7px}.unread-badge{display:inline-grid;min-width:24px;height:24px;place-items:center;padding:0 7px;border-radius:999px;background:var(--green);color:#07110b;font-weight:950}.support-profile{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.support-profile span,.support-profile a{padding:7px 10px;border:1px solid var(--line);border-radius:10px;color:var(--muted);text-decoration:none}.support-copy{margin:0 0 12px}.support-messages{display:grid;gap:9px;max-height:48dvh;overflow:auto;padding:8px 2px 14px}.support-message{max-width:86%;padding:11px 13px;border-radius:14px;background:#15251a}.support-message.user{justify-self:start;border-bottom-left-radius:4px}.support-message.operator{justify-self:end;background:#18452a;border-bottom-right-radius:4px}.support-message.system{max-width:100%;justify-self:stretch;border:1px dashed #63dd7f66;background:#0c1b11}.support-message p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.support-message time{display:block;margin-top:5px;color:var(--muted);font-size:11px}.support-reply{display:grid;gap:9px;margin-top:8px}.support-reply textarea{min-height:90px;margin:0}.nav-count{display:inline-grid;min-width:20px;height:20px;place-items:center;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--green);color:#07110b;font-size:10px}@media(max-width:600px){.request-card{align-items:stretch;flex-direction:column}.request-card>div:last-child{text-align:left}.request-actions{grid-template-columns:1fr 1fr;justify-items:stretch}.request-actions .tag{grid-column:1/-1;width:max-content}.request-actions .btn{width:100%}}
</style></head><body><div class="crm"><aside class="side"><div class="brand"><img class="brand-logo" src="/static/bb-bike-logo.jpg" alt=""><span>Бибибайк CRM</span></div><nav class="nav" id="desktop-nav" aria-label="Разделы CRM"></nav></aside><main class="content"><div class="content-inner" id="admin-app"><div class="splash"><img src="/static/bb-bike-logo.jpg" alt=""><b>Загружаем CRM…</b></div></div></main></div><nav class="mobile-nav" id="mobile-nav" aria-label="Разделы CRM"></nav><div id="modal"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const tg=window.Telegram?.WebApp,el=document.getElementById('admin-app'),modal=document.getElementById('modal'),crm=document.querySelector('.crm');let model=null,page='overview',adminMap=null,editMarker=null,mapUnlocked=false,draftCoords=null,modalTrigger=null,activeSupport=null;
const pages=[['overview','Обзор'],['points','Точки'],['qr','QR'],['participants','Участники'],['support','Поддержка'],['more','Ещё']];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(path,o={}){let r;try{r=await fetch(path,{...o,credentials:'same-origin',headers:{'Content-Type':'application/json',...(o.headers||{})}})}catch(_){const e=new Error('Нет связи с CRM');e.status=0;throw e}const p=await r.json().catch(()=>({ok:false,message:'Сервис не ответил'}));if(!r.ok||p.ok===false){const e=new Error(p.message||'Ошибка');e.status=r.status;throw e}return p}function toast(t){const n=document.getElementById('toast');n.textContent=t;n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),3500)}
function nav(){const unread=Number(model?.support_metrics?.unread||0),h=pages.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')" ${page===id?'aria-current="page"':''}>${t}${id==='support'&&unread?`<span class="nav-count" aria-label="Непрочитанных: ${unread}">${unread}</span>`:''}</button>`).join('');document.getElementById('desktop-nav').innerHTML=h;document.getElementById('mobile-nav').innerHTML=h}
function destroyAdminMap(){const current=adminMap;adminMap=null;mapUnlocked=false;if(!current)return;try{current.off?.();current.remove()}catch(error){console.warn('Не удалось корректно закрыть карту CRM',error)}}
function go(p){if(!model||!pages.some(([id])=>id===p))return;destroyAdminMap();page=p;render(true)}function pageHeader(t,s){return `<header class="admin-head"><div><h1>${t}</h1><p>${s}</p><button class="btn secondary logout-btn" onclick="logoutAdmin()">Выйти</button></div><span class="updated">Обновлено ${new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</span></header>`}
function overview(){const m=model.metrics||{},f=model.funnel||{},max=Math.max(1,f.started||0),rows=[['Открыли квест',f.started],['Посмотрели точку',f.point_viewed],['Открыли навигатор',f.navigator_opened],['Получили 1+ подарок',f.reached_point_1],['Получили 2+ подарка',f.reached_point_2],['Завершили',f.reached_point_3]];return `${pageHeader('Операционный обзор','Воронка, участники и фактическое использование акции')}<div class="metric-grid"><div class="metric green"><span>Воспользовались</span><strong>${m.total||0}</strong><small>всего участников</small></div><div class="metric"><span>Сейчас в квесте</span><strong>${m.active||0}</strong><small>активные сессии</small></div><div class="metric yellow"><span>Подарков выдано</span><strong>${f.rewards_unlocked||0}</strong><small>${f.rewarded_users||0} пользователям</small></div><div class="metric green"><span>Бибибонусов заработано</span><strong>${f.bonuses_earned||0}</strong><small>по уникальным QR</small></div><div class="metric"><span>Финальную награду ждут</span><strong>${f.premium_pending||0}</strong><small>${f.premium_issued||0} уже выдано</small></div></div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>Воронка квеста</h2><p class="muted">Где находятся пользователи</p></div></div><div class="funnel">${rows.map(([t,v])=>`<div class="frow"><b>${t}</b><span class="bar"><i style="width:${Math.round((v||0)/max*100)}%"></i></span><strong>${v||0}</strong></div>`).join('')}</div></section><section class="panel"><h2>Кампания</h2><label class="field">Статус<select id="campaign-status"><option value="draft">Черновик</option><option value="active">Активен</option><option value="paused">Пауза</option><option value="ended">Завершён</option></select></label><p class="muted">Участники проходят квест без таймера: прогресс хранится до завершения кампании.</p><button class="btn primary" onclick="saveCampaign()">Сохранить статус</button></section><section class="panel full"><div class="panel-head"><div><h2>Последние участники</h2><p class="muted">Реальный прогресс по QR и Бибибонусам</p></div><button class="btn secondary" style="width:auto" onclick="go('participants')">Все</button></div>${people(model.recent.slice(0,8))}</section></div>`}
function points(){return `${pageHeader('Точки Красной Поляны','Карта зафиксирована: перемещение включается только вручную')}<div class="grid"><section class="panel full"><div class="map-card"><div id="admin-map" class="admin-map"></div><button class="btn secondary map-lock" onclick="toggleMapEdit()">${mapUnlocked?'✓ Завершить перемещение':'✦ Изменить положение'}</button><a class="map-legal" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div></section><section class="panel full"><div class="panel-head"><div><h2>Партнёрские места</h2><p class="muted">Квест проходит в любом порядке</p></div></div><div class="point-list">${model.points.map(p=>`<div class="point-row"><div><b>${p.seq}. ${esc(p.name)}</b><p>${esc(p.address)} · ${esc(p.reward_title)}</p></div><button class="btn secondary" style="width:auto" onclick="editPoint(${p.id})">Редактировать</button></div>`).join('')}</div></section></div>`}

/* Удаление таблички: отключение оставляет код в списке, а удаление
   убирает совсем — нужно, когда наклейка потеряна или напечатана с браком. */
async function removeQr(id){
  if(!confirm('Удалить эту табличку навсегда? Напечатанный QR перестанет работать.'))return;
  try{model=(await api('/api/admin/qr/'+id+'/delete',{method:'POST'})).data;toast('Табличка удалена');render()}
  catch(x){toast(x.message)}}

function qrPage(){return `${pageHeader('QR-коды','Несколько табличек на одну точку, статистика и быстрое отключение')}<div class="grid"><section class="panel full"><div class="panel-head"><div><h2>Физические QR</h2><p class="muted">Полный секрет показывается только в момент создания</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" style="width:auto" onclick="linkQrDialog()">Привязать чужой QR</button><button class="btn primary" style="width:auto" onclick="addQrDialog()">+ Создать QR</button></div></div><div class="qr-list">${model.qr_codes.map(q=>`<div class="qr-row"><div><b>${esc(q.label)}</b><p>Точка ${q.seq}: ${esc(q.point_name)} · код ${esc(q.manual_code)} · сканов ${q.scan_count}</p></div><div><span class="tag ${q.active?'':'off'}">${q.active?'Активен':'Выключен'}</span><button class="danger-small" onclick="toggleQr(${q.id},${q.active?0:1})">${q.active?'Отключить':'Включить'}</button><button class="danger-small" onclick="removeQr(${q.id})">Удалить</button></div></div>`).join('')||'<div class="empty-admin">QR пока нет</div>'}</div></section></div>`}
function premiumTag(p){if(p.premium_status==='issued')return '<span class="tag">Награда выдана</span>';if(p.premium_requested_at)return '<span class="tag off">Заявка ждёт</span>';if(p.premium_status==='pending')return '<span class="tag off">Награда открыта</span>';return ''}
function people(rows){return `<div class="people">${rows.map(p=>`<div class="person"><div><b>${esc(p.display_name)}</b><p>${p.username?'@'+esc(p.username)+' · ':''}TG ${esc(p.user_id)}${p.premium_code?' · ID '+esc(p.premium_code):''} · ${p.completed_points||0}/3 · ${p.bonus_points||0} Бибибонусов${p.started_at?' · '+fmtDate(p.started_at):''}</p></div><div><span class="tag ${p.status==='active'?'':'off'}">${sessionName(p.status)}</span>${premiumTag(p)}${p.premium_status==='pending'&&p.premium_requested_at?`<button class="btn secondary" style="width:auto;min-height:44px;padding:8px 10px;margin-top:5px" onclick="issuePremium('${p.id}')">Выдать награду</button>`:''}<button class="btn danger" style="width:auto;min-height:44px;padding:8px 10px;margin-top:5px" onclick="deleteParticipant('${p.id}')">Удалить</button></div></div>`).join('')||'<div class="empty-admin">Участников пока нет</div>'}</div>`}function participants(){return `${pageHeader('Участники','Прогресс, Бибибонусы и финальные награды')}<section class="panel"><div class="toolbar" style="margin-bottom:14px"><input id="people-search" style="max-width:360px;margin:0" placeholder="Поиск по имени, username или ID" aria-label="Поиск участников" oninput="filterPeople()"><select id="people-status" class="status-select" aria-label="Статус участника" onchange="filterPeople()"><option value="">Все статусы</option><option value="active">В квесте</option><option value="completed">Завершили</option><option value="expired">Истекло</option></select></div><div id="people-list">${people(model.recent)}</div></section>`}
function premiumQueue(){const rows=model.premium_requests||model.recent.filter(p=>p.premium_status==='pending'&&p.premium_requested_at);return `<div class="request-list">${rows.map(p=>`<div class="request-card"><div><b>${esc(p.display_name)}</b><p>${p.username?'@'+esc(p.username)+' · ':''}ID ${esc(p.premium_code)} · ${p.bonus_points||300} Бибибонусов · ${esc(p.premium_phone||'телефон не указан')} · ${new Date(p.premium_requested_at).toLocaleString('ru',{dateStyle:'short',timeStyle:'short'})}</p></div><div class="request-actions"><span class="tag">Подписка + 300 бонусов</span><button class="btn secondary copy-btn" onclick="copyPremiumRequest('${p.id}',event)">Копировать заявку</button><button class="btn primary" onclick="issuePremium('${p.id}')">Выдать награду</button></div></div>`).join('')||'<div class="empty-admin">Новых заявок нет</div>'}</div>`}
function fmtDate(value){if(!value)return '';try{return new Date(value).toLocaleString('ru',{dateStyle:'short',timeStyle:'short'})}catch(_){return value}}
async function copyAdminText(text,button,label='Заявка скопирована'){
  try{
    if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);
    else{const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw new Error('copy failed')}
    if(button){const old=button.textContent;button.textContent='✓ Скопировано';button.classList.add('copied');clearTimeout(button._copyTimer);button._copyTimer=setTimeout(()=>{if(button.isConnected){button.textContent=old;button.classList.remove('copied')}},1800)}
    toast(label);return true
  }catch(_){toast('Не удалось скопировать. Выдели данные вручную.');return false}
}
function premiumRequestText(p){return [
  'Заявка Бибибайк · Подписка 30 дней + 300 Бибибонусов',
  `Участник: ${p.display_name||'не указано'}`,
  `ID участника: ${p.premium_code||'не выдан'}`,
  `Телефон: ${p.premium_phone||'не указан'}`,
  `Бибибонусы: ${p.bonus_points||300}`,
  `Telegram: ${p.username?'@'+p.username:'username не указан'}`,
  `Telegram ID: ${p.user_id||'не указан'}`,
  `Дата заявки: ${fmtDate(p.premium_requested_at)||'не указана'}`,
  `Статус: ${p.premium_status==='issued'?'подписка и бонусы выданы':'ожидает выдачи'}`
].join('\n')}
function copyPremiumRequest(id,event){const rows=model.premium_requests||model.recent||[],p=rows.find(x=>String(x.id)===String(id));if(!p)return toast('Заявка не найдена');return copyAdminText(premiumRequestText(p),event?.currentTarget)}
function supportConversationText(data){const c=data?.conversation||{},messages=data?.messages||[],head=[
  'Обращение в поддержку Бибибайк',
  `Участник: ${c.display_name||'не указано'}`,
  `ID участника: ${c.participant_code||'не выдан'}`,
  `Телефон: ${c.phone||'не указан'}`,
  `Telegram: ${c.username?'@'+c.username:'username не указан'}`,
  `Telegram ID: ${c.user_id||'не указан'}`,
  `Статус: ${c.status==='closed'?'закрыто':'открыто'}`,

function initMap(){const n=document.getElementById('admin-map');if(!n)return;destroyAdminMap();if(!window.L){n.innerHTML='<div class="map-fallback"><b>Карта не загрузилась</b><span>Точки можно редактировать из списка ниже.</span><button class="btn secondary" onclick="go(\'points\')">Повторить</button></div>';return}/* Если сервер не прислал границы, берём Красную Поляну по умолчанию:   раньше это исключение гасило всю карту целиком. */const raw=model?.map_bounds;const b=(raw&&[raw.south,raw.west,raw.north,raw.east].every(Number.isFinite))?raw:{south:43.60,west:40.10,north:43.77,east:40.37};const area=L.latLngBounds([b.south,b.west],[b.north,b.east]);adminMap=L.map(n,{zoomControl:true,attributionControl:false,maxBounds:area,maxBoundsViscosity:1,minZoom:10,maxZoom:18,scrollWheelZoom:false});const sources=(model.map?.tile_urls?.length?model.map.tile_urls:[model.map?.tile_url]).filter(Boolean);if(!sources.length)sources.push('https://tile.openstreetmap.org/{z}/{x}/{y}.png');let sourceIndex=0,tiles=null,tileWarning=false;/* Источники перебираются по очереди: если один недоступен (VPN, оператор,   блокировка), карта сама переходит к следующему, а не остаётся пустой. */const mountTiles=()=>{if(tiles)adminMap.removeLayer(tiles);  tiles=L.tileLayer(sources[sourceIndex],{minZoom:10,maxZoom:18,noWrap:true,bounds:area,keepBuffer:2}).addTo(adminMap);  let ok=false,errors=0;  tiles.on('tileload',()=>{ok=true;n.querySelector('.map-tile-warning')?.remove()});  tiles.on('tileerror',()=>{errors++;if(ok||errors<4)return;    if(sourceIndex<sources.length-1){sourceIndex++;mountTiles();return}    if(tileWarning)return;tileWarning=true;    n.insertAdjacentHTML('beforeend','<div class="map-tile-warning">Подложка недоступна · точки и редактирование работают</div>')})};mountTiles();const pts=[];model.points.forEach(p=>{const ll=[p.latitude,p.longitude];pts.push(ll);const markerIcon=L.divIcon({className:'bb-admin-marker-wrap',html:`<span class="bb-admin-marker">${p.seq}</span>`,iconSize:[44,44],iconAnchor:[22,22]});const m=L.marker(ll,{draggable:false,icon:markerIcon,title:p.name,keyboard:true}).addTo(adminMap).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.reward_title)}`);m.getElement()?.setAttribute('aria-label',`${p.seq}. ${p.name}`);m.pointId=p.id;m.on('dragend',()=>{const x=m.getLatLng();draftCoords={id:p.id,lat:x.lat,lng:x.lng};editPoint(p.id,draftCoords)});L.circle(ll,{radius:p.radius_m,color:'#18c943',weight:2,fillColor:'#18c943',fillOpacity:.09}).addTo(adminMap)});pts.length?adminMap.fitBounds(pts,{padding:[45,45],maxZoom:14}):adminMap.setView([43.68,40.21],12);mapUnlocked=false;setMapInteraction(false);renderMapLock();setTimeout(()=>{try{adminMap?.invalidateSize()}catch(error){console.warn('Не удалось обновить размер карты CRM',error)}},100)}function setMapInteraction(enabled){if(!adminMap)return;['dragging','touchZoom','doubleClickZoom','boxZoom','keyboard','scrollWheelZoom'].forEach(name=>adminMap[name]?.[enabled?'enable':'disable']());const zoom=adminMap.zoomControl?.getContainer();if(zoom){zoom.style.pointerEvents=enabled?'auto':'none';zoom.style.opacity=enabled?'1':'.45'}}function toggleMapEdit(){if(!adminMap)return toast('Карта ещё загружается');try{mapUnlocked=!mapUnlocked;setMapInteraction(mapUnlocked);adminMap.eachLayer(x=>{if(x instanceof L.Marker)x.dragging?.[mapUnlocked?'enable':'disable']()});renderMapLock()}catch(error){console.error('Ошибка режима редактирования карты',error);destroyAdminMap();toast('Не удалось включить редактирование. Перезагрузи раздел «Точки».')}}function renderMapLock(){const b=document.querySelector('.map-lock');if(b)b.textContent=mapUnlocked?'✓ Завершить перемещение':'✦ Изменить положение'}
function editPoint(id,coords=null){const p=model.points.find(x=>x.id===id),lat=coords?.lat??p.latitude,lng=coords?.longitude??coords?.lng??p.longitude;modal.innerHTML=`<div class="modal"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="point-dialog-title"><div class="sheet-head"><div><p class="eyebrow">Точка ${p.seq}</p><h2 id="point-dialog-title">${esc(p.name)}</h2></div><button class="icon-btn" aria-label="Закрыть" onclick="closeModal()">×</button></div><form onsubmit="savePoint(event,${id})"><label class="field">Название<input name="name" required value="${esc(p.name)}"></label><label class="field">Адрес<input name="address" required value="${esc(p.address)}"></label><div class="point-form-grid"><label class="field">Широта<input name="latitude" inputmode="decimal" required value="${lat}"></label><label class="field">Долгота<input name="longitude" inputmode="decimal" required value="${lng}"></label></div><p class="muted">Координаты принимаются только внутри зоны Красной Поляны.</p><label class="field">Радиус, м<input name="radius_m" type="number" min="30" max="500" value="${p.radius_m}"></label><label class="field">Описание локации<textarea name="description" rows="3" placeholder="Чем это место интересно и зачем сюда ехать — 1-2 предложения">${esc(p.description||'')}</textarea></label>

async function savePoint(e,id){e.preventDefault();const button=e.submitter;if(button)button.disabled=true;try{model=(await api('/api/admin/points/'+id,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))})).data;draftCoords=null;closeModal();toast('Точка сохранена');render()}catch(x){if(button)button.disabled=false;toast(x.message)}}function closeModal(){stopLinkScan();modal.innerHTML='';activeSupport=null;crm.inert=false;crm.removeAttribute('aria-hidden');document.body.classList.remove('admin-modal-open');const trigger=modalTrigger;modalTrigger=null;if(draftCoords){draftCoords=null;mapUnlocked=false;go('points')}else if(trigger?.isConnected)trigger.focus()}

function linkQrDialog(){modal.innerHTML=`<div class="modal"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="link-qr-title"><div class="sheet-head"><h2 id="link-qr-title">Привязать существующий QR</h2><button class="icon-btn" aria-label="Закрыть" onclick="stopLinkScan();closeModal()">×</button></div><p class="muted">Уже напечатанная табличка партнёра. Переклеивать ничего не нужно — код останется прежним.</p><label class="field">Точка<select id="lq-point">${model.points.map(p=>`<option value="${p.id}">${p.seq}. ${esc(p.name)}</option>`).join('')}</select></label><label class="field">Название таблички<input id="lq-label" placeholder="Например: наклейка на кассе"></label><div id="lq-cam" style="display:none;margin:10px 0"><video id="lq-video" playsinline style="width:100%;border-radius:14px;background:#000"></video><p class="muted" style="margin-top:6px">Наведи камеру на код партнёра</p></div><label class="field">Содержимое кода<input id="lq-code" placeholder="Отсканируй или впиши вручную"></label><button class="btn secondary" onclick="startLinkScan()">Сканировать камерой</button><button class="btn primary" style="margin-top:8px" onclick="submitLinkQr()">Привязать к точке</button></section></div>`}

let lqStream=null,lqTimer=null;
async function startLinkScan(){
  const box=document.getElementById('lq-cam'),video=document.getElementById('lq-video');
  if(!('BarcodeDetector' in window)){toast('Камера не поддерживается — впиши код вручную');return}
  try{
    lqStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=lqStream; await video.play(); box.style.display='block';
    const det=new BarcodeDetector({formats:['qr_code']});
    lqTimer=setInterval(async()=>{
      try{
        const found=await det.detect(video);
        if(found.length){
          document.getElementById('lq-code').value=found[0].rawValue;
          stopLinkScan(); toast('Код считан');
        }
      }catch(_){}
    },400);
  }catch(_){toast('Нет доступа к камере — впиши код вручную')}
}
function stopLinkScan(){
  if(lqTimer){clearInterval(lqTimer);lqTimer=null}
  if(lqStream){lqStream.getTracks().forEach(t=>t.stop());lqStream=null}
  const box=document.getElementById('lq-cam'); if(box)box.style.display='none';
}
async function submitLinkQr(){
  const id=+document.getElementById('lq-point').value;
  const code=document.getElementById('lq-code').value.trim();
  const label=document.getElementById('lq-label').value;
  if(!code)return toast('Отсканируй код или впиши его вручную');
  try{
    model=(await api('/api/admin/points/'+id+'/qr/link',{method:'POST',
      body:JSON.stringify({code,label})})).data;
    stopLinkScan(); closeModal(); render(); toast('QR привязан к точке');
  }catch(x){toast(x.message||'Не удалось привязать')}
}

t(active?'QR включён':'QR отключён');render()}catch(x){toast(x.message)}}
function filterPeople(){const q=document.getElementById('people-search').value.toLowerCase(),s=document.getElementById('people-status').value;document.getElementById('people-list').innerHTML=people(model.recent.filter(p=>(!s||p.status===s)&&(!q||[p.display_name,p.username,p.user_id,p.premium_code].join(' ').toLowerCase().includes(q))))}function sessionName(v){return{active:'В квесте',completed:'Завершил',expired:'Истёк',cancelled:'Отменён',awaiting_location:'В квесте'}[v]||v}
async function saveCampaign(){try{const titleInput=document.getElementById('premium-title'),instructionInput=document.getElementById('premium-instruction'),status=document.getElementById('campaign-status')?.value||model.campaign.status,duration=+(document.getElementById('campaign-duration')?.value||model.campaign.session_duration_min),premium_title=titleInput?titleInput.value.trim():model.campaign.premium_title,premium_instruction=instructionInput?instructionInput.value.trim():model.campaign.premium_instruction;if(!premium_title||!premium_instruction)return toast('Заполни название и условия награды');model=(await api('/api/admin/campaign',{method:'POST',body:JSON.stringify({status,session_duration_min:duration,premium_title,premium_instruction})})).data;toast('Настройки сохранены');render()}catch(x){toast(x.message)}}async function issuePremium(id){if(!confirm('Подтвердить выдачу подписки на 30 дней и 300 Бибибонусов?'))return;try{const result=await api('/api/admin/premium/'+id+'/issued',{method:'POST',body:'{}'});model=result.data;render();toast(result.notified?'Награда выдана, участник уведомлён':'Награда выдана. Участника не удалось уведомить — напиши ему вручную.')}catch(x){toast(x.message)}}
function showAdminLogin(message=''){
  document.getElementById('desktop-nav').innerHTML='';
  document.getElementById('mobile-nav').innerHTML='';
  el.innerHTML=`<div class="login-wrap"><form class="login-card" onsubmit="loginAdmin(event)">
    <img src="/static/bb-bike-logo.jpg" alt="Бибибайк"><h1>Вход в CRM</h1>
    <p>Введи пароль администратора. Telegram ID и персональные ссылки больше не нужны.</p>
    <label class="field">Пароль<input id="admin-password" type="password" autocomplete="current-password" required autofocus></label>
    <div class="login-error" id="login-error">${esc(message)}</div>
    <button class="btn primary">Войти</button><button type="button" class="btn quiet" onclick="location.replace('/')">Открыть квест</button>
  </form></div>`}
async function loginAdmin(event){event.preventDefault();const button=event.submitter,input=document.getElementById('admin-password');button.disabled=true;try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:input.value})});await load()}catch(x){document.getElementById('login-error').textContent=x.message;button.disabled=false;input.focus();input.select()}}
async function logoutAdmin(){try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch(_){}model=null;showAdminLogin('Сессия завершена.')}
async function downloadCsv(){try{const r=await fetch('/api/admin/export.csv',{credentials:'same-origin'});if(!r.ok)throw Error('Не удалось скачать');const b=await r.blob(),a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download='bibibike-subscription-30-days.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(x){toast(x.message)}}
async function load(){try{model=(await api('/api/admin/overview')).data;render()}catch(x){showAdminLogin(x.status===401?'':'CRM временно недоступна. Попробуй ещё раз.')}}
async function refreshAdmin(){const tag=document.activeElement?.tagName;if(!model||document.hidden||modal.innerHTML||['INPUT','TEXTAREA','SELECT'].includes(tag))return;try{const fresh=(await api('/api/admin/overview')).data;if(JSON.stringify(fresh)!==JSON.stringify(model)){model=fresh;render()}}catch(_){/* текущие данные остаются на экране */}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAdmin()});setInterval(refreshAdmin,30000);
tg?.ready();tg?.expand();if(tg?.isVersionAtLeast?.('8.0'))try{tg?.requestFullscreen?.()}catch(_){}tg?.setHeaderColor?.('#07130b');tg?.setBackgroundColor?.('#07130b');load();
