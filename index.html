<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06130b">
  <title>Паспорт Красной Поляны · bb.bike</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="app"><div class="shell" id="app"><div class="splash"><img src="/static/bb-bike-logo.jpg" alt="bb.bike"><span>Открываем паспорт…</span></div></div></main>
<div id="modal"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const tg=window.Telegram?.WebApp,initData=tg?.initData||'',root=document.getElementById('app'),modal=document.getElementById('modal');
let state=null,botUsername='',localPosition=null,pointOrder=[],selectedSeq=null,modalTrigger=null;
const dev=location.hostname==='127.0.0.1'||location.hostname==='localhost';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function requestId(){return crypto.randomUUID?.()||Date.now()+'-'+Math.random()}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'tma '+initData,'Content-Type':'application/json',...(options.headers||{})}}),p=await r.json().catch(()=>({ok:false,message:'Сервис не ответил'}));if(!r.ok||p.ok===false)throw new Error(p.message||'Ошибка');return p}
function eventLog(event_type,point_id=null,navigator=''){api('/api/quest/event',{method:'POST',body:JSON.stringify({event_type,point_id,navigator,request_id:requestId()})}).catch(()=>{})}
function toast(text){const n=document.getElementById('toast');n.textContent=text;n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),3200)}
function show(html){root.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});setTimeout(syncBackButton,0)}
function completed(){return (state?.points||[]).filter(p=>p.completed_at).length}
function pointBySeq(seq){return state?.points?.find(p=>p.seq===Number(seq))}
function openPoints(){return (state?.points||[]).filter(p=>!p.completed_at)}
function orderedPoints(){const src=[...(state?.points||[])];return pointOrder.length?src.sort((a,b)=>pointOrder.indexOf(a.seq)-pointOrder.indexOf(b.seq)):src}
function shortName(p){return String(p?.point_name||('Точка '+p?.seq)).replace(/[«»"']/g,'').split(/\s+/).slice(0,2).join(' ')}
function completedTime(value){if(!value)return '';const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function distance(a,b,c,d){const r=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*r*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function localDistance(p){return localPosition?distance(localPosition.lat,localPosition.lon,p.latitude,p.longitude):null}
function fmt(m){return m==null?'':m<1000?Math.round(m)+' м':(m/1000).toFixed(1).replace('.',',')+' км'}
function header(right=''){return `<header class="topbar"><button class="brand" onclick="routeScreen()" aria-label="К маршруту"><img src="/static/bb-bike-logo.jpg" alt=""><span>Квест <b>bb.bike</b></span></button>${right}</header>`}
function icon(name){const paths={back:'<path d="m15 18-6-6 6-6"/>',passport:'<path d="M6 3h11a2 2 0 0 1 2 2v16H7a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Z"/><path d="M8 3v18M11 9h5M11 13h5"/>',locate:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',route:'<path d="M6 19c0-4 4-4 4-7s-4-3-4-6M18 5c0 4-4 4-4 7s4 3 4 7"/><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/>',scan:'<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8h3v3H8zM14 8h2M14 11h3M8 14h2M13 14h3v3h-3z"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="m9 18 6-6-6-6"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||''}</svg>`}
function stampRail(active=selectedSeq){return `<section class="stamp-rail" aria-label="Штампы паспорта">${(state?.points||[]).map(p=>{const done=!!p.completed_at,chosen=Number(active)===p.seq;return `<button class="stamp-slot ${done?'stamped':''} ${chosen?'selected':''}" onclick="selectPoint(${p.seq})"><span>${done?esc(shortName(p)):p.seq}</span>${done?`<small>${completedTime(p.completed_at)}</small>`:'<small>точка</small>'}</button>`}).join('')}<div class="stamp-total"><b>${completed()}</b><span>из 3<br>штампов</span></div></section>`}
function routeStage(p){const d=localDistance(p),label=d!=null?fmt(d):'точка '+p.seq;return `<section class="route-stage"><div class="topography" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="route-line" aria-hidden="true"><span class="route-start">bb.</span><span class="route-dash"></span><span class="route-pin">${p.seq}</span></div><div class="stage-caption"><span>${localPosition?'ближайшие рассчитаны':'схема квеста'}</span><b>${esc(shortName(p))}</b></div><button class="locate-mini" onclick="nearest()">${icon('locate')}<span>${localPosition?'Пересчитать':'Что ближе?'}</span></button><div class="map-note">Схема маршрута · путь откроется в навигаторе.</div></section><section class="point-dossier"><div class="point-index">${p.seq}</div><div><p class="micro">${d!=null?label:'ВЫБРАННАЯ ТОЧКА'}</p><h1>${esc(p.point_name)}</h1><p>${esc(p.address)}</p></div></section>`}
function stickyActions(p){if(p.completed_at)return `<div class="sticky-actions"><button class="btn primary" onclick="showReward(${p.seq})">Открыть подарок</button><button class="btn secondary" onclick="passportScreen()">Паспорт участника</button></div>`;return `<div class="sticky-actions"><button class="btn primary" onclick="chooseNavigator(${p.seq})">${icon('route')}<span>Построить маршрут${localDistance(p)!=null?' · '+fmt(localDistance(p)):''}</span></button><button class="btn secondary" onclick="scanPoint(${p.seq})">${icon('scan')}<span>Поставить штамп · QR</span></button></div>`}
function cover(){show(`<section class="passport-cover"><div class="cover-grain"></div><div class="cover-brand"><img src="/static/bb-bike-logo.jpg" alt="bb.bike"><span>КВЕСТ · КРАСНАЯ ПОЛЯНА</span></div><div class="cover-copy"><p class="micro">ПАСПОРТ ДОЛИНЫ</p><h1>Три места.<br>Три штампа.<br>Один Premium.</h1><p>Проходи точки в любом порядке и забирай подарки партнёров.</p></div><div class="cover-stamps">${[1,2,3].map(i=>`<span>${i}</span>`).join('')}</div><div class="cover-facts"><span>3 точки</span><span>3 подарка</span><span>30 дней Premium</span></div><label class="consent"><input id="rules-ok" type="checkbox"><span>Принимаю <a href="/privacy.html" target="_blank">правила квеста</a>. Геопозиция не передаётся боту.</span></label><button class="btn cover-button" onclick="startQuest(event)">Открыть паспорт</button><button class="text-button" onclick="rules()">Как всё работает</button></section>`)}
async function startQuest(e){if(!document.getElementById('rules-ok')?.checked)return toast('Сначала прими правила квеста');e.currentTarget.disabled=true;try{state=(await api('/api/quest/start',{method:'POST',body:JSON.stringify({privacy_accepted:true,request_id:requestId()})})).data;selectedSeq=openPoints()[0]?.seq||state.points[0]?.seq;routeScreen()}catch(x){toast(x.message);e.currentTarget.disabled=false}}
function routeScreen(seq=selectedSeq){if(!state?.session)return cover();if(completed()===3)return passportScreen();const pending=openPoints(),fallback=pending[0]||state.points[0];let p=pointBySeq(seq)||fallback;if(p.completed_at&&pending.length)p=pending[0];selectedSeq=p.seq;eventLog('catalog_open');show(`${header(`<button class="passport-link" onclick="passportScreen()">Паспорт <b>${completed()}/3</b></button>`)}${stampRail(p.seq)}${routeStage(p)}<section class="reward-strip"><span>ПОДАРОК НА ЭТОЙ ТОЧКЕ</span><strong>${esc(p.reward_title)}</strong><p>${esc(p.reward_text)}</p>${p.partner_hours?`<small>Открыто: ${esc(p.partner_hours)}</small>`:''}</section><p class="free-order">Можно проходить в любом порядке</p>${stickyActions(p)}`)}
function selectPoint(seq){if(state?.campaign?.status!=='active'||state?.session?.status!=='active')return toast('Сейчас можно смотреть паспорт и полученные подарки, но продолжить маршрут нельзя');selectedSeq=Number(seq);routeScreen(selectedSeq)}
async function nearest(){try{const pos=await oneLocation();if(!pos)return toast('Не удалось определить местоположение');localPosition=pos;pointOrder=[...openPoints()].sort((a,b)=>distance(pos.lat,pos.lon,a.latitude,a.longitude)-distance(pos.lat,pos.lon,b.latitude,b.longitude)).map(x=>x.seq);const first=pointOrder[0];if(first)selectedSeq=first;routeScreen();toast('Ближайшая точка выбрана. Координата осталась на телефоне.')}catch(_){toast('Разреши разовую геопозицию в настройках Telegram')}}
function oneLocation(){return new Promise(resolve=>{let ended=false;const finish=v=>{if(!ended){ended=true;resolve(v)}};setTimeout(()=>finish(null),6500);if(tg?.LocationManager){const get=()=>tg.LocationManager.getLocation(v=>finish(v?{lat:v.latitude,lon:v.longitude}:null));tg.LocationManager.isInited?get():tg.LocationManager.init(get)}else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(v=>finish({lat:v.coords.latitude,lon:v.coords.longitude}),()=>finish(null),{enableHighAccuracy:false,timeout:5500,maximumAge:120000});else finish(null)})}
function passportCard(p){const done=!!p.completed_at;return `<button class="passport-place ${done?'done':''}" onclick="${done?`showReward(${p.seq})`:`selectPoint(${p.seq})`}"><div class="mini-stamp"><span>${done?esc(shortName(p)):p.seq}</span>${done?`<small>${completedTime(p.completed_at)} · QR</small>`:'<small>БЕЗ ШТАМПА</small>'}</div><div><b>${esc(p.point_name)}</b><span>${done?esc(p.reward_title):esc(p.address)}</span></div>${icon('arrow')}</button>`}
function passportScreen(lockMessage=''){if(!lockMessage&&state?.campaign?.status!=='active')lockMessage='Квест сейчас на паузе. Полученные штампы и подарки сохранены.';if(!lockMessage&&state?.session?.status==='expired')lockMessage='Время маршрута закончилось. Полученные штампы и подарки сохранены.';const n=completed(),remaining=openPoints()[0],locked=!!lockMessage,canContinue=remaining&&!locked;show(`${header(`<span class="count-label">${n} / 3</span>`)}<section class="passport-page">${locked?`<div class="expired-note">${esc(lockMessage)}</div>`:''}<div class="passport-title"><p class="micro">BB.BIKE · КРАСНАЯ ПОЛЯНА</p><h1>${n===3?'Паспорт заполнен':'Паспорт участника'}</h1><p>Три штампа партнёров · один месяц Premium</p></div><div class="passport-grid">${(state.points||[]).map(passportCard).join('')}</div><section class="premium-card ${n===3?'unlocked':''}"><img src="/static/bb-bike-logo.jpg" alt=""><div><b>${esc(state.campaign.premium_title)}</b><span>${n===3?esc(state.campaign.premium_instruction):`Откроется после ${3-n} ${3-n===1?'штампа':'штампов'}`}</span></div></section>${n===3?`<section class="premium-code"><span>ТВОЙ PREMIUM</span><strong>${esc(state.premium?.public_code||'Оформляется')}</strong><button onclick="copyPremium()">${icon('copy')} Скопировать</button></section>`:''}${canContinue?`<button class="btn primary passport-cta" onclick="selectPoint(${remaining.seq})">К точке «${esc(shortName(remaining))}»</button>`:n===3?'<button class="btn primary passport-cta" onclick="copyPremium()">Скопировать Premium</button>':`<a class="btn secondary passport-cta support-link" href="${esc(state.support_url)}">Связаться с поддержкой</a>`}${!locked&&n<3?'<button class="btn quiet" onclick="routeScreen()">Вернуться к маршруту</button>':''}</section>`)}
function presentModal(html){modalTrigger=document.activeElement;modal.innerHTML=html;const sheet=modal.querySelector('.sheet');sheet?.setAttribute('role','dialog');sheet?.setAttribute('aria-modal','true');syncBackButton();setTimeout(()=>modal.querySelector('button,input')?.focus(),0)}
function chooseNavigator(seq){const p=pointBySeq(seq);selectedSeq=seq;presentModal(`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="sheet-head"><div><p class="micro">КАК ДОБРАТЬСЯ</p><h2>${esc(p.point_name)}</h2></div><button class="icon-button" aria-label="Закрыть" onclick="closeModal()">×</button></div><p class="sheet-copy">Навигатор сам определит твоё текущее местоположение.</p><div class="navigator-list"><button onclick="openRoute(${seq},'yandex','bc')"><span class="provider yandex">Я</span><b>Яндекс · Бибибайк</b>${icon('arrow')}</button><button onclick="openRoute(${seq},'yandex','pd')"><span class="provider yandex">Я</span><b>Яндекс · пешком</b>${icon('arrow')}</button><button onclick="openRoute(${seq},'2gis','car')"><span class="provider dgis">2</span><b>2ГИС · на машине</b>${icon('arrow')}</button><button onclick="openRoute(${seq},'2gis','pedestrian')"><span class="provider dgis">2</span><b>2ГИС · пешком</b>${icon('arrow')}</button></div><button class="btn quiet" onclick="copyAddress(${seq})">Скопировать адрес</button></section></div>`)}
function openRoute(seq,provider,mode){const p=pointBySeq(seq);eventLog('navigator_open',p.point_id,provider);const url=provider==='yandex'?`https://yandex.ru/maps/?rtext=~${p.latitude},${p.longitude}&rtt=${mode}`:`https://2gis.ru/routeSearch/${mode==='pedestrian'?'rsType/pedestrian/':''}to/${p.longitude},${p.latitude}/go`;closeModal();tg?.openLink?tg.openLink(url):window.open(url,'_blank','noopener')}
function copyAddress(seq){const p=pointBySeq(seq);navigator.clipboard?.writeText(p.address);toast('Адрес скопирован')}
function scanPoint(seq){const p=pointBySeq(seq);selectedSeq=seq;eventLog('qr_open',p.point_id);if(tg?.showScanQrPopup)tg.showScanQrPopup({text:'Наведи камеру на зелёную табличку bb.bike'},value=>{tg.closeScanQrPopup();submitQr(value);return true});else manualCode()}
function manualCode(){presentModal(`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="sheet-head"><div><p class="micro">РУЧНОЙ ВВОД</p><h2>Код точки</h2></div><button class="icon-button" aria-label="Закрыть" onclick="closeModal()">×</button></div><p class="sheet-copy">Введи короткий код с зелёной таблички bb.bike.</p><label class="field">Код<input id="manual-code" autocomplete="off" autocapitalize="characters" maxlength="80" placeholder="Например: A1B2C3"></label><button class="btn primary" onclick="submitQr(document.getElementById('manual-code').value)">Поставить штамп</button></section></div>`)}
async function submitQr(value){if(!value)return toast('Код не распознан');try{const before=completed();state=(await api('/api/quest/scan',{method:'POST',body:JSON.stringify({qr_code:value,request_id:requestId()})})).data;closeModal();const after=completed();after>before?stampSuccess(state.event?.point_completed):routeScreen()}catch(x){toast(x.message)}}
function stampSuccess(seq){const p=pointBySeq(seq),n=completed();show(`${header(`<span class="count-label">${n} ${n===1?'штамп':'штампа'}</span>`)}<section class="stamp-success"><div class="stamp-seal"><span>КРАСНАЯ ПОЛЯНА</span><strong>${esc(shortName(p))}</strong><small>${completedTime(p.completed_at)} · QR</small></div><p class="micro">ШТАМП В ПАСПОРТЕ</p><h1>${n===3?'Паспорт заполнен':n===2?'Остался один':'Первый поставлен'}</h1><p class="success-copy">${n===3?'Все три точки пройдены. Premium уже в паспорте.':`Подарок сохранён. До Premium — ${3-n} ${3-n===1?'штамп':'штампа'}.`}</p><section class="reward-code"><span>ПРОМОКОД ТОЧКИ</span><div><strong>${esc(p.reward_code||'Сохранён')}</strong><button onclick="copyPointCode(${p.seq})">${icon('copy')}<span>Копировать</span></button></div></section>${stampRail(seq)}<button class="btn primary stamp-next" onclick="${n===3?'passportScreen()':'selectPoint(openPoints()[0]?.seq)'}">${n===3?'Открыть заполненный паспорт':'Выбрать следующий штамп'}</button></section>`);tg?.HapticFeedback?.notificationOccurred('success')}
function showReward(seq){const p=pointBySeq(seq);show(`${header(`<button class="icon-button" onclick="passportScreen()">${icon('back')}</button>`)}<section class="saved-reward"><div class="stamp-seal small"><span>ПОДАРОК ПАРТНЁРА</span><strong>${esc(shortName(p))}</strong><small>${completedTime(p.completed_at)} · QR</small></div><p class="micro">СОХРАНЕНО В ПАСПОРТЕ</p><h1>${esc(p.reward_title)}</h1><p>${esc(p.reward_text)}</p><section class="reward-code"><span>ПРОМОКОД</span><div><strong>${esc(p.reward_code||'Сохранён')}</strong><button onclick="copyPointCode(${p.seq})">${icon('copy')}<span>Копировать</span></button></div></section><button class="btn primary" onclick="passportScreen()">Вернуться в паспорт</button></section>`)}
function copyPointCode(seq){const code=pointBySeq(seq)?.reward_code||'';navigator.clipboard?.writeText(code);toast('Промокод скопирован')}
function copyPremium(){const code=state?.premium?.public_code||'';navigator.clipboard?.writeText(code);toast(code?'Premium скопирован':'Premium ещё оформляется')}
function closeModal(){modal.innerHTML='';modalTrigger?.focus?.();modalTrigger=null;syncBackButton()}
function syncBackButton(){if(!tg?.BackButton)return;const canGoBack=!!modal.innerHTML||!!root.querySelector('.rules,.saved-reward,.stamp-success,.passport-page');canGoBack?tg.BackButton.show():tg.BackButton.hide()}
function handleBack(){if(modal.innerHTML)return closeModal();if(root.querySelector('.rules'))return state?.session?routeScreen():cover();if(root.querySelector('.saved-reward,.stamp-success'))return passportScreen();if(root.querySelector('.passport-page'))return completed()<3&&state?.session?.status==='active'?routeScreen():tg?.close?.();tg?.close?.()}
function rules(){show(`${header(`<button class="icon-button" onclick="cover()">${icon('back')}</button>`)}<section class="rules"><p class="micro">КАК ЭТО РАБОТАЕТ</p><h1>Паспорт без сложных правил</h1><ol><li><span>1</span><div><b>Выбери любую точку</b><p>Порядок не важен. Можно начать с ближайшей или самой интересной.</p></div></li><li><span>2</span><div><b>Открой привычный навигатор</b><p>Яндекс Карты или 2ГИС построят настоящий маршрут.</p></div></li><li><span>3</span><div><b>Найди QR партнёра</b><p>После полной остановки отсканируй зелёную табличку и получи штамп.</p></div></li></ol><div class="privacy-note"><b>Без слежения</b><p>Кнопка «Что ближе?» использует координату один раз только на телефоне. Бот её не получает.</p></div><button class="btn primary" onclick="cover()">Понятно</button></section>`)}
function emptyState(title,text,action='refresh()'){show(`${header()}<section class="empty"><div class="empty-stamp">bb.</div><h1>${esc(title)}</h1><p>${esc(text)}</p><button class="btn secondary" onclick="${action}">Проверить снова</button></section>`)}
function render(){if(!state?.campaign)return emptyState('Маршрут ещё готовят','Скоро здесь появятся точки Красной Поляны.');if(state.campaign.status!=='active')return state.session&&completed()?passportScreen('Квест сейчас на паузе. Полученные штампы и подарки сохранены.'):emptyState('Квест сейчас на паузе','Паспорт и уже полученные подарки останутся на месте.');if(!state.session)return cover();if(state.session.status==='expired')return completed()?passportScreen('Время маршрута закончилось. Полученные штампы и подарки сохранены.'):emptyState('Время квеста закончилось','Напиши поддержке, если нужна помощь.');selectedSeq=selectedSeq||openPoints()[0]?.seq||state.points[0]?.seq;completed()===3?passportScreen():routeScreen()}
async function refresh(){try{const payload=await api('/api/quest/state');state=payload.data;botUsername=payload.bot_username||'';render()}catch(e){emptyState('Не получилось открыть паспорт','Проверь интернет и попробуй ещё раз.')}}
window.addEventListener('offline',()=>toast('Нет сети. Паспорту ничего не угрожает.'));
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.innerHTML)return closeModal();if(event.key==='Tab'&&modal.innerHTML){const items=[...modal.querySelectorAll('button,input,a[href]')].filter(x=>!x.disabled);if(!items.length)return;const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
tg?.BackButton?.onClick(handleBack);
tg?.ready();tg?.expand();tg?.setHeaderColor?.('#06130b');tg?.setBackgroundColor?.('#06130b');tg?.disableVerticalSwipes?.();setTimeout(refresh,80);
</script>
</body>
</html>
