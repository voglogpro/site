<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06130b">
  <title>Паспорт Красной Поляны · bb.bike</title>
  <style>
/* Стили встроены в файл: отдельный app.css больше не нужен. */
:root{
  color-scheme:dark;
  /* Палитра макета «Квест долины»: глубокий хвойный фон и
     салатовый акцент — он ярче изумрудного и лучше читается на карте. */
  --canvas:#07110b;
  --surface:#0d1a12;
  --raised:#122015;
  --ink:#f2f7f1;
  --muted:#93a596;
  --line:rgba(150,220,120,.16);
  --green:#8fe300;          /* основной акцент, кнопки, активные состояния */
  --stamp:#a6f22a;          /* подписи и микро-лейблы */
  --cyan:#3d8bfd;           /* информационный блок про геопозицию */
  --black:#07110b;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font)}
html{scroll-behavior:smooth}
body{-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--stamp)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
.shell{width:min(100%,430px);margin:auto}
.splash{min-height:90dvh;display:grid;place-content:center;justify-items:center;gap:18px;color:var(--muted);font-weight:650}
.splash img{width:82px;height:82px;border-radius:18px;object-fit:cover}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{min-height:44px;border:0;background:none;padding:0;display:flex;align-items:center;gap:10px;color:var(--ink);font-size:16px;font-weight:650}
.brand img{background:var(--green);width:31px;height:31px;border-radius:50%;object-fit:cover}
.brand b{font-weight:850}
.passport-link,.count-label{min-height:44px;border:0;background:none;padding:0;color:#c9ffbd;font-size:13px;font-weight:720}
.passport-link b{margin-left:5px;color:var(--ink)}
.count-label{display:flex;align-items:center;font-family:var(--mono);letter-spacing:.04em}
.icon-button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center}
.micro{margin:0 0 8px;color:var(--stamp);font:700 11px/1.25 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.btn{width:100%;min-height:56px;border:1px solid var(--line);border-radius:16px;
  background:var(--raised);padding:13px 16px;display:flex;align-items:center;
  justify-content:center;gap:9px;font-weight:800;font-size:16px;line-height:1.15;
  letter-spacing:-.01em;transition:transform .12s,background-color .12s}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:var(--green);background:var(--green);color:var(--black)}
.btn.secondary{background:#09190f}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.55}
.btn:focus-visible,.stamp-slot:focus-visible,.passport-place:focus-visible,.brand:focus-visible,.navigator-list button:focus-visible,.locate-mini:focus-visible,.icon-button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* Обложка */
.passport-cover{position:relative;isolation:isolate;min-height:calc(100dvh - max(20px,env(safe-area-inset-top)) - max(30px,env(safe-area-inset-bottom)));overflow:hidden;padding:8px 4px 18px;border:0;border-radius:0;background:transparent}
.passport-cover:before,.passport-cover:after{content:none}
.passport-cover:before{width:510px;height:250px;left:-225px;top:178px;box-shadow:0 0 0 34px #83ff7809,0 0 0 72px #83ff7808,0 0 0 112px #83ff7807}
.passport-cover:after{width:420px;height:190px;right:-260px;bottom:160px;box-shadow:0 0 0 30px #83ff7809,0 0 0 64px #83ff7808}
.cover-grain{position:absolute;inset:0;z-index:-1;opacity:.07;background-image:repeating-linear-gradient(118deg,transparent 0 13px,#fff 14px 15px,transparent 16px 31px);mask-image:linear-gradient(to bottom,#000,transparent 90%)}
.cover-brand{display:flex;align-items:center;gap:11px;font:700 11px/1 var(--mono);letter-spacing:.06em}
.cover-brand img{width:47px;height:47px;border-radius:12px;object-fit:cover}
.cover-copy{margin:11dvh 0 7dvh}
.cover-copy h1{max-width:350px;margin:0 0 18px;font-size:clamp(38px,11vw,52px);line-height:.96;letter-spacing:-.055em;font-weight:880}
.cover-copy>p:last-child{max-width:310px;margin:0;color:#c3d1c6;font-size:16px;line-height:1.45}
.cover-stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 17px}
.cover-stamps span{height:67px;display:grid;place-items:center;border:1px dashed #7cd97566;border-radius:11px;color:#7cd97580;font:750 20px/1 var(--mono)}
.cover-stamps span:nth-child(1){transform:rotate(-2deg)}.cover-stamps span:nth-child(2){transform:rotate(1deg)}.cover-stamps span:nth-child(3){transform:rotate(-1deg)}
.cover-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px;color:#bed0c1;font:650 11px/1.25 var(--mono);text-align:center}
.cover-facts span{padding:8px 4px;border-top:1px solid var(--line)}
.consent{display:grid;grid-template-columns:20px 1fr;gap:10px;margin:12px 1px 16px;color:#b9c8bc;font-size:12px;line-height:1.4}
.consent input{width:19px;height:19px;margin:0;accent-color:var(--green)}
.cover-button{background:#fff!important;border-color:#fff!important;color:#041008!important}
.public-cover .cover-copy{margin-bottom:11dvh}
.public-link{text-decoration:none;margin-top:9px}
.text-button{width:100%;min-height:44px;border:0;background:none;color:var(--stamp);font-size:14px;font-weight:700}

/* Штампы и маршрут */
/* Чипсы точек — как в макете: ровные карточки без наклона,
   активная подсвечена салатовой рамкой, пройденная с галочкой. */
.stamp-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 58px;gap:8px;padding:14px 0 16px}
.stamp-slot{height:64px;min-width:0;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);color:#6f8174;display:grid;place-content:center;justify-items:center;
  gap:4px;overflow:hidden;transition:border-color .18s,background-color .18s,color .18s}
.stamp-slot>span{max-width:100%;padding:0 6px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font:800 13px/1 var(--font);letter-spacing:.02em;text-transform:uppercase}
.stamp-slot small{font:600 9.5px/1 var(--font);letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.stamp-slot.selected{border-color:var(--green);background:rgba(143,227,0,.10);color:var(--green)}
.stamp-slot.stamped{position:relative;border-color:rgba(143,227,0,.45);
  background:rgba(143,227,0,.07);color:var(--green);transform:none}
.stamp-slot.stamped:nth-child(2),.stamp-slot.stamped:nth-child(3){transform:none}
.stamp-slot.stamped:after{content:"✓";position:absolute;top:6px;right:8px;
  font:800 11px/1 var(--font);color:var(--green);border:0;inset:auto 8px auto auto}
.stamp-total{display:grid;place-content:center;justify-items:center;gap:2px;color:var(--muted)}
.stamp-total b{color:var(--ink);font:800 24px/1 var(--font)}
.stamp-total span{font:600 8.5px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;text-align:center}
/* Карта как в макете: скруглённая карточка, прогресс лежит поверх неё. */
.route-stage{position:relative;min-height:38dvh;max-height:400px;overflow:hidden;
  margin:0 0 14px;border-radius:18px;background:#0e2116;border:1px solid var(--line)}
.route-stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(116deg,#fff0 0 36px,#9df48c08 37px 38px,#fff0 39px 76px)}
.topography{position:absolute;inset:-20% -40%;opacity:.45;transform:rotate(-8deg)}
.topography i{position:absolute;border:1px solid #a6f29b26;border-radius:48%}
.topography i:nth-child(1){inset:1% 7%}.topography i:nth-child(2){inset:10% 13%}.topography i:nth-child(3){inset:20% 19%}.topography i:nth-child(4){inset:31% 26%}.topography i:nth-child(5){inset:43% 34%}
.route-line{position:absolute;left:9%;right:9%;top:42%;height:100px}
.route-start,.route-pin{position:absolute;top:35px;z-index:2;display:grid;place-items:center;border-radius:50%;font-weight:850}
.route-start{left:0;width:43px;height:43px;background:#07160d;color:var(--stamp);font-size:14px;border:1px solid #7bea6e66}
.route-pin{right:0;width:62px;height:62px;top:24px;background:var(--green);color:var(--black);font-size:25px;box-shadow:0 0 0 8px #20cf4924,0 0 0 11px #20cf4940}
.route-dash{position:absolute;left:42px;right:54px;top:54px;height:2px;border-top:2px dashed #73dc67;transform:rotate(-7deg);transform-origin:left center}
.route-dash:before{content:"";position:absolute;left:32%;top:-30px;width:36%;height:42px;border-top:2px dashed #73dc67;border-radius:50%;transform:rotate(15deg)}
.stage-caption{position:absolute;left:16px;bottom:50px;max-width:66%;display:grid;gap:4px}
.stage-caption span{color:#b4c8b7;font:650 10px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.stage-caption b{font-size:21px;line-height:1.05}
/* Полоса прогресса поверх карты — главный элемент макета:
   сразу видно, сколько штампов собрано и сколько осталось. */
.map-progress{position:absolute;left:12px;right:12px;top:12px;z-index:400;
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;
  background:rgba(7,17,11,.86);backdrop-filter:blur(8px);border:1px solid var(--line)}
.map-progress b{font:800 15px/1 var(--font);color:var(--ink);white-space:nowrap}
.map-progress:after{content:"";flex:1;height:5px;border-radius:5px;
  background:linear-gradient(90deg,var(--green) var(--done,0%),rgba(255,255,255,.12) 0)}
.map-progress span{font:600 11px/1.2 var(--font);color:var(--muted);
  text-align:right;white-space:nowrap}

.locate-mini{position:absolute;right:13px;top:66px;min-height:42px;border:1px solid #68bce264;border-radius:12px;background:#071a12e8;color:#bceaff;padding:8px 11px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.locate-mini svg{width:17px;height:17px}
.map-note{position:absolute;left:16px;right:16px;bottom:14px;color:#90a694;font:600 9px/1.3 var(--mono)}
/* Карточка точки: номер слева, крупное название, адрес.
   Расстояние вынесено в микро-лейбл и подсвечено салатовым. */
.point-dossier{display:grid;grid-template-columns:46px 1fr;gap:13px;padding:2px 2px 10px}
.point-index{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;
  background:rgba(143,227,0,.12);border:1px solid rgba(143,227,0,.3);
  color:var(--green);font:800 20px/1 var(--font)}
.point-dossier h1{margin:0 0 4px;font-size:25px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
.point-dossier .micro{color:var(--green);font:800 13px/1 var(--font);letter-spacing:.02em}
.point-dossier p:last-child{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4}
.reward-strip{margin:8px 0 10px;padding:14px 16px;border:1px solid rgba(143,227,0,.28);
  border-left:3px solid var(--green);border-radius:14px;background:rgba(143,227,0,.06)}
.reward-strip>span{display:block;margin-bottom:6px;color:var(--stamp);
  font:700 9.5px/1 var(--font);letter-spacing:.1em}
.reward-strip strong{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.reward-strip p{margin:6px 0 0;color:#b9c9bc;font-size:13px;line-height:1.4}
.reward-strip small{display:block;margin-top:6px;color:var(--muted)}
.free-order{margin:10px 0 8px;color:#8da191;font:600 10px/1.4 var(--mono);text-align:center}
.sticky-actions{position:relative;z-index:8;width:100%;display:grid;gap:8px;margin:0 0 max(8px,env(safe-area-inset-bottom));padding:8px 0 2px;background:var(--canvas)}

/* Паспорт */
.passport-page{padding:16px 0 10px}
.expired-note{margin-bottom:12px;padding:11px 13px;border:1px solid #d8a7495c;border-radius:11px;background:#241b0c;color:#efcf8c;font-size:12px;line-height:1.4}
.passport-title{position:relative;overflow:hidden;margin-bottom:13px;padding:19px 18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.passport-title:after{content:"";position:absolute;width:210px;height:90px;right:-92px;bottom:-30px;border:1px solid #77ea6b1f;border-radius:50%;box-shadow:0 0 0 20px #77ea6b0c,0 0 0 42px #77ea6b09}
.passport-title h1{margin:0 0 8px;font-size:31px;line-height:1;letter-spacing:-.045em}
.passport-title>p:last-child{max-width:260px;margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.passport-grid{display:grid;gap:9px}
.passport-place{width:100%;min-height:92px;border:1px dashed var(--line);border-radius:13px;background:#08170e;padding:11px;display:grid;grid-template-columns:92px 1fr 22px;align-items:center;gap:12px;text-align:left}
.passport-place>svg{color:#7c8c7f}
.passport-place>div:nth-child(2){min-width:0;display:grid;gap:5px}
.passport-place>div:nth-child(2) b{overflow:hidden;text-overflow:ellipsis;font-size:15px}
.passport-place>div:nth-child(2) span{overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12px;line-height:1.3}
.passport-place.done{border-style:solid;border-color:#69d96050;background:#0d2114}
.mini-stamp{height:67px;min-width:0;border:1px solid #4f6754;border-radius:9px;display:grid;place-content:center;justify-items:center;gap:6px;color:#708074;transform:rotate(-1deg)}
.mini-stamp span{max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:750 11px/1 var(--mono);text-transform:uppercase}
.mini-stamp small{font:600 8px/1 var(--mono)}
.done .mini-stamp{border:2px solid var(--stamp);box-shadow:inset 0 0 0 3px #0d2114,inset 0 0 0 4px #6eea6250;color:var(--stamp)}
.passport-place:nth-child(2) .mini-stamp{transform:rotate(1deg)}.passport-place:nth-child(3) .mini-stamp{transform:rotate(-.5deg)}
.premium-card{display:grid;grid-template-columns:50px 1fr;gap:13px;align-items:center;margin:13px 0;padding:13px;border:1px solid var(--line);border-radius:13px;background:#09190f}
.premium-card img{width:50px;height:50px;border-radius:11px;object-fit:cover;filter:grayscale(1);opacity:.48}
.premium-card>div{display:grid;gap:4px}.premium-card b{font-size:16px}.premium-card span{color:var(--muted);font-size:12px;line-height:1.35}
.premium-card.unlocked{border-color:#62dc595b;background:#102518}.premium-card.unlocked img{filter:none;opacity:1}
.premium-code,.reward-code{margin:13px 0;padding:14px;border:1px solid #57c94f58;border-radius:12px;background:#0b2112}
.premium-code>span,.reward-code>span{color:#8daf90;font:650 9px/1 var(--mono);letter-spacing:.07em}
.premium-code>strong{display:block;margin:9px 0;font:800 23px/1 var(--mono);letter-spacing:.06em}
.premium-code button,.reward-code button{min-height:42px;border:0;background:transparent;color:var(--stamp);padding:0;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.passport-cta{margin-top:12px}
.support-link{text-decoration:none}

/* Нижние листы */
.modal{position:fixed;inset:0;z-index:50;display:grid;align-items:end;padding:14px;background:#020a06d9}
.sheet{width:min(100%,430px);max-height:88dvh;overflow:auto;margin:auto;padding:19px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 -18px 50px #0009}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:24px;line-height:1.05}
.sheet-copy{margin:13px 0 17px;color:var(--muted);font-size:14px;line-height:1.4}
.navigator-list{display:grid;gap:7px;margin-bottom:10px}
.navigator-list button{width:100%;min-height:57px;border:1px solid var(--line);border-radius:12px;background:#09190f;padding:8px 11px;display:grid;grid-template-columns:40px 1fr 22px;align-items:center;gap:11px;text-align:left}
.navigator-list b{font-size:14px}.navigator-list>button>svg{color:#819184}
.provider{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:#07120b;font-weight:850}
.provider.yandex{background:#fff;color:#e52e2e}.provider.dgis{background:#75e866}
.field{display:block;margin:14px 0;color:var(--muted);font-size:12px;font-weight:700}
.field input{width:100%;height:54px;margin-top:7px;border:1px solid var(--line);border-radius:11px;background:#06130b;padding:12px;font-size:17px;text-transform:uppercase}

/* Штамп и награды */
.stamp-success,.saved-reward{min-height:calc(100dvh - 80px);display:flex;flex-direction:column;align-items:center;padding:7dvh 0 12px;text-align:center}
.stamp-seal{width:190px;height:190px;margin-bottom:34px;border:5px solid var(--stamp);border-radius:27px;box-shadow:inset 0 0 0 6px var(--canvas),inset 0 0 0 8px var(--stamp);display:grid;place-content:center;justify-items:center;gap:9px;color:var(--stamp);transform:rotate(-7deg);animation:stamp-in .3s cubic-bezier(.2,.8,.2,1) both;text-transform:uppercase}
.stamp-seal:before{content:"";position:absolute;width:218px;height:218px;border:1px dashed #72e7673d;border-radius:50%}
.stamp-seal span,.stamp-seal small{font:650 10px/1 var(--mono);letter-spacing:.08em}
.stamp-seal strong{max-width:165px;font-size:27px;line-height:.95}
.stamp-success h1,.saved-reward h1{margin:0 0 14px;font-size:35px;line-height:1;letter-spacing:-.045em}
.success-copy,.saved-reward>p{max-width:330px;margin:0 auto 12px;color:#b8c7bb;font-size:16px;line-height:1.45}
.reward-code{width:100%;text-align:left}
.reward-code>div{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.reward-code strong{min-width:0;overflow:hidden;text-overflow:ellipsis;font:800 21px/1 var(--mono);letter-spacing:.04em}
.reward-code button span{display:inline}
.stamp-success .stamp-rail{width:100%;margin:8px 0 14px}.stamp-success .stamp-total{display:none}
.stamp-next{margin-top:auto}
.stamp-seal.small{width:156px;height:156px;margin-bottom:31px;border-width:4px}.stamp-seal.small:before{width:180px;height:180px}.stamp-seal.small strong{font-size:22px}

/* Правила и состояния */
.rules{padding:23px 0}.rules h1{margin:0 0 22px;font-size:34px;line-height:1;letter-spacing:-.045em}
.rules ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rules li{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rules li>span{width:40px;height:40px;display:grid;place-items:center;border:1px solid #6eea6260;border-radius:10px;color:var(--stamp);font:750 15px/1 var(--mono)}
.rules li b{font-size:15px}.rules li p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.privacy-note{margin:18px 0;padding:14px;border:1px solid #49bceb45;border-radius:12px;background:#0a1c19}.privacy-note b{color:#bdeaff}.privacy-note p{margin:6px 0 0;color:#aabfba;font-size:13px;line-height:1.4}
.empty{min-height:80dvh;display:grid;place-content:center;justify-items:center;text-align:center;padding:20px}.empty-stamp{width:90px;height:90px;margin-bottom:24px;display:grid;place-items:center;border:2px solid #5fdc565b;border-radius:18px;color:var(--stamp);font-size:26px;font-weight:850;transform:rotate(-4deg)}
.empty h1{margin:0 0 12px;font-size:30px}.empty p{max-width:320px;margin:0 0 22px;color:var(--muted);line-height:1.45}
.toast{position:fixed;z-index:80;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:402px;transform:translateX(-50%);padding:14px 15px;border:1px solid #5fca5750;border-radius:12px;background:#122719;color:#eff9f0;box-shadow:0 12px 38px #000a;font-size:14px;line-height:1.35}
.hidden{display:none!important}

/* Квест долины */
.passport-cover{min-height:calc(100dvh - max(18px,env(safe-area-inset-top)) - max(26px,env(safe-area-inset-bottom)));padding:8px 4px 15px;border:0;background:transparent}
.passport-cover:before{width:600px;height:270px;left:-290px;top:190px;box-shadow:0 0 0 42px #83ff7808,0 0 0 92px #83ff7807,0 0 0 144px #83ff7806}
.passport-cover:after{right:-285px;bottom:118px}
.cover-brand img{width:42px;height:42px;border-radius:11px}.cover-brand{font-size:10px;color:#c6d2c8}
.cover-copy{margin:38px 0 18px}.cover-copy h1{max-width:365px;margin-bottom:12px;font-size:clamp(37px,10.7vw,48px);line-height:.96}.cover-copy>p:last-child{font-size:15px}
.cover-map{position:relative;height:208px;overflow:hidden;margin:0 0 14px;border:1px solid #b0f76b32;border-radius:15px;background:linear-gradient(155deg,#183921 0,#0b2113 52%,#07150c 100%)}
.cover-map:before,.cover-map:after{content:"";position:absolute;inset:-70px -45px;border:1px solid #a7f58b20;border-radius:45%;transform:rotate(-15deg);box-shadow:0 0 0 26px #a7f58b09,0 0 0 54px #a7f58b07,0 0 0 86px #a7f58b06}
.cover-map:after{inset:82px -90px -80px 48px;transform:rotate(11deg)}
.cover-map-road{position:absolute;left:8%;right:8%;top:50%;height:2px;border-top:2px dashed #82ed4cb8;transform:rotate(-6deg)}
.cover-map-road:after{content:"";position:absolute;left:28%;top:-42px;width:45%;height:52px;border-top:2px dashed #82ed4cb8;border-radius:50%;transform:rotate(16deg)}
.cover-map button{position:absolute;z-index:2;left:var(--x);top:var(--y);min-width:44px;min-height:44px;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;display:flex;align-items:center;gap:5px}
.cover-map button b{width:42px;height:42px;display:grid;flex:0 0 auto;place-items:center;border:3px solid #07130b;border-radius:50%;background:var(--green);color:#071108;font-size:16px;box-shadow:0 0 0 3px #35e3444c,0 8px 22px #0007}
.cover-map button span{max-width:92px;overflow:hidden;padding:6px 8px;border:1px solid #76e56b45;border-radius:8px;background:#07150de8;color:#eff9ef;font-size:9px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.cover-map-caption{position:absolute;z-index:2;left:13px;top:12px;display:grid;gap:4px}.cover-map-caption span{color:var(--stamp);font:700 9px/1 var(--mono);letter-spacing:.08em}.cover-map-caption b{font-size:14px}
.cover-stamps{gap:7px;margin-bottom:10px}.cover-stamps span{height:55px;gap:4px;border-color:#82ed4c68;color:#82ed4ca8}.cover-stamps b{font:800 16px/1 var(--mono)}.cover-stamps small{font:650 8px/1 var(--mono);text-transform:uppercase}
.cover-facts{margin-bottom:10px;font-size:9px}.cover-facts span{padding-top:7px}
.consent{margin:8px 1px 11px;font-size:11px}.cover-button{border-color:var(--green)!important;background:var(--green)!important;color:#071108!important}.text-button{min-height:40px}

/* Настоящая карта из данных CRM */
.route-stage{position:relative;height:42dvh;min-height:330px;max-height:430px;overflow:hidden;margin:0 -14px;border-bottom:1px solid #78e34b43;background:#102c18}
.quest-map{position:absolute;inset:0;background:#102c18}.quest-map .leaflet-tile-pane{filter:brightness(.7) saturate(.74) sepia(.18) hue-rotate(70deg) contrast(1.08)}.quest-map .leaflet-control-container{font-family:var(--font)}
.map-skeleton{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,#163720,#0a1b10)}.map-skeleton:before,.map-skeleton:after{content:"";position:absolute;inset:-70px;border:1px solid #98ef7621;border-radius:44%;transform:rotate(-14deg);box-shadow:0 0 0 30px #98ef7608,0 0 0 64px #98ef7607,0 0 0 102px #98ef7606}.map-skeleton:after{inset:90px -100px -100px 40px;transform:rotate(18deg)}.map-skeleton span{display:none}
.map-progress{position:absolute;z-index:600;left:13px;top:13px;display:flex;align-items:baseline;gap:5px;padding:8px 10px;border:1px solid #80ec5060;border-radius:10px;background:#07140de8;color:#f4f8f4;box-shadow:0 8px 24px #0006}.map-progress b{font:800 15px/1 var(--mono)}.map-progress span{color:#afc1b2;font-size:10px}
.locate-mini{z-index:600;right:13px;top:13px;min-height:44px;border-color:#3bb3e67a;border-radius:10px;background:#07140deb;color:#c8eeff;box-shadow:0 8px 24px #0006}.locate-mini span{max-width:126px;white-space:nowrap}
.map-health{position:absolute;z-index:600;left:12px;bottom:12px;max-width:65%;padding:7px 9px;border:1px solid #96aa9a3e;border-radius:8px;background:#07140de8;color:#b9c8bc;font:650 9px/1.2 var(--mono)}.map-health.located{border-color:#3bb3e66b;color:#c7eeff}.map-health.warning{border-color:#ffbe3c6b;color:#ffdf98}
.map-legal{position:absolute;z-index:600;right:7px;bottom:2px;min-width:126px;min-height:44px;padding:25px 5px 3px;border-radius:6px;background:linear-gradient(transparent 0 22px,#061009cc 22px);color:#a9b6ab!important;font-size:8px;text-align:right;text-decoration:none}
.bb-map-marker-wrap,.bb-user-marker-wrap{border:0;background:transparent}.bb-map-marker{position:relative;width:48px;height:48px;display:grid;place-items:center;border:3px solid #07130b;border-radius:50%;background:#17271b;color:#aebcaf;font:850 16px/1 var(--mono);box-shadow:0 0 0 2px #7381776b,0 9px 22px #0009}.bb-map-marker.active{background:var(--green);color:#071108;box-shadow:0 0 0 4px #35e3445c,0 10px 25px #000a}.bb-map-marker.done{background:#102819;color:var(--stamp);box-shadow:0 0 0 3px #82ed4c77,0 9px 22px #0009}.bb-map-marker svg{width:22px;height:22px;stroke-width:2.6}.bb-map-marker small{position:absolute;left:39px;top:7px;max-width:112px;overflow:hidden;padding:6px 8px;border:1px solid #78df4b55;border-radius:8px;background:#07140def;color:#f4f8f4;font:750 9px/1 var(--font);text-overflow:ellipsis;white-space:nowrap}.bb-map-marker:not(.active) small{display:none}
.bb-user-marker{position:relative;width:28px;height:28px;display:grid;place-items:center;border:3px solid #d7f4ff;border-radius:50%;background:#2aabee;box-shadow:0 0 0 7px #2aabee36}.bb-user-marker i{width:6px;height:6px;border-radius:50%;background:#fff}.bb-user-marker:after{content:"";position:absolute;inset:-9px;border:2px solid #75d8ff70;border-radius:50%;animation:user-pulse 1.8s infinite}
.user-map-fallback{position:absolute;inset:0;display:grid;place-content:center;gap:7px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 45%,#1c4327,#0a1b10 65%)}.user-map-fallback b{font-size:18px}.user-map-fallback span{max-width:300px;color:var(--muted);font-size:13px;line-height:1.4}
.point-dossier{grid-template-columns:54px 1fr;padding-top:14px}.point-index{width:50px;height:50px;border:1px solid #73e84b55;background:#0d2816;color:var(--stamp)}.point-dossier h1{font-size:23px}.reward-strip{border-left-color:var(--green);background:#09180f}

/* Сканер и финал */
.scanner-screen{min-height:calc(100dvh - 70px);display:flex;flex-direction:column;padding:24px 0 10px}.scanner-screen h1{max-width:320px;margin:0 0 10px;font-size:36px;line-height:.98;letter-spacing:-.045em}.scanner-screen>p:not(.micro){margin:0;color:var(--muted);font-size:15px;line-height:1.45}.scanner-frame{position:relative;flex:1;min-height:310px;max-height:430px;margin:24px 0 14px;overflow:hidden;border:1px solid #82ed4c52;border-radius:18px;background:radial-gradient(circle at 50% 48%,#16341e 0,#07120b 68%)}.scanner-frame:before,.scanner-frame:after,.scanner-frame i:before,.scanner-frame i:after{content:"";position:absolute;width:58px;height:58px;border-color:var(--green);border-style:solid}.scanner-frame:before{left:22px;top:22px;border-width:3px 0 0 3px;border-radius:13px 0 0}.scanner-frame:after{right:22px;top:22px;border-width:3px 3px 0 0;border-radius:0 13px 0 0}.scanner-frame i:before{left:22px;bottom:22px;border-width:0 0 3px 3px;border-radius:0 0 0 13px}.scanner-frame i:after{right:22px;bottom:22px;border-width:0 3px 3px 0;border-radius:0 0 13px}.scanner-frame span{position:absolute;left:28px;right:28px;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);box-shadow:0 0 16px #35e344;animation:scan-line 2.2s ease-in-out infinite}.scanner-frame b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#b6c5b9;font-size:38px;opacity:.25}.scanner-safety{margin:0 0 13px;padding:10px 12px;border:1px solid #ffbe3c48;border-radius:10px;background:#241b0c;color:#f0d190;font-size:12px;line-height:1.35;text-align:center}.scanner-screen>.btn{margin-top:8px}
.passport-page.complete .passport-title{padding-top:112px;background:#0d2014}.final-bb{position:absolute;left:18px;top:17px;width:76px;height:76px;display:grid;place-items:center;border-radius:18px;background:var(--green);color:#061008;font-size:28px;font-weight:900;transform:rotate(-4deg);box-shadow:0 0 0 5px #35e34420}.share-passport{margin-top:8px}.passport-grid{grid-template-columns:1fr 1fr}.passport-place{min-height:158px;display:grid;grid-template-columns:1fr 22px;grid-template-rows:78px 1fr;padding:10px}.passport-place .mini-stamp{grid-column:1/-1;width:100%;height:72px}.passport-place>div:nth-child(2){align-self:start}.passport-place>svg{grid-column:2;grid-row:2}.passport-place:nth-child(3){grid-column:1/-1;min-height:96px;grid-template-columns:92px 1fr 22px;grid-template-rows:1fr}.passport-place:nth-child(3) .mini-stamp{grid-column:1;grid-row:1;width:92px}.passport-place:nth-child(3)>div:nth-child(2){grid-column:2;grid-row:1;align-self:center}.passport-place:nth-child(3)>svg{grid-column:3;grid-row:1}

@keyframes user-pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.85;transform:scale(1.15)}}
@keyframes scan-line{0%,100%{transform:translateY(-90px);opacity:.35}50%{transform:translateY(90px);opacity:1}}
@keyframes stamp-in{0%{opacity:0;transform:scale(1.42) rotate(-14deg)}65%{opacity:1;transform:scale(.96) rotate(-5deg)}100%{transform:scale(1) rotate(-7deg)}}
@media(max-height:700px){.cover-copy{margin:5dvh 0 3dvh}.cover-copy h1{font-size:38px}.route-stage{min-height:32dvh}.stamp-success,.saved-reward{padding-top:4dvh}.stamp-seal{width:150px;height:150px;margin-bottom:24px}.stamp-seal:before{width:175px;height:175px}.stamp-seal strong{font-size:22px}}
@media(max-height:620px){.passport-cover{padding:10px 12px 8px}.cover-brand{font-size:9px}.cover-brand img{width:34px;height:34px}.cover-copy{margin:9px 0 8px}.cover-copy .micro{display:none}.cover-copy h1{margin-bottom:6px;font-size:31px}.cover-copy>p:last-child{font-size:12px;line-height:1.3}.cover-map{height:110px;margin-bottom:6px}.cover-map-caption{left:9px;top:8px}.cover-map-caption b{font-size:11px}.cover-map button b{width:34px;height:34px;font-size:13px}.cover-map button span{display:none}.cover-stamps{margin-bottom:5px}.cover-stamps span{height:38px}.cover-stamps small{display:none}.cover-facts{display:none}.consent{grid-template-columns:17px 1fr;gap:6px;margin:5px 0 6px;font-size:9px;line-height:1.25}.consent input{width:16px;height:16px}.cover-button{min-height:48px}.text-button{min-height:32px;font-size:12px}}
@media(max-width:350px){.app{padding-inline:10px}.route-stage{margin-inline:-10px}.stamp-rail{grid-template-columns:repeat(3,minmax(0,1fr)) 53px}.stamp-total span{display:none}.cover-copy h1{font-size:36px}.cover-map{height:180px}.passport-grid{grid-template-columns:1fr}.passport-place,.passport-place:nth-child(3){grid-column:1;min-height:102px;grid-template-columns:82px 1fr 20px;grid-template-rows:1fr}.passport-place .mini-stamp,.passport-place:nth-child(3) .mini-stamp{grid-column:1;grid-row:1;width:82px}.passport-place>div:nth-child(2),.passport-place:nth-child(3)>div:nth-child(2){grid-column:2;grid-row:1;align-self:center}.passport-place>svg,.passport-place:nth-child(3)>svg{grid-column:3;grid-row:1}.mini-stamp span{max-width:70px}.reward-code button span{display:none}.locate-mini span{max-width:95px}}
@media(max-width:350px) and (max-height:620px){.cover-copy h1{font-size:31px}.cover-map{height:110px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}


/* ============================================================
   АНИМАЦИИ ИЗ МАКЕТА «Квест долины»
   Параметры перенесены один в один из спецификации:
   штамп прилетает с отскоком, кнопка ловит блик, гео пульсирует,
   прогресс-полоса заполняется на входе, ореол дышит.
   ============================================================ */
@keyframes q-pop{0%{transform:scale(.55) rotate(-16deg);opacity:0}
  62%{transform:scale(1.08) rotate(4deg);opacity:1}
  100%{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes q-sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(220%)}}
@keyframes q-blink{50%{opacity:.32}}
@keyframes q-glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}
@keyframes q-fill{from{width:0}to{width:var(--w)}}
@keyframes q-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes q-scan{0%,100%{transform:translateY(-84px)}50%{transform:translateY(84px)}}

/* --- Экран старта --- */
.passport-cover{position:relative;overflow:hidden;padding:6px 2px 18px}
.cover-halo{position:absolute;left:-70px;top:-60px;width:420px;height:320px;
  pointer-events:none;background:radial-gradient(50% 50% at 50% 55%,rgba(143,227,0,.34),transparent 70%);
  animation:q-glow 7s ease-in-out infinite}
.cover-brand{position:relative;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cover-bb{width:42px;height:42px;border-radius:13px;background:var(--green);color:#0a1405;
  display:grid;place-items:center;font:800 17px/1 Montserrat,var(--font);letter-spacing:-.04em}
.cover-brand b{font:800 19px/1.1 Montserrat,var(--font);letter-spacing:-.03em}
.cover-eyebrow{margin:0 0 10px;color:var(--green);font:800 11px/1.2 var(--font);
  letter-spacing:.12em;text-transform:uppercase}
.cover-title{margin:0 0 10px;font:800 34px/1.03 Montserrat,var(--font);letter-spacing:-.04em}
.cover-lead{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.45}

.cover-stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
.cover-stamps span{height:72px;display:grid;place-items:center;gap:3px;
  border:1px solid var(--line);border-radius:16px;background:var(--surface);
  animation:q-pop .6s cubic-bezier(.2,1.5,.4,1) both}
.cover-stamps span:nth-child(2){animation-delay:.09s}
.cover-stamps span:nth-child(3){animation-delay:.18s}
.cover-stamps b{font:800 20px/1 Montserrat,var(--font);color:var(--green)}
.cover-stamps small{max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted);font:600 9.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase}

.cover-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px;
  padding-top:16px;border-top:1px solid var(--line)}
.cover-facts div{display:grid;gap:3px}
.cover-facts b{font:800 24px/1 Montserrat,var(--font);color:var(--green);letter-spacing:-.03em}
.cover-facts span{color:var(--muted);font-size:11.5px;line-height:1.25}

/* Главная кнопка ловит блик — как в макете */
.cover-button,.btn.primary{position:relative;overflow:hidden}
.cover-button::after,.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:38%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
  animation:q-sheen 5s ease-in-out infinite;pointer-events:none}

/* Прогресс-полоса заполняется на входе */
.map-progress:after{--w:var(--done,0%);animation:q-fill 1.1s .2s ease both}

/* Штамп прилетает с отскоком */
.stamp-slot.stamped{animation:q-pop .6s cubic-bezier(.2,1.5,.4,1) both}
.stamp-seal{animation:q-pop .7s cubic-bezier(.2,1.5,.4,1) both}

/* Гео-точка пульсирует */
.map-health.located:before,.bb-user-marker{animation:q-blink 1.7s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
}


/* ============================================================
   ЭКРАН КАРТЫ — перенесён из макета «03 · КАРТА»
   Ключевое отличие от прежней версии: карточка точки наезжает
   на карту скруглённым верхом, чипсы пройденных точек наклонены
   как настоящие штампы, расстояние набрано крупно.
   ============================================================ */

/* Чипсы точек: пройденная — салатовая с наклоном и временем */
.stamp-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 56px;gap:8px;padding:0 0 12px}
.stamp-slot{height:58px;border-radius:13px;border:0;background:transparent;
  box-shadow:inset 0 0 0 1px #2c3e33;display:grid;place-items:center;gap:2px;
  color:#3d5245;overflow:hidden;transition:box-shadow .2s,background-color .2s,transform .2s}
.stamp-slot>span{max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:800 12px/1.15 Montserrat,var(--font);text-align:center;letter-spacing:-.01em}
.stamp-slot small{font:700 8.5px/1 var(--font);letter-spacing:.1em}
.stamp-slot.selected{background:rgba(143,227,0,.06);box-shadow:inset 0 0 0 1px rgba(143,227,0,.5);
  color:var(--stamp)}
.stamp-slot.stamped{background:rgba(143,227,0,.1);box-shadow:inset 0 0 0 1px rgba(143,227,0,.5);
  color:var(--stamp);transform:rotate(-3deg);animation:q-pop .6s cubic-bezier(.2,1.5,.4,1) both}
.stamp-slot.stamped:nth-child(2){transform:rotate(2deg)}
.stamp-slot.stamped:nth-child(3){transform:rotate(-2deg)}
.stamp-slot.stamped:after{content:none}
.stamp-total{display:grid;place-content:center;justify-items:center;gap:1px}
.stamp-total b{font:900 17px/1 Montserrat,var(--font);color:var(--ink)}
.stamp-total span{font:700 7.5px/1.15 var(--font);letter-spacing:.06em;
  text-transform:uppercase;color:#6f8177;text-align:center}

/* Прогресс поверх карты — как в макете */
.map-progress{position:absolute;z-index:600;left:14px;right:14px;top:12px;
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:16px;
  background:rgba(7,17,11,.84);box-shadow:inset 0 0 0 1px #253329;backdrop-filter:blur(9px);border:0}
.map-progress b{font:800 20px/1 Montserrat,var(--font);letter-spacing:-.05em;color:var(--ink)}
.map-progress b i{font-style:normal;color:#6f8177}
.map-progress:after{content:"";flex:1;height:7px;border-radius:7px;background:#1e2c23;
  box-shadow:inset var(--done,0%) 0 0 0 var(--green);animation:none}
.map-progress span{font:600 11.5px/1.25 var(--font);color:var(--muted);text-align:right}

/* Карточка точки наезжает на карту */
.point-sheet{position:relative;z-index:6;margin:-24px -2px 0;border-radius:24px 24px 0 0;
  background:#0d2815;padding:17px 17px 20px;
  box-shadow:inset 0 1px 0 rgba(143,227,0,.45),0 -18px 40px rgba(0,0,0,.4)}
.point-sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.point-sheet-head .lbl{font:800 11px/1 var(--font);letter-spacing:.1em;
  text-transform:uppercase;color:var(--green)}
.point-sheet-head .upd{font:600 11px/1 var(--font);color:var(--muted)}
.point-sheet h1{margin:0 0 4px;font:800 24px/1.08 Montserrat,var(--font);letter-spacing:-.04em}
.point-sheet .addr{margin:0 0 13px;font:13.5px/1.4 var(--font);color:#c2cec5}
.point-metrics{display:flex;align-items:flex-end;gap:11px;margin-bottom:13px}
.point-metrics .km{font:800 28px/1 Montserrat,var(--font);letter-spacing:-.05em;color:var(--green)}
.point-metrics .pill{padding:6px 10px;border-radius:999px;background:rgba(143,227,0,.12);
  box-shadow:inset 0 0 0 1px rgba(143,227,0,.42);font:700 11.5px/1 var(--font);color:#c6ea8f}

/* Блок подарка */
.reward-strip{display:flex;align-items:center;gap:11px;padding:12px 13px;border:0;
  border-radius:15px;background:rgba(143,227,0,.07);
  box-shadow:inset 0 0 0 1px rgba(143,227,0,.25);margin:0 0 15px}
.reward-strip .num{width:36px;height:36px;flex:none;border-radius:12px;background:var(--green);
  display:grid;place-items:center;font:900 15px/1 Montserrat,var(--font);color:#0a1405}
.reward-strip>span{display:block;margin:0;font:12px/1 var(--font);color:var(--muted);letter-spacing:0}
.reward-strip strong{display:block;margin-top:3px;font:800 15px/1.2 var(--font);color:var(--ink)}
.reward-strip p{display:none}

/* Индикатор гео в шапке */
.geo-live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font:700 11.5px/1 var(--font);color:#7fd0f5}
.geo-live s{width:6px;height:6px;border-radius:50%;background:#2aabee;
  text-decoration:none;animation:q-blink 1.7s ease-in-out infinite}


/* --- Правки компоновки экрана карты --- */
/* Кнопка «Показать ближайшие» уходит под прогресс, а не налезает на него */
.locate-mini{position:absolute;z-index:600;right:14px;bottom:16px;top:auto;left:auto;
  min-height:38px;border-radius:12px;background:rgba(7,17,11,.84);
  box-shadow:inset 0 0 0 1px #253329;border:0;backdrop-filter:blur(9px);
  color:#c8dcc9;padding:8px 12px;font:700 12px/1 var(--font)}
/* Прогресс: подпись не растягивает блок */
.map-progress span{flex:none;max-width:96px}
/* Шапка карточки: строка «обновлено» не наезжает на карту */
.point-sheet{margin-top:-20px;padding-top:20px}
.point-sheet-head{flex-wrap:wrap;gap:4px 10px}
/* Плашку «без отслеживания» прячем — её роль забрал индикатор в шапке */
.map-health{display:none}


/* ============================================================
   НАВИГАЦИЯ И ПРОФИЛЬ
   ============================================================ */
.app{padding-bottom:86px}          /* место под нижнюю панель */

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:grid;
  grid-template-columns:repeat(3,1fr);gap:4px;padding:8px 12px
  calc(8px + env(safe-area-inset-bottom));background:rgba(7,17,11,.92);
  backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--line)}
.tabbar .tab{position:relative;display:grid;justify-items:center;gap:4px;padding:7px 4px;
  border:0;background:transparent;color:#5d6f63;font:700 11px/1 var(--font);
  border-radius:12px;cursor:pointer;transition:color .18s,background-color .18s}
.tabbar .tab.on{color:var(--green);background:rgba(143,227,0,.09)}
.tabbar .tab .ic{width:22px;height:22px;display:block}
.tabbar .tab .ic svg{width:100%;height:100%}
.tab-badge{position:absolute;top:2px;right:calc(50% - 21px);min-width:16px;height:16px;
  padding:0 4px;border-radius:9px;background:var(--green);color:#0a1405;
  font:800 10px/16px var(--font);font-style:normal;text-align:center}

/* --- Профиль --- */
.profile-head{display:flex;align-items:center;gap:14px;padding:6px 2px 16px}
.profile-ava{width:58px;height:58px;border-radius:18px;object-fit:cover;flex:none;
  background:var(--green);box-shadow:0 0 0 1px var(--line)}
.profile-head h1{margin:0 0 3px;font:800 22px/1.1 Montserrat,var(--font);letter-spacing:-.03em}
.profile-head p{margin:0;color:var(--muted);font-size:13.5px}

.profile-progress{height:7px;border-radius:7px;background:#1e2c23;overflow:hidden;margin-bottom:18px}
.profile-progress i{display:block;height:100%;border-radius:7px;background:var(--green);
  transition:width .9s .1s cubic-bezier(.4,0,.2,1)}

.profile-stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.pf-stamp{display:grid;justify-items:center;gap:3px;padding:13px 6px;border-radius:16px;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.pf-stamp.on{background:rgba(143,227,0,.08);box-shadow:inset 0 0 0 1px rgba(143,227,0,.45);
  animation:q-pop .6s cubic-bezier(.2,1.5,.4,1) both}
.pf-stamp b{font:900 19px/1 Montserrat,var(--font);color:#3d5245}
.pf-stamp.on b{color:var(--green)}
.pf-stamp span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:700 11px/1.2 var(--font);color:var(--ink)}
.pf-stamp small{font:600 9.5px/1 var(--font);color:var(--muted)}

.profile-list{display:grid;gap:8px;margin-bottom:16px}
.pf-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;
  border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);
  color:var(--ink);text-align:left;text-decoration:none;cursor:pointer;
  transition:background-color .16s,transform .12s}
.pf-row:active{transform:scale(.99);background:var(--raised)}
.pf-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:rgba(143,227,0,.1);color:var(--green)}
.pf-ic .ic{width:20px;height:20px;display:block}
.pf-ic svg{width:100%;height:100%}
.pf-tx{flex:1;min-width:0;display:grid;gap:2px}
.pf-tx b{font:700 15px/1.2 var(--font)}
.pf-tx i{font-style:normal;font-size:12.5px;line-height:1.35;color:var(--muted)}
.pf-go{color:#4c5d52;font:700 19px/1 var(--font)}
.pf-note{margin:0 4px;color:var(--muted);font-size:12px;line-height:1.45;text-align:center}


/* ============================================================
   ГЛАВНЫЙ ЭКРАН — финальная раскладка
   Карта и карточка точки больше не наслаиваются: карта имеет
   фиксированную высоту, карточка идёт под ней обычным потоком.
   Этот блок последний в файле и перебивает ранние правила.
   ============================================================ */
.route-stage{position:relative;height:300px;min-height:300px;max-height:300px;
  margin:0 0 12px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:#0e2116}
.quest-map{width:100%;height:100%}

/* Прогресс поверх карты — сверху, кнопка «ближайшие» — снизу.
   Между ними всегда чистая середина карты. */
.map-progress{position:absolute;z-index:600;left:12px;right:12px;top:12px;
  display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:15px;
  background:rgba(7,17,11,.88);box-shadow:inset 0 0 0 1px #253329;backdrop-filter:blur(9px);border:0}
.locate-mini{position:absolute;z-index:600;left:12px;right:auto;top:auto;bottom:12px;
  min-height:38px;border-radius:12px;background:rgba(7,17,11,.88);
  box-shadow:inset 0 0 0 1px #253329;border:0;backdrop-filter:blur(9px);
  color:#c8dcc9;padding:8px 12px;font:700 12px/1 var(--font)}
.locate-mini span{max-width:150px}
/* Копирайт карты не спорит с кнопкой */
.route-stage .leaflet-control-attribution{font-size:9px;opacity:.55}

/* Карточка точки — обычная карточка, без наезда на карту */
.point-sheet{position:relative;z-index:1;margin:0 0 12px;padding:16px;
  border-radius:18px;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line);border:0}
.point-sheet-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:8px;flex-wrap:wrap;margin-bottom:7px}
.point-sheet h1{margin:0 0 4px;font:800 23px/1.1 Montserrat,var(--font);letter-spacing:-.03em}
.point-sheet .addr{margin:0 0 12px}
.point-metrics{margin-bottom:0}

/* Блок подарка — отдельная карточка с отступом */
.reward-strip{margin:0 0 14px}

/* Запас снизу, чтобы кнопки не прятались под навигацией */
/* Кнопки не должны прятаться под нижней навигацией.
   Отступ считается от высоты панели плюс безопасная зона. */
.app{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.sticky-actions{position:static;padding:0;background:none;backdrop-filter:none;
  box-shadow:none;display:grid;gap:9px;
  /* запас под нижнюю панель — ставим на сам блок, чтобы правило
     не перебивалось ранними стилями .app */
  margin:0 0 calc(104px + env(safe-area-inset-bottom))}


/* ============================================================
   ФИНАЛЬНЫЕ ПРАВКИ ГЛАВНОГО ЭКРАНА
   ============================================================ */

/* Полоска под шапкой убрана — она резала экран пополам
   перед чипсами штампов. */
.topbar{border-bottom:0}

/* --- Фирменная карта bb.bike --- */
/* Тайлы приглушаем и уводим в тёмно-зелёный: карта перестаёт
   спорить с интерфейсом, точки читаются заметно лучше. */
.quest-map .leaflet-tile-pane{
  filter:grayscale(.55) brightness(.42) sepia(.55) hue-rotate(58deg) saturate(1.5) contrast(1.05)}
.quest-map .leaflet-container{background:#0b1a10}
/* Подпись источника — фирменная плашка вместо серого текста */
.quest-map .leaflet-control-attribution{
  background:rgba(7,17,11,.82)!important;color:#7d9184!important;
  border-radius:9px;padding:3px 8px!important;margin:0 8px 8px 0!important;
  font:600 9.5px/1.2 var(--font)!important;box-shadow:inset 0 0 0 1px var(--line)}
.quest-map .leaflet-control-attribution a{color:#8fa896!important;text-decoration:none}

/* --- Кнопка «где я» на карте --- */
.geo-cta{position:absolute;z-index:600;left:12px;right:12px;bottom:12px;
  display:flex;align-items:center;gap:10px;padding:11px 13px;border:0;border-radius:15px;
  background:var(--green);color:#0a1405;text-align:left;cursor:pointer;
  box-shadow:0 10px 26px rgba(0,0,0,.4);font-family:var(--font)}
.geo-cta .ic{width:20px;height:20px;flex:none}
.geo-cta .ic svg{width:100%;height:100%}
.geo-cta b{display:block;font:800 13.5px/1.2 var(--font)}
.geo-cta i{display:block;font-style:normal;font:600 11px/1.25 var(--font);opacity:.72}
.geo-cta:active{transform:scale(.99)}

/* Когда позиция уже есть — кнопка становится спокойной */
.geo-cta.done{background:rgba(7,17,11,.88);color:#c8dcc9;
  box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(9px)}
.geo-cta.done .ic{color:var(--green)}

/* Старая мини-кнопка больше не нужна — её роль забрала geo-cta */
.locate-mini{display:none}


/* ============================================================
   ЭКРАН ПРАВИЛ — по макету «02 · Правила игры»
   Чёткая сетка: шаги с пунктирной линией, отдельные карточки
   для подарка, гео и безопасности. Никаких наложений.
   ============================================================ */
.rules-screen{padding:4px 2px 20px;display:grid;gap:0}
.rules-eyebrow{margin:0 0 8px;color:var(--green);font:800 11px/1.2 var(--font);
  letter-spacing:.12em;text-transform:uppercase}
.rules-title{margin:0 0 8px;font:800 30px/1.05 Montserrat,var(--font);letter-spacing:-.045em}
.rules-lead{margin:0 0 22px;font:15px/1.5 var(--font);color:#c2cec5}

.rules-steps{position:relative;display:grid;gap:16px;margin-bottom:20px}
.rules-line{position:absolute;left:21px;top:22px;bottom:22px;width:2px;
  background:repeating-linear-gradient(180deg,rgba(143,227,0,.45) 0 5px,transparent 5px 11px)}
.rule{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.rule-n{width:44px;height:44px;border-radius:14px;background:#0d2815;color:var(--green);
  display:grid;place-items:center;font:900 16px/1 Montserrat,var(--font);
  box-shadow:inset 0 0 0 1px rgba(143,227,0,.35);
  animation:q-pop .55s cubic-bezier(.2,1.5,.4,1) both}
.rule:nth-child(3) .rule-n{animation-delay:.08s}
.rule:nth-child(4) .rule-n{animation-delay:.16s}
.rule b{display:block;font:800 16px/1.25 var(--font);color:var(--ink);padding-top:3px}
.rule p{margin:6px 0 0;font:14px/1.5 var(--font);color:var(--muted)}

.rules-gift{display:grid;grid-template-columns:38px 1fr;gap:13px;align-items:start;
  margin-bottom:14px;padding:15px 16px;border-radius:18px;
  background:rgba(143,227,0,.07);box-shadow:inset 0 0 0 1px rgba(143,227,0,.28)}
.gift-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:rgba(143,227,0,.14);color:var(--green)}
.gift-ic .ic{width:20px;height:20px;display:block}
.gift-ic svg{width:100%;height:100%}
.rules-gift b{display:block;font:800 14.5px/1.3 var(--font);color:var(--ink)}
.rules-gift p{margin:6px 0 0;font:13px/1.5 var(--font);color:var(--muted)}

.rules-geo{display:grid;grid-template-columns:34px 1fr;gap:13px;align-items:start;
  margin-bottom:14px;padding:15px 16px;border-radius:18px;
  background:rgba(42,171,238,.08);box-shadow:inset 0 0 0 1px rgba(42,171,238,.3)}
.geo-dot{position:relative;width:34px;height:34px}
.geo-dot i{position:absolute;inset:0;border-radius:50%;background:rgba(42,171,238,.22);
  animation:q-glow 3.4s ease-in-out infinite}
.geo-dot b{position:absolute;left:11px;top:11px;width:12px;height:12px;border-radius:50%;
  background:#2aabee;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.rules-geo>div>b{display:block;font:800 14.5px/1.3 var(--font);color:#eaf6ff}
.rules-geo p{margin:6px 0 0;font:13px/1.5 var(--font);color:#9fc9de}

.rules-safety{display:flex;gap:11px;align-items:flex-start;margin-bottom:22px;
  padding:13px 15px;border-radius:16px;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line)}
.rules-safety .ic{width:19px;height:19px;flex:none;color:var(--muted);margin-top:1px}
.rules-safety svg{width:100%;height:100%}
.rules-safety p{margin:0;font:13px/1.45 var(--font);color:var(--muted)}
.rules-btn{min-height:56px;border-radius:16px}

</style>
  <link rel="stylesheet" href="/static/vendor/leaflet.css">

</head>
<body>
<main class="app"><div class="shell" id="app"><div class="splash"><img src="/static/bb-bike-logo.jpg" alt="bb.bike"><span>Открываем квест…</span></div></div></main>
<div id="modal"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const tg=window.Telegram?.WebApp,initData=tg?.initData||'',root=document.getElementById('app'),modal=document.getElementById('modal');

let qrPopupOpen=false,syncInFlight=false,lastBuildVersion='',pendingAutoRender=false;
const dev=location.hostname==='127.0.0.1'||location.hostname==='localhost';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function requestId(){return crypto.randomUUID?.()||Date.now()+'-'+Math.random()}
async function api(path,options={}){const authData=initData||(dev?'dev':'');const r=await fetch(path,{...options,headers:{Authorization:'tma '+authData,'Content-Type':'application/json',...(options.headers||{})}}),p=await r.json().catch(()=>({ok:false,message:'Сервис не ответил'}));if(!r.ok||p.ok===false)throw new Error(p.message||'Ошибка');return p}
function eventLog(event_type,point_id=null,navigator=''){api('/api/quest/event',{method:'POST',keepalive:true,body:JSON.stringify({event_type,point_id,navigator,request_id:requestId()})}).catch(()=>{})}
function toast(text){const n=document.getElementById('toast');n.textContent=text;n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),3200)}
function destroyQuestMap(){if(questMap){questMap.remove();questMap=null}}
function show(html){destroyQuestMap();root.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});setTimeout(syncBackButton,0)}
function completed(){return (state?.points||[]).filter(p=>p.completed_at).length}
function pointBySeq(seq){return state?.points?.find(p=>p.seq===Number(seq))}
function openPoints(){return (state?.points||[]).filter(p=>!p.completed_at)}
function orderedPoints(){const src=[...(state?.points||[])];return pointOrder.length?src.sort((a,b)=>pointOrder.indexOf(a.seq)-pointOrder.indexOf(b.seq)):src}
function shortName(p){return String(p?.point_name||('Точка '+p?.seq)).replace(/[«»"']/g,'').split(/\s+/).slice(0,2).join(' ')}
function completedTime(value){if(!value)return '';const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function distance(a,b,c,d){const r=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*r*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}

function header(right=''){return `<header class="topbar"><button class="brand" onclick="routeScreen()" aria-label="К маршруту"><img src="/static/bb-bike-logo.jpg" alt=""><span>Квест <b>bb.bike</b></span></button>${right||`<span class="geo-live"><s></s>${localPosition?'гео в эфире':'гео по кнопке'}</span>`}</header>`}
function icon(name){const paths={back:'<path d="m15 18-6-6 6-6"/>',passport:'<path d="M6 3h11a2 2 0 0 1 2 2v16H7a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Z"/><path d="M8 3v18M11 9h5M11 13h5"/>',locate:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',route:'<path d="M6 19c0-4 4-4 4-7s-4-3-4-6M18 5c0 4-4 4-4 7s4 3 4 7"/><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/>',scan:'<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8h3v3H8zM14 8h2M14 11h3M8 14h2M13 14h3v3h-3z"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="m9 18 6-6-6-6"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||''}</svg>`}
function stampRail(active=selectedSeq){return `<section class="stamp-rail" aria-label="Отметки квеста">${(state?.points||[]).map(p=>{const done=!!p.completed_at,chosen=Number(active)===p.seq,label=`${p.seq}. ${p.point_name}. ${done?'Штамп поставлен':'Штамп не поставлен'}`;return `<button class="stamp-slot ${done?'stamped':''} ${chosen?'selected':''}" aria-label="${esc(label)}" onclick="selectPoint(${p.seq})"><span>${done?esc(shortName(p)):p.seq}</span>${done?`<small>${completedTime(p.completed_at)}</small>`:'<small>точка</small>'}</button>`}).join('')}<div class="stamp-total"><b>${completed()}</b><span>из 3<br>штампов</span></div></section>`}

function pointMarkerIcon(p){const done=!!p.completed_at,active=p.seq===selectedSeq;return L.divIcon({className:'bb-map-marker-wrap',html:`<span class="bb-map-marker ${done?'done':''} ${active?'active':''}">${done?icon('check'):p.seq}<small>${esc(shortName(p))}</small></span>`,iconSize:[58,58],iconAnchor:[29,29]})}
function initUserMap(p){const n=document.getElementById('quest-map');if(!n)return;if(!window.L){n.innerHTML='<div class="user-map-fallback"><b>Карта не загрузилась</b><span>Маршрут всё равно откроется в Яндекс Картах или 2ГИС.</span></div>';return}const raw=state?.map?.bounds||{south:43.60,west:40.10,north:43.77,east:40.37},area=L.latLngBounds([raw.south,raw.west],[raw.north,raw.east]);questMap=L.map(n,{zoomControl:false,attributionControl:false,maxBounds:area,maxBoundsViscosity:1,minZoom:10,maxZoom:18,scrollWheelZoom:false,boxZoom:false});const tiles=L.tileLayer(state?.map?.tile_url||'https://tile.openstreetmap.org/{z}/{x}/{y}.png',{minZoom:10,maxZoom:18,noWrap:true,bounds:area,keepBuffer:2}).addTo(questMap);let warned=false;tiles.on('tileerror',()=>{if(warned)return;warned=true;const h=document.getElementById('map-health');if(h){h.classList.add('warning');h.textContent='Подложка недоступна · точки работают'}});const pointCoords=[];(state?.points||[]).forEach(point=>{const coords=[point.latitude,point.longitude];pointCoords.push(coords);const m=L.marker(coords,{icon:pointMarkerIcon(point),keyboard:true,title:point.point_name}).addTo(questMap);m.getElement()?.setAttribute('aria-label',`${point.seq}. ${point.point_name}`);m.on('click',()=>selectPoint(point.seq))});const target=[p.latitude,p.longitude],visible=[...pointCoords];if(localPosition){const userCoords=[localPosition.lat,localPosition.lon],inside=area.contains(userCoords);L.marker(userCoords,{icon:L.divIcon({className:'bb-user-marker-wrap',html:'<span class="bb-user-marker"><i></i></span>',iconSize:[34,34],iconAnchor:[17,17]}),interactive:false}).addTo(questMap);if(inside){visible.push(userCoords);if(localDistance(p)<30000)L.polyline([userCoords,target],{color:'#83ed36',weight:3,dashArray:'7 8',opacity:.8}).addTo(questMap)}}if(visible.length>1)questMap.fitBounds(visible,{padding:[48,48],maxZoom:14});else questMap.setView(target,14);setTimeout(()=>questMap?.invalidateSize(),90)}
function stickyActions(p){if(p.completed_at)return `<div class="sticky-actions"><button class="btn primary" onclick="showReward(${p.seq})">Открыть подарок</button><button class="btn secondary" onclick="passportScreen()">Мой квест</button></div>`;return `<div class="sticky-actions"><button class="btn primary" onclick="chooseNavigator(${p.seq})">${icon('route')}<span>Построить маршрут${localDistance(p)!=null?' · '+fmt(localDistance(p)):''}</span></button><button class="btn secondary" onclick="scanPoint(${p.seq})">${icon('scan')}<span>Поставить штамп · QR</span></button></div>`}

async function startQuest(e){if(!document.getElementById('rules-ok')?.checked)return toast('Сначала прими правила квеста');e.currentTarget.disabled=true;try{state=(await api('/api/quest/start',{method:'POST',body:JSON.stringify({privacy_accepted:true,request_id:requestId()})})).data;selectedSeq=openPoints()[0]?.seq||state.points[0]?.seq;routeScreen()}catch(x){toast(x.message);e.currentTarget.disabled=false}}
function routeScreen(seq=selectedSeq,track=true){if(!state?.session)return cover();if(completed()===3)return passportScreen();const pending=openPoints(),fallback=pending[0]||state.points[0];let p=pointBySeq(seq)||fallback;if(p.completed_at&&pending.length)p=pending[0];selectedSeq=p.seq;if(track){eventLog('catalog_open');eventLog('point_view',p.point_id)}show(`${header(`<button class="passport-link" onclick="passportScreen()">Квест <b>${completed()}/3</b></button>${tabbar("route")}`)}${stampRail(p.seq)}${routeStage(p)}<section class="reward-strip"><span class="num">${p.seq}</span><div><span>Здесь ждёт</span><strong>${esc(p.reward_title)}</strong></div></section><p class="free-order">Выбирай любую непройденную точку</p>${stickyActions(p)}`);requestAnimationFrame(()=>initUserMap(p))}
function selectPoint(seq){if(state?.campaign?.status!=='active'||state?.session?.status!=='active')return toast('Сейчас можно смотреть квест и полученные подарки, но продолжить маршрут нельзя');selectedSeq=Number(seq);routeScreen(selectedSeq)}

/* Одна кнопка на карте закрывает два сценария:
   нет позиции — запрашиваем разрешение и подбираем ближайшую точку;
   позиция есть — сразу открываем веломаршрут в навигаторе. */
async function geoAndRoute(ev,seq){
  ev?.preventDefault?.();
  if(!localPosition){
    const btn=ev?.currentTarget;
    if(btn){btn.disabled=true;btn.querySelector('b').textContent='Запрашиваю…'}
    try{
      const pos=await oneLocation();
      if(!pos){toast('Разреши доступ к геопозиции в настройках Telegram');
        if(btn){btn.disabled=false;btn.querySelector('b').textContent='Показать, где я'}return}
      localPosition=pos;
      pointOrder=[...openPoints()].sort((a,b)=>
        distance(pos.lat,pos.lon,a.latitude,a.longitude)-
        distance(pos.lat,pos.lon,b.latitude,b.longitude)).map(x=>x.seq);
      if(pointOrder[0])selectedSeq=pointOrder[0];
      tg?.HapticFeedback?.notificationOccurred?.('success');
      routeScreen();
      toast('Ближайшая точка выбрана. Координата не сохраняется.');
    }catch(_){
      toast('Не удалось определить позицию');
      if(btn){btn.disabled=false;btn.querySelector('b').textContent='Показать, где я'}
    }
    return;
  }
  // Позиция уже есть — ведём на велосипеде.
  bikeRoute(seq);
}

/* Веломаршрут: Яндекс Карты понимают режим велосипеда напрямую. */
function bikeRoute(seq){
  const p=pointBySeq(seq)||openPoints()[0];
  if(!p)return;
  eventLog('navigator_open',p.point_id,'yandex');
  const from=localPosition?`${localPosition.lat},${localPosition.lon}`:'';
  const url=`https://yandex.ru/maps/?rtext=${from}~${p.latitude},${p.longitude}&rtt=bc`;
  tg?.openLink?tg.openLink(url):window.open(url,'_blank','noopener');
}

async function nearest(){try{const pos=await oneLocation();if(!pos)return toast('Не удалось определить местоположение');localPosition=pos;pointOrder=[...openPoints()].sort((a,b)=>distance(pos.lat,pos.lon,a.latitude,a.longitude)-distance(pos.lat,pos.lon,b.latitude,b.longitude)).map(x=>x.seq);const first=pointOrder[0];if(first)selectedSeq=first;routeScreen();toast('Ближайшая точка выбрана. Бот не сохраняет координату.')}catch(_){toast('Разреши разовую геопозицию в настройках Telegram')}}
function oneLocation(){return new Promise(resolve=>{let ended=false,browserStarted=false;const finish=v=>{if(!ended){ended=true;resolve(v)}},browser=()=>{if(ended||browserStarted)return;browserStarted=true;navigator.geolocation?navigator.geolocation.getCurrentPosition(v=>finish({lat:v.coords.latitude,lon:v.coords.longitude}),()=>finish(null),{enableHighAccuracy:false,timeout:5500,maximumAge:120000}):finish(null)};setTimeout(()=>finish(null),6500);const manager=tg?.LocationManager,supported=!!manager&&tg?.isVersionAtLeast?.('8.0')===true;if(!supported)return browser();const get=()=>{try{manager.getLocation(v=>v?finish({lat:v.latitude,lon:v.longitude}):browser())}catch(_){browser()}};try{manager.isInited?get():manager.init(get)}catch(_){browser()}})}
function passportCard(p){const done=!!p.completed_at;return `<button class="passport-place ${done?'done':''}" onclick="${done?`showReward(${p.seq})`:`selectPoint(${p.seq})`}"><div class="mini-stamp"><span>${done?esc(shortName(p)):p.seq}</span>${done?`<small>${completedTime(p.completed_at)} · QR</small>`:'<small>БЕЗ ШТАМПА</small>'}</div><div><b>${esc(p.point_name)}</b><span>${done?esc(p.reward_title):esc(p.address)}</span></div>${icon('arrow')}</button>`}
function passportScreen(lockMessage=''){if(!lockMessage&&state?.campaign?.status!=='active')lockMessage='Квест сейчас на паузе. Полученные штампы и подарки сохранены.';if(!lockMessage&&state?.session?.status==='expired')lockMessage='Время маршрута закончилось. Полученные штампы и подарки сохранены.';const n=completed(),remaining=openPoints()[0],locked=!!lockMessage,canContinue=remaining&&!locked;show(`${header(`<span class="count-label">${n} / 3</span>${tabbar("passport")}`)}<section class="passport-page ${n===3?'complete':''}">${locked?`<div class="expired-note">${esc(lockMessage)}</div>`:''}<div class="passport-title">${n===3?'<div class="final-bb">bb.</div>':''}<p class="micro">BB.BIKE · КРАСНАЯ ПОЛЯНА</p><h1>${n===3?'Паспорт заполнен':'Мой квест'}</h1><p>${n===3?'Все три штампа на месте. Premium готов к оформлению.':'Три штампа партнёров · один месяц Premium'}</p></div><div class="passport-grid">${(state.points||[]).map(passportCard).join('')}</div><section class="premium-card ${n===3?'unlocked':''}"><img src="/static/bb-bike-logo.jpg" alt=""><div><b>${esc(state.campaign.premium_title)}</b><span>${n===3?esc(state.campaign.premium_instruction):`Откроется после ${3-n} ${3-n===1?'штампа':'штампов'}`}</span></div></section>${n===3?`<section class="premium-code"><span>КОД УЧАСТНИКА</span><strong>${esc(state.premium?.public_code||'Оформляется')}</strong><button onclick="copyPremium()">${icon('copy')} Скопировать</button></section>`:''}${canContinue?`<button class="btn primary passport-cta" onclick="selectPoint(${remaining.seq})">К точке «${esc(shortName(remaining))}»</button>`:n===3?'<button class="btn primary passport-cta" onclick="copyPremium()">Скопировать код Premium</button>':`<a class="btn secondary passport-cta support-link" href="${esc(state.support_url)}">Связаться с поддержкой</a>`}${n===3?'<button class="btn secondary share-passport" onclick="sharePassport()">Поделиться результатом</button>':''}${!locked&&n<3?'<button class="btn quiet" onclick="routeScreen()">Вернуться к маршруту</button>':''}</section>`)}
function presentModal(html){modalTrigger=document.activeElement;modal.innerHTML=html;const sheet=modal.querySelector('.sheet'),title=sheet?.querySelector('h2')?.textContent?.trim();sheet?.setAttribute('role','dialog');sheet?.setAttribute('aria-modal','true');if(title)sheet?.setAttribute('aria-label',title);syncBackButton();setTimeout(()=>modal.querySelector('button,input')?.focus(),0)}
function chooseNavigator(seq){const p=pointBySeq(seq);selectedSeq=seq;presentModal(`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="sheet-head"><div><p class="micro">КАК ДОБРАТЬСЯ</p><h2>${esc(p.point_name)}</h2></div><button class="icon-button" aria-label="Закрыть" onclick="closeModal()">×</button></div><p class="sheet-copy">Навигатор сам определит твоё текущее местоположение.</p><div class="navigator-list"><button onclick="openRoute(${seq},'yandex','bc')"><span class="provider yandex">Я</span><b>Яндекс · Бибибайк</b>${icon('arrow')}</button><button onclick="openRoute(${seq},'yandex','pd')"><span class="provider yandex">Я</span><b>Яндекс · пешком</b>${icon('arrow')}</button><button onclick="openRoute(${seq},'2gis','car')"><span class="provider dgis">2</span><b>2ГИС · на машине</b>${icon('arrow')}</button><button onclick="openRoute(${seq},'2gis','pedestrian')"><span class="provider dgis">2</span><b>2ГИС · пешком</b>${icon('arrow')}</button></div><button class="btn quiet" onclick="copyAddress(${seq})">Скопировать адрес</button></section></div>`)}
function openRoute(seq,provider,mode){const p=pointBySeq(seq);eventLog('navigator_open',p.point_id,provider);const url=provider==='yandex'?`https://yandex.ru/maps/?rtext=~${p.latitude},${p.longitude}&rtt=${mode}`:`https://2gis.ru/routeSearch/${mode==='pedestrian'?'rsType/pedestrian/':''}to/${p.longitude},${p.latitude}/go`;closeModal();tg?.openLink?tg.openLink(url):window.open(url,'_blank','noopener')}
function copyAddress(seq){const p=pointBySeq(seq);navigator.clipboard?.writeText(p.address);toast('Адрес скопирован')}
function scannerScreen(p){show(`${header(`<button class="icon-button" aria-label="Вернуться к маршруту" onclick="routeScreen(${p.seq},false)">${icon('back')}</button>`)}<section class="scanner-screen"><p class="micro">ШТАМП ${p.seq} · ${esc(shortName(p))}</p><h1>Сканируй QR партнёра</h1><p>Наведи камеру на зелёную табличку bb.bike. Код награды появится сразу.</p><div class="scanner-frame" aria-hidden="true"><i></i><span></span><b>bb.</b></div><div class="scanner-safety">Сначала полностью остановись и припаркуй байк</div><button class="btn primary" onclick="openNativeScanner(${p.seq})">${icon('scan')} Открыть камеру</button><button class="btn secondary" onclick="manualCode()">Ввести код вручную</button></section>`)}
function openNativeScanner(seq){const p=pointBySeq(seq),supported=!!tg?.showScanQrPopup&&(typeof tg.isVersionAtLeast!=='function'||tg.isVersionAtLeast('6.4'));if(!supported)return manualCode();try{qrPopupOpen=true;tg.showScanQrPopup({text:'Наведи камеру на зелёную табличку bb.bike'},value=>{qrPopupOpen=false;try{tg.closeScanQrPopup()}catch(_){/* popup may already be closed */}submitQr(value);return true})}catch(_){qrPopupOpen=false;manualCode()}}
function scanPoint(seq){const p=pointBySeq(seq);selectedSeq=seq;eventLog('qr_open',p.point_id);scannerScreen(p);openNativeScanner(seq)}
function manualCode(){presentModal(`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="sheet-head"><div><p class="micro">РУЧНОЙ ВВОД</p><h2>Код точки</h2></div><button class="icon-button" aria-label="Закрыть" onclick="closeModal()">×</button></div><p class="sheet-copy">Введи короткий код с зелёной таблички bb.bike.</p><label class="field">Код<input id="manual-code" autocomplete="off" autocapitalize="characters" maxlength="80" placeholder="Например: A1B2C3"></label><button class="btn primary" onclick="submitQr(document.getElementById('manual-code').value)">Поставить штамп</button></section></div>`)}
async function submitQr(value){if(!value)return toast('Код не распознан');try{const before=completed();state=(await api('/api/quest/scan',{method:'POST',body:JSON.stringify({qr_code:value,request_id:requestId()})})).data;closeModal();const after=completed();after>before?stampSuccess(state.event?.point_completed):routeScreen()}catch(x){toast(x.message)}}
function stampSuccess(seq){const p=pointBySeq(seq),n=completed();show(`${header(`<span class="count-label">${n} ${n===1?'штамп':'штампа'}</span>`)}<section class="stamp-success"><div class="stamp-seal"><span>КРАСНАЯ ПОЛЯНА</span><strong>${esc(shortName(p))}</strong><small>${completedTime(p.completed_at)} · QR</small></div><p class="micro">ШТАМП В ПАСПОРТЕ</p><h1>${n===3?'Паспорт заполнен':n===2?'Остался один':'Первый поставлен'}</h1><p class="success-copy">${n===3?'Все три точки пройдены. Premium уже твой.':`Подарок сохранён. До Premium — ${3-n} ${3-n===1?'штамп':'штампа'}.`}</p><section class="reward-code"><span>ПРОМОКОД ТОЧКИ</span><div><strong>${esc(p.reward_code||'Сохранён')}</strong><button onclick="copyPointCode(${p.seq})">${icon('copy')}<span>Копировать</span></button></div></section>${stampRail(seq)}<button class="btn primary stamp-next" onclick="${n===3?'passportScreen()':'selectPoint(openPoints()[0]?.seq)'}">${n===3?'Открыть мой квест':'Выбрать следующий штамп'}</button></section>`);tg?.HapticFeedback?.notificationOccurred('success')}
function showReward(seq){const p=pointBySeq(seq);show(`${header(`<button class="icon-button" aria-label="Вернуться к квесту" onclick="passportScreen()">${icon('back')}</button>`)}<section class="saved-reward"><div class="stamp-seal small"><span>ПОДАРОК ПАРТНЁРА</span><strong>${esc(shortName(p))}</strong><small>${completedTime(p.completed_at)} · QR</small></div><p class="micro">СОХРАНЕНО В ПАСПОРТЕ</p><h1>${esc(p.reward_title)}</h1><p>${esc(p.reward_text)}</p><section class="reward-code"><span>ПРОМОКОД</span><div><strong>${esc(p.reward_code||'Сохранён')}</strong><button onclick="copyPointCode(${p.seq})">${icon('copy')}<span>Копировать</span></button></div></section><button class="btn primary" onclick="passportScreen()">Вернуться к квесту</button></section>`)}
function copyPointCode(seq){const code=pointBySeq(seq)?.reward_code||'';navigator.clipboard?.writeText(code);toast('Промокод скопирован')}
function copyPremium(){const code=state?.premium?.public_code||'';navigator.clipboard?.writeText(code);toast(code?'Premium скопирован':'Premium ещё оформляется')}
function sharePassport(){const text='Я собрал все 3 штампа в квесте bb.bike по Красной Поляне';const url=`https://t.me/share/url?url=${encodeURIComponent(location.origin)}&text=${encodeURIComponent(text)}`;tg?.openTelegramLink?tg.openTelegramLink(url):window.open(url,'_blank','noopener')}
function closeModal(){modal.innerHTML='';modalTrigger?.focus?.();modalTrigger=null;syncBackButton();if(pendingAutoRender){pendingAutoRender=false;render(false)}}
function syncBackButton(){if(!tg?.BackButton)return;const canGoBack=!!modal.innerHTML||!!root.querySelector('.rules,.saved-reward,.stamp-success,.passport-page,.scanner-screen');canGoBack?tg.BackButton.show():tg.BackButton.hide()}
function handleBack(){if(modal.innerHTML)return closeModal();if(root.querySelector('.scanner-screen'))return routeScreen(selectedSeq,false);if(root.querySelector('.rules'))return state?.session?routeScreen():cover();if(root.querySelector('.saved-reward,.stamp-success'))return passportScreen();if(root.querySelector('.passport-page'))return completed()<3&&state?.session?.status==='active'?routeScreen():tg?.close?.();tg?.close?.()}
function rules(){const r=(state?.points?.[0]?.radius_m)||100;show(`${header(`<button class="icon-button" aria-label="Назад" onclick="cover()">${icon('back')}</button>`)}
<section class="rules-screen">
  <p class="rules-eyebrow">Как проходит квест</p>
  <h1 class="rules-title">Три правила</h1>
  <p class="rules-lead">Гуляй по Красной Поляне, отмечайся на локациях и забирай подарки партнёров. За полный квест — месяц Premium bb.bike.</p>

  <div class="rules-steps">
    <div class="rules-line"></div>
    <div class="rule"><span class="rule-n">1</span><div><b>Выбери точку и доезжай</b>
      <p>Три партнёрские локации в долине. Порядок свободный — начни с той, что ближе. Маршрут построится в Яндекс Картах или 2ГИС прямо из приложения.</p></div></div>
    <div class="rule"><span class="rule-n">2</span><div><b>Подъезжай ближе ${r} метров</b>
      <p>Когда ты рядом, сканер разблокируется сам. Круг вокруг точки виден на карте заранее, так что промахнуться сложно.</p></div></div>
    <div class="rule"><span class="rule-n">3</span><div><b>Сканируй QR у стойки</b>
      <p>Код у партнёра на стойке. Гео и код сходятся — отметка засчитана, подарок сразу твой. Три уникальных кода закрывают квест.</p></div></div>
  </div>

  <div class="rules-gift">
    <span class="gift-ic">${icon('gift')}</span>
    <div><b>Что в конце</b><p>Три отметки открывают Premium bb.bike на 30 дней. Промокод придёт прямо в приложение.</p></div>
  </div>

  <div class="rules-geo">
    <span class="geo-dot"><i></i><b></b></span>
    <div><b>Гео работает только внутри квеста</b>
      <p>Позиция запрашивается по кнопке и не отслеживается постоянно. Партнёр видит только отметку, а не твой маршрут. Координаты стираются через 7 дней.</p></div>
  </div>

  <div class="rules-safety">${icon('shield')}<p>Во время поездки следи за дорогой. Телефон — только после полной остановки.</p></div>

  <button class="btn primary rules-btn" onclick="cover()"><span>Понятно, к маршруту</span></button>
</section>`)}
function emptyState(title,text,action='refresh()'){show(`${header()}<section class="empty"><div class="empty-stamp">bb.</div><h1>${esc(title)}</h1><p>${esc(text)}</p><button class="btn secondary" onclick="${action}">Проверить снова</button></section>`)}
function render(track=true){if(!state?.campaign)return emptyState('Маршрут ещё готовят','Скоро здесь появятся точки Красной Поляны.');if(state.campaign.status!=='active')return state.session&&completed()?passportScreen('Квест сейчас на паузе. Полученные штампы и подарки сохранены.'):emptyState('Квест сейчас на паузе','Прогресс и уже полученные подарки останутся на месте.');if(!state.session)return cover();if(state.session.status==='expired')return completed()?passportScreen('Маршрут приостановлен. Нажми «Проверить снова», чтобы продолжить.'):emptyState('Маршрут приостановлен','Прогресс сохранён. Открой квест снова, чтобы продолжить.');selectedSeq=selectedSeq||openPoints()[0]?.seq||state.points[0]?.seq;completed()===3?passportScreen():routeScreen(selectedSeq,track)}
function stateFingerprint(value){return JSON.stringify({campaign:value?.campaign,session:value?.session,points:value?.points,premium:value?.premium})}
function canAutoRender(){const tag=document.activeElement?.tagName;return !document.hidden&&!modal.innerHTML&&!qrPopupOpen&&!['INPUT','TEXTAREA','SELECT'].includes(tag)&&!root.querySelector('.rules,.stamp-success,.saved-reward,.scanner-screen')}
async function refresh(options={}){const silent=!!options.silent;if(syncInFlight)return;syncInFlight=true;try{const payload=await api('/api/quest/state');if(lastBuildVersion&&payload.build_version&&payload.build_version!==lastBuildVersion){if(canAutoRender())location.reload();return}if(payload.build_version)lastBuildVersion=payload.build_version;const before=stateFingerprint(state),after=stateFingerprint(payload.data),changed=before!==after;state=payload.data;botUsername=payload.bot_username||'';if(!silent){pendingAutoRender=false;render(true)}else if(changed||pendingAutoRender){if(canAutoRender()){pendingAutoRender=false;render(false)}else pendingAutoRender=true}}catch(e){if(!silent)emptyState('Не получилось открыть квест','Проверь интернет и попробуй ещё раз.')}finally{syncInFlight=false}}
async function publicLanding(){try{const payload=await fetch('/api/public/info',{cache:'no-store'}).then(r=>r.json());const app=payload.app_url||payload.chat_url,chat=payload.chat_url||app;show(`<section class="passport-cover public-cover"><div class="cover-grain"></div><div class="cover-brand"><img src="/static/bb-bike-logo.jpg" alt="bb.bike"><span>КВЕСТ · КРАСНАЯ ПОЛЯНА</span></div><div class="cover-copy"><p class="micro">ПАСПОРТ ДОЛИНЫ</p><h1>Пройди квест долины</h1><p>Три места, три подарка и Premium bb.bike на 30 дней. Прогресс хранится внутри Telegram.</p></div><a class="btn cover-button public-link" href="${esc(app)}">Открыть приложение</a><a class="btn quiet public-link" href="${esc(chat)}">Перейти в чат с ботом</a></section>`)}catch(_){emptyState('Открой квест в Telegram','Эта страница работает внутри личного чата с ботом.')}}
window.addEventListener('offline',()=>toast('Нет сети. Паспорту ничего не угрожает.'));
window.addEventListener('online',()=>refresh({silent:true}));
window.addEventListener('pageshow',()=>initData&&refresh({silent:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&initData)refresh({silent:true})});
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.innerHTML)return closeModal();if(event.key==='Tab'&&modal.innerHTML){const items=[...modal.querySelectorAll('button,input,a[href]')].filter(x=>!x.disabled);if(!items.length)return;const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
tg?.BackButton?.onClick(handleBack);
tg?.onEvent?.('scanQrPopupClosed',()=>{qrPopupOpen=false});
tg?.ready();tg?.expand();tg?.setHeaderColor?.('#06130b');tg?.setBackgroundColor?.('#06130b');tg?.disableVerticalSwipes?.();
setInterval(()=>{if(initData&&canAutoRender())refresh({silent:true})},30000);
setTimeout(initData||dev?refresh:publicLanding,80);
</script>
</body>
</html>
