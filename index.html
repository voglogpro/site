<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18c943">
  <title>BibiBike Квест · Красная Поляна</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="app"><div class="shell" id="app"><div class="splash"><img src="/static/bb-bike-logo.jpg" alt="BibiBike"><b>Готовим приключение…</b></div></div></main>
<div id="modal"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const tg=window.Telegram?.WebApp,initData=tg?.initData||'',root=document.getElementById('app'),modal=document.getElementById('modal');
let state=null,botUsername='',localPosition=null,pointOrder=[],selectedPoint=null;
const dev=location.hostname==='127.0.0.1'||location.hostname==='localhost';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function requestId(){return crypto.randomUUID?.()||Date.now()+'-'+Math.random()}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'tma '+initData,'Content-Type':'application/json',...(options.headers||{})}}),p=await r.json().catch(()=>({ok:false,message:'Сервис не ответил'}));if(!r.ok||p.ok===false)throw new Error(p.message||'Ошибка');return p}
function eventLog(event_type,point_id=null,navigator=''){api('/api/quest/event',{method:'POST',body:JSON.stringify({event_type,point_id,navigator,request_id:requestId()})}).catch(()=>{})}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),3000)}
function show(h){root.innerHTML=h;window.scrollTo({top:0,behavior:'instant'});tg?.HapticFeedback?.impactOccurred('light')}
function topbar(extra=''){return `<header class="topbar"><div class="brand"><img class="brand-logo" src="/static/bb-bike-logo.jpg" alt="BibiBike"><span>Квест</span></div>${extra}</header>`}
function completed(){return (state?.points||[]).filter(p=>p.completed_at).length}
function distance(a,b,c,d){const r=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*r*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function fmt(m){return m==null?'':m<1000?Math.round(m)+' м':(m/1000).toFixed(1).replace('.',',')+' км'}
function points(){const src=[...(state?.points||[])];return pointOrder.length?src.sort((a,b)=>pointOrder.indexOf(a.seq)-pointOrder.indexOf(b.seq)):src}
function welcome(){show(`${topbar()}<section class="screen welcome"><div class="quest-poster"><span class="poster-kicker">КВЕСТ · КРАСНАЯ ПОЛЯНА</span><div class="poster-bolt">ϟ</div><h1>Выбирай точку.<br>Забирай подарок.</h1><p>Три ярких места — в любом порядке.</p><div class="poster-badges"><b>3 точки</b><b>3 подарка</b><b>30 дней Premium</b></div></div><button class="btn primary big" onclick="startIntro()">Выбрать первую точку</button><button class="btn ghost" onclick="rules()">Как получить подарки</button><div class="trust">✓ Без трансляции геопозиции</div></section>`)}
function startIntro(){show(`${topbar('<button class="icon-btn" onclick="welcome()" aria-label="Назад">←</button>')}<section class="screen"><p class="eyebrow">Всё просто</p><h1>Три шага до подарков</h1><div class="steps colorful"><div class="step"><span class="step-num">1</span><p><b>Выбери любое место</b><br><span class="muted">Можно начать с ближайшего или самого интересного.</span></p></div><div class="step"><span class="step-num">2</span><p><b>Открой навигатор</b><br><span class="muted">Яндекс Карты или 2ГИС построят путь от тебя.</span></p></div><div class="step"><span class="step-num">3</span><p><b>Сканируй QR на точке</b><br><span class="muted">Подарок сразу появится в приложении.</span></p></div></div><label class="check"><input id="rules-ok" type="checkbox"><span>Я согласен с <a href="/privacy.html" target="_blank">правилами квеста и обработки данных</a>.</span></label><button class="btn primary" onclick="startQuest(event)">Начать приключение</button></section>`)}
async function startQuest(e){if(!document.getElementById('rules-ok')?.checked)return toast('Подтверди правила квеста');e.currentTarget.disabled=true;try{state=(await api('/api/quest/start',{method:'POST',body:JSON.stringify({privacy_accepted:true,request_id:requestId()})})).data;catalog()}catch(x){toast(x.message);e.currentTarget.disabled=false}}
function progress(){const n=completed();return `<div class="progress-card"><div><span>ТВОЙ ПРОГРЕСС</span><strong>${n}<small>/3</small></strong></div><div class="progress-track">${[1,2,3].map(i=>`<i class="${i<=n?'done':''}"></i>`).join('')}</div><b>${n===0?'Всё впереди!':n===3?'Финиш!':`До Premium — ${3-n}`}</b></div>`}
function pointCard(p){const done=!!p.completed_at,d=localPosition?distance(localPosition.lat,localPosition.lon,p.latitude,p.longitude):null;return `<article class="place c${p.seq} ${done?'is-done':''}" onclick="pointDetail(${p.seq})"><div class="place-art"><span class="place-number">${done?'✓':p.seq}</span><span class="place-gift">${['','ПОДАРОК','СЮРПРИЗ','ФИНАЛ'][p.seq]}</span></div><div class="place-body"><div class="place-meta"><span>${done?'Пройдено':(d!=null?fmt(d):'Точка '+p.seq)}</span>${p.partner_hours?`<span>${esc(p.partner_hours)}</span>`:''}</div><h2>${esc(p.point_name)}</h2><p>${esc(p.address)}</p><div class="gift"><span>Здесь получишь</span><b>${esc(p.reward_title)}</b></div>${done?`<button class="btn reward-btn" onclick="event.stopPropagation();showReward(${p.seq})">Открыть подарок</button>`:`<button class="btn primary" onclick="event.stopPropagation();chooseNavigator(${p.seq})">Построить маршрут</button><button class="btn secondary" onclick="event.stopPropagation();scanPoint(${p.seq})">Я на месте · QR</button>`}</div></article>`}
function catalog(){eventLog('catalog_open');const pending=points().filter(p=>!p.completed_at),done=points().filter(p=>p.completed_at);show(`${topbar('<button class="icon-btn" onclick="refresh()" aria-label="Обновить">↻</button>')}<section class="screen">${progress()}<div class="catalog-head"><div><p class="eyebrow">Порядок не важен</p><h1>Куда поедем?</h1></div></div><button class="nearest ${localPosition?'active':''}" onclick="nearest()"><span>⌖</span><div><b>${localPosition?'Ближайшие сверху':'Показать ближайшие'}</b><small>${localPosition?'Рассчитано только на телефоне':'Геопозиция не отправится боту'}</small></div></button><div class="places">${pending.map(pointCard).join('')}${done.length?`<h3 class="section-title">Уже пройдено</h3>${done.map(pointCard).join('')}`:''}</div><p class="safety">Смотри маршрут только после полной остановки.</p></section>`)}
async function nearest(){try{const p=await oneLocation();if(!p)return toast('Не удалось получить геопозицию');localPosition=p;pointOrder=[...state.points].sort((a,b)=>distance(p.lat,p.lon,a.latitude,a.longitude)-distance(p.lat,p.lon,b.latitude,b.longitude)).map(x=>x.seq);catalog();toast('Ближайшие точки подняты вверх')}catch(_){toast('Разреши геопозицию в настройках Telegram')}}
function oneLocation(){return new Promise(resolve=>{let ended=false;const finish=v=>{if(!ended){ended=true;resolve(v)}};setTimeout(()=>finish(null),6000);if(tg?.LocationManager){const get=()=>tg.LocationManager.getLocation(v=>finish(v?{lat:v.latitude,lon:v.longitude}:null));tg.LocationManager.isInited?get():tg.LocationManager.init(get)}else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(v=>finish({lat:v.coords.latitude,lon:v.coords.longitude}),()=>finish(null),{enableHighAccuracy:false,timeout:5000,maximumAge:120000});else finish(null)})}
function pointDetail(seq){const p=state.points.find(x=>x.seq===seq);eventLog('point_view',p.point_id);show(`${topbar('<button class="icon-btn" onclick="catalog()" aria-label="Назад">←</button>')}<section class="screen"><div class="detail-hero c${p.seq}"><span class="place-number">${p.completed_at?'✓':p.seq}</span><p>${esc(p.reward_title)}</p></div><p class="eyebrow">Точка ${p.seq}</p><h1>${esc(p.point_name)}</h1><p class="lead">${esc(p.address)}</p>${p.partner_hours?`<div class="info-row"><b>Часы работы</b><span>${esc(p.partner_hours)}</span></div>`:''}<div class="gift large"><span>Твой подарок</span><b>${esc(p.reward_title)}</b><p>${esc(p.reward_text)}</p></div>${p.completed_at?`<button class="btn primary" onclick="showReward(${p.seq})">Открыть подарок</button>`:`<button class="btn primary big" onclick="chooseNavigator(${p.seq})">Построить маршрут</button><button class="btn secondary" onclick="scanPoint(${p.seq})">Я уже на месте · сканировать QR</button>`}</section>`)}
function chooseNavigator(seq){const p=state.points.find(x=>x.seq===seq);selectedPoint=seq;modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="sheet-head"><div><p class="eyebrow">Маршрут до точки</p><h2>${esc(p.point_name)}</h2></div><button class="icon-btn" onclick="closeModal()">×</button></div><p class="muted">Навигатор сам определит твоё текущее местоположение.</p><div class="navigator-grid"><button class="nav-card yandex" onclick="openRoute(${seq},'yandex','bc')"><b>Я</b><span>Яндекс<br><small>на Бибибайке</small></span></button><button class="nav-card yandex" onclick="openRoute(${seq},'yandex','pd')"><b>Я</b><span>Яндекс<br><small>пешком</small></span></button><button class="nav-card dgis" onclick="openRoute(${seq},'2gis','car')"><b>2</b><span>2ГИС<br><small>на машине</small></span></button><button class="nav-card dgis" onclick="openRoute(${seq},'2gis','pedestrian')"><b>2</b><span>2ГИС<br><small>пешком</small></span></button></div><button class="btn ghost" onclick="copyAddress(${seq})">Скопировать адрес</button></section></div>`}
function openRoute(seq,provider,mode){const p=state.points.find(x=>x.seq===seq);eventLog('navigator_open',p.point_id,provider);let url=provider==='yandex'?`https://yandex.ru/maps/?rtext=~${p.latitude},${p.longitude}&rtt=${mode}`:`https://2gis.ru/routeSearch/${mode==='pedestrian'?'rsType/pedestrian/':''}to/${p.longitude},${p.latitude}/go`;closeModal();tg?.openLink?tg.openLink(url):window.open(url,'_blank','noopener')}
function copyAddress(seq){const p=state.points.find(x=>x.seq===seq);navigator.clipboard?.writeText(p.address);toast('Адрес скопирован')}
function scanPoint(seq){const p=state.points.find(x=>x.seq===seq);selectedPoint=seq;eventLog('qr_open',p.point_id);if(tg?.showScanQrPopup)tg.showScanQrPopup({text:'Наведи камеру на QR BibiBike у партнёра'},v=>{tg.closeScanQrPopup();submitQr(v);return true});else manualCode()}
function manualCode(){modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="sheet-head"><h2>Код точки</h2><button class="icon-btn" onclick="closeModal()">×</button></div><p class="muted">Введи короткий код с фирменной таблички BibiBike.</p><label class="field">Код<input id="manual-code" autocomplete="off" autocapitalize="characters" maxlength="80" placeholder="Например: A1B2C3"></label><button class="btn primary" onclick="submitQr(document.getElementById('manual-code').value)">Получить подарок</button></section></div>`}
async function submitQr(v){if(!v)return toast('Код не распознан');try{const before=completed();state=(await api('/api/quest/scan',{method:'POST',body:JSON.stringify({qr_code:v,request_id:requestId()})})).data;closeModal();const after=completed();after>before?celebrate(state.event?.point_completed):catalog()}catch(x){toast(x.message)}}
function confetti(){return `<div class="confetti">${Array.from({length:18},(_,i)=>`<i style="--i:${i}"></i>`).join('')}</div>`}
function celebrate(seq){const p=state.points.find(x=>x.seq===seq),n=completed();show(`${topbar()}<section class="screen celebration">${confetti()}<div class="reward-burst">+1</div><p class="eyebrow">Есть! Точка подтверждена</p><h1>${n===3?'Красная Поляна пройдена!':'Подарок твой'}</h1><p class="lead">${n===3?'Три из трёх. Финальная награда уже готова.':`Осталось ещё ${3-n} ${3-n===1?'место':'места'}.`}</p><div class="gift-ticket c${p.seq}"><span>${n===3?'ФИНАЛЬНАЯ НАГРАДА':'ТВОЙ ПОДАРОК'}</span><h2>${esc(n===3?state.campaign.premium_title:p.reward_title)}</h2><p>${esc(n===3?state.campaign.premium_instruction:p.reward_text)}</p><div class="code">${esc(n===3?state.premium?.public_code:p.reward_code)}</div></div><button class="btn primary big" onclick="${n===3?'finalScreen()':'catalog()'}">${n===3?'Забрать Premium':'Выбрать следующую точку'}</button></section>`);tg?.HapticFeedback?.notificationOccurred('success')}
function showReward(seq){const p=state.points.find(x=>x.seq===seq);show(`${topbar('<button class="icon-btn" onclick="catalog()">←</button>')}<section class="screen celebration"><p class="eyebrow">Сохранённый подарок</p><h1>${esc(p.reward_title)}</h1><div class="gift-ticket c${p.seq}"><p>${esc(p.reward_text)}</p><div class="code">${esc(p.reward_code)}</div></div><button class="btn secondary" onclick="copyCode('${esc(p.reward_code)}')">Скопировать код</button></section>`)}
function finalScreen(){show(`${topbar('<span class="chip good">3 из 3</span>')}<section class="screen celebration">${confetti()}<div class="reward-burst">★</div><p class="eyebrow">Финиш</p><h1>Ты сделал это!</h1><p class="lead">Все места пройдены. Premium bb.bike на 30 дней — твой.</p><div class="gift-ticket finale"><h2>${esc(state.campaign.premium_title)}</h2><div class="code">${esc(state.premium?.public_code||'Оформляется')}</div><p>${esc(state.campaign.premium_instruction)}</p></div><button class="btn primary" onclick="copyCode('${esc(state.premium?.public_code||'')}')">Скопировать код</button><button class="btn secondary" onclick="catalog()">Все подарки</button></section>`)}
function copyCode(c){navigator.clipboard?.writeText(c);toast('Код скопирован')}
function closeModal(){modal.innerHTML=''}
function rules(){show(`${topbar('<button class="icon-btn" onclick="welcome()">←</button>')}<section class="screen"><p class="eyebrow">Как играть</p><h1>Свободный маршрут</h1><div class="steps colorful"><div class="step"><span class="step-num">1</span><p>Выбери любую из трёх точек.</p></div><div class="step"><span class="step-num">2</span><p>Открой Яндекс Карты или 2ГИС и доберись до места.</p></div><div class="step"><span class="step-num">3</span><p>Остановись, найди табличку BibiBike и сканируй QR.</p></div></div><div class="trust">⌖ «Ближайшие» использует координату один раз только на телефоне. Бот её не получает.</div><button class="btn primary" onclick="welcome()">Понятно</button></section>`)}
function render(){const s=state?.session;if(!state?.campaign)return inactive();if(!s)return state.campaign.status==='active'?welcome():inactive();if(s.status==='completed')return finalScreen();if(s.status==='expired')return ended();catalog()}
function inactive(){show(`${topbar()}<section class="screen empty"><div class="reward-burst">ϟ</div><h1>Квест скоро стартует</h1><p class="lead">Команда готовит реальные места и подарки Красной Поляны.</p><button class="btn secondary" onclick="refresh()">Проверить снова</button></section>`)}
function ended(){show(`${topbar()}<section class="screen empty"><h1>Время квеста закончилось</h1><p class="lead">Полученные подарки сохранены. Напиши поддержке, если нужна помощь.</p><a class="btn secondary link-btn" href="${esc(state.support_url)}">Связаться с поддержкой</a></section>`)}
async function refresh(){try{const p=await api('/api/quest/state');state=p.data;botUsername=p.bot_username||'';render()}catch(e){show(`${topbar()}<section class="screen empty"><h1>Не получилось загрузить квест</h1><p class="lead">Проверь интернет и попробуй ещё раз.</p><button class="btn primary" onclick="refresh()">Повторить</button></section>`)}}
window.addEventListener('offline',()=>toast('Нет сети. Сохранённые подарки не пропадут.'));
tg?.ready();tg?.expand();tg?.setHeaderColor?.('#18c943');tg?.setBackgroundColor?.('#07130b');tg?.disableVerticalSwipes?.();setTimeout(refresh,100);
</script>
</body></html>
