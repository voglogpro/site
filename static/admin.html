<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110b">
  <title>BibiBike Quest · Управление</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background:#07110b; }
    .admin-app { min-height:100dvh; }
    .sidebar { display:none; }
    .admin-main { padding:max(16px,env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom)); }
    .admin-content { max-width:1380px; margin:auto; }
    .admin-title { display:flex; justify-content:space-between; align-items:start; gap:16px; margin-bottom:20px; }
    .admin-title h1 { font-size:30px; margin-bottom:6px; }
    .metrics { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px; }
    .metric { padding:16px; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
    .metric span { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; }
    .metric strong { display:block; margin-top:8px; font:800 31px/1 var(--display); }
    .admin-grid { display:grid; gap:14px; }
    .panel { padding:18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    .panel-head h2 { margin:0; font-size:21px; }
    .point-admin { display:grid; gap:8px; }
    .point-order { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; color:var(--brand-text); background:var(--active); font-weight:900; }
    .point-line { display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:12px; padding:13px; border:1px solid var(--line); border-radius:13px; }
    .point-line p { margin:3px 0 0; color:var(--muted); font-size:13px; }
    .status-select { min-height:44px; margin:0; width:auto; }
    .people { display:grid; gap:8px; }
    .person { display:grid; grid-template-columns:1fr auto; gap:12px; padding:14px; border:1px solid var(--line); border-radius:13px; }
    .person p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .person-side { text-align:right; }
    .tag { display:inline-flex; padding:5px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); font-size:12px; font-weight:700; }
    .tag.active,.tag.completed { color:var(--brand-text); background:rgba(43,194,74,.08); }
    .bottom-nav { position:fixed; z-index:10; left:0; right:0; bottom:0; height:calc(72px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(4,1fr); padding:6px 8px env(safe-area-inset-bottom); border-top:1px solid var(--line); background:rgba(7,17,11,.96); backdrop-filter:blur(18px); }
    .nav-btn { min-width:0; border:0; background:none; color:var(--muted); font-size:12px; font-weight:700; }
    .nav-btn.active { color:var(--brand-text); }
    .nav-icon { width:22px; height:22px; display:block; margin:0 auto 4px; }
    .qr-preview { width:220px; max-width:100%; display:block; margin:14px auto; padding:10px; border-radius:12px; background:#fff; }
    @media (min-width:900px) {
      .admin-app { display:grid; grid-template-columns:232px minmax(0,1fr); }
      .sidebar { position:sticky; top:0; height:100dvh; display:flex; flex-direction:column; padding:26px 18px; border-right:1px solid var(--line); background:#061009; }
      .side-nav { display:grid; gap:7px; margin-top:36px; }
      .side-btn { min-height:48px; border:0; border-radius:13px; padding:0 14px; text-align:left; background:transparent; color:var(--muted); font-weight:750; cursor:pointer; }
      .side-btn.active { color:var(--text); background:var(--active); box-shadow:inset 3px 0 var(--brand); }
      .side-foot { margin-top:auto; color:var(--muted); font-size:13px; }
      .admin-main { padding:28px 34px 50px; }
      .admin-title h1 { font-size:38px; }
      .metrics { grid-template-columns:repeat(4,1fr); }
      .admin-grid { grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr); }
      .panel.full { grid-column:1/-1; }
      .bottom-nav { display:none; }
    }
  </style>
</head>
<body><div class="admin-app">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">bb.</span><span>Quest CRM</span></div><nav class="side-nav"><button class="side-btn active" data-page="overview">Обзор</button><button class="side-btn" data-page="points">Точки</button><button class="side-btn" data-page="participants">Участники</button><button class="side-btn" data-page="more">Ещё</button></nav><div class="side-foot">Красная Поляна<br>Панель администратора</div></aside>
  <main class="admin-main"><div id="admin-root" class="admin-content"><h1>Проверяем доступ</h1><p class="lead">Загружаем состояние квеста.</p></div></main>
  <nav class="bottom-nav"><button class="nav-btn active" data-page="overview">Обзор</button><button class="nav-btn" data-page="points">Точки</button><button class="nav-btn" data-page="participants">Участники</button><button class="nav-btn" data-page="more">Ещё</button></nav>
</div><div id="modal"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const tg=window.Telegram?.WebApp, DEV=new URLSearchParams(location.search).get('dev')==='1', initData=tg?.initData||(DEV?'dev':'');
let model=null,page='overview'; const el=document.getElementById('admin-root'),modal=document.getElementById('modal');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:'tma '+initData,'Content-Type':'application/json',...(opt.headers||{})}});const p=await r.json().catch(()=>({message:'Сервис не ответил'}));if(!r.ok||p.ok===false)throw new Error(p.message||'Ошибка');return p;}
function toast(t){const n=document.getElementById('toast');n.textContent=t;n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),3200);}
function header(title,sub=''){return `<header class="admin-title"><div><p class="eyebrow">BibiBike Quest</p><h1>${title}</h1><p class="muted">${sub}</p></div><button class="icon-btn" onclick="load()" aria-label="Обновить">↻</button></header>`}
function setPage(next){page=next;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();}
document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>setPage(x.dataset.page));
function overview(){const m=model.metrics||{},c=model.campaign||{};return `${header('Операционный обзор','Состояние маршрута, участники и выдача наград')}<section class="metrics"><div class="metric"><span>На маршруте</span><strong>${m.active||0}</strong></div><div class="metric"><span>Завершили</span><strong>${m.completed||0}</strong></div><div class="metric"><span>Истекло</span><strong>${m.expired||0}</strong></div><div class="metric"><span>Всего стартов</span><strong>${m.total||0}</strong></div></section><div class="admin-grid"><section class="panel"><div class="panel-head"><h2>Квест</h2><span class="tag ${c.status==='active'?'active':''}">${statusName(c.status)}</span></div><label class="field">Статус<select id="campaign-status"><option value="draft">Черновик</option><option value="active">Активен</option><option value="paused">Пауза</option><option value="ended">Завершён</option></select></label><label class="field">Длительность сессии, минут<input id="campaign-duration" type="number" min="30" max="1440" value="${c.session_duration_min||240}"></label><button class="btn primary" onclick="saveCampaign()">Сохранить состояние</button></section><section class="panel"><div class="panel-head"><h2>Готовность</h2></div><div class="steps"><div class="step"><span class="step-num">${model.points.length}</span><p><b>Точки маршрута</b><br><span class="muted">Для запуска нужны три реальные точки.</span></p></div><div class="step"><span class="step-num">${model.points.filter(x=>!x.address.startsWith('Укажите')).length}</span><p><b>Реальные адреса</b><br><span class="muted">Демо-данные блокируют запуск.</span></p></div></div></section><section class="panel full"><div class="panel-head"><h2>Последние участники</h2><button class="btn ghost" style="width:auto" onclick="setPage('participants')">Все участники</button></div>${people(model.recent.slice(0,6))}</section></div>`}
function points(){return `${header('Точки маршрута','Порядок, геозона, награда и физический QR')}<section class="panel"><div class="point-admin">${model.points.map(p=>`<div class="point-line"><span class="point-order">${p.seq}</span><div><b>${esc(p.name)}</b><p>${esc(p.address)} · ${p.radius_m} м</p></div><button class="icon-btn" onclick="editPoint(${p.id})" aria-label="Редактировать">›</button></div>`).join('')}</div></section><div class="banner" style="margin-top:14px">Изменения не меняют маршрут уже едущих участников: у каждой сессии хранится снимок точек.</div>`}
function people(rows){if(!rows?.length)return '<p class="muted">Участников пока нет.</p>';return `<div class="people">${rows.map(p=>`<div class="person"><div><b>${esc(p.display_name)}</b><p>${p.username?'@'+esc(p.username):'Telegram ID '+String(p.user_id).slice(-4).padStart(8,'•')} · ${p.current_seq>3?'3/3':Math.max(0,p.current_seq-1)+'/3'}</p>${p.premium_status?`<p>Премиум: ${p.premium_status==='issued'?'выдан':'ожидает выдачи'} · ${esc(p.premium_code)}</p>`:''}</div><div class="person-side"><span class="tag ${p.status}">${sessionName(p.status)}</span>${p.integrity_status!=='ok'?'<p style="color:var(--warning)">Нужна проверка</p>':''}${p.premium_status==='pending'?`<button class="btn ghost" style="min-height:34px;padding:4px;margin-top:6px" onclick="issuePremium('${p.id}')">Отметить выдачу</button>`:''}</div></div>`).join('')}</div>`}
function participants(){return `${header('Участники','Прогресс, связь и статус финальной награды')}<section class="panel"><div style="display:grid;grid-template-columns:1fr minmax(130px,.35fr);gap:10px;margin-bottom:14px"><input id="people-search" style="margin:0" placeholder="Поиск по имени" oninput="filterPeople()"><select id="people-status" style="margin:0" onchange="filterPeople()"><option value="">Все статусы</option><option value="active">На маршруте</option><option value="awaiting_location">Ждут гео</option><option value="completed">Завершили</option><option value="expired">Истекло</option></select></div><div id="people-list">${people(model.recent)}</div></section>`}
function filterPeople(){const q=document.getElementById('people-search').value.toLowerCase(),s=document.getElementById('people-status').value;document.getElementById('people-list').innerHTML=people(model.recent.filter(p=>(!s||p.status===s)&&(!q||(p.display_name+' '+p.username).toLowerCase().includes(q))))}
function more(){return `${header('Ещё','Выгрузка и правила обработки данных')}<div class="admin-grid"><section class="panel"><h2>Премиум</h2><p class="muted">Скачай список завершивших квест для выдачи премиума. CSV защищён от формул Excel и не содержит координат.</p><a class="btn primary" style="display:grid;place-items:center;text-decoration:none" href="/api/admin/export.csv" onclick="downloadCsv(event)">Скачать CSV</a></section><section class="panel"><h2>Приватность</h2><p class="muted">Точные наблюдения геопозиции автоматически удаляются после заданного срока. В прогрессе остаётся только факт посещения и минимальная дистанция.</p><a href="/privacy.html" target="_blank">Открыть политику</a></section><section class="panel full"><h2>Перед реальным запуском</h2><div class="steps"><div class="step"><span class="step-num">1</span><p>Укажи реальные адреса, координаты, часы и подарки.</p></div><div class="step"><span class="step-num">2</span><p>Обнови QR каждой точки и распечатай только последний вариант.</p></div><div class="step"><span class="step-num">3</span><p>Проверь маршрут на реальном телефоне и только потом включай квест.</p></div></div></section></div>`}
function render(){if(!model)return; el.innerHTML=({overview,points,participants,more}[page])(); if(page==='overview')document.getElementById('campaign-status').value=model.campaign.status;}
function statusName(v){return {draft:'Черновик',active:'Активен',paused:'На паузе',ended:'Завершён'}[v]||v}
function sessionName(v){return {awaiting_location:'Ждёт гео',active:'На маршруте',completed:'Завершил',expired:'Истёк',cancelled:'Отменён'}[v]||v}
async function load(){try{model=(await api('/api/admin/overview')).data;render()}catch(e){el.innerHTML=`${header('Доступ закрыт')}<div class="panel"><h2>Не удалось открыть панель</h2><p class="muted">Открой админку из личного чата с ботом. Доступ определяется серверным списком ADMIN_IDS.</p><button class="btn primary" onclick="load()">Повторить</button></div>`}}
async function saveCampaign(){try{model=(await api('/api/admin/campaign',{method:'POST',body:JSON.stringify({status:document.getElementById('campaign-status').value,session_duration_min:+document.getElementById('campaign-duration').value})})).data;toast('Состояние сохранено');render()}catch(e){toast(e.message)}}
async function issuePremium(id){if(!confirm('Подтвердить фактическую выдачу premium этому участнику?'))return;try{model=(await api('/api/admin/premium/'+id+'/issued',{method:'POST',body:'{}'})).data;toast('Выдача отмечена');render()}catch(e){toast(e.message)}}
function editPoint(id){const p=model.points.find(x=>x.id===id);modal.innerHTML=`<div class="modal"><section class="sheet"><div class="sheet-head"><h2>Точка ${p.seq}</h2><button class="icon-btn" onclick="closeModal()">×</button></div><form onsubmit="savePoint(event,${id})"><label class="field">Название<input name="name" required value="${esc(p.name)}"></label><label class="field">Адрес<input name="address" required value="${esc(p.address)}"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="field">Широта<input name="latitude" inputmode="decimal" required value="${p.latitude}"></label><label class="field">Долгота<input name="longitude" inputmode="decimal" required value="${p.longitude}"></label></div><label class="field">Радиус, м<input name="radius_m" type="number" min="30" max="500" required value="${p.radius_m}"></label><label class="field">Часы работы<input name="partner_hours" value="${esc(p.partner_hours)}" placeholder="Ежедневно 09:00–21:00"></label><label class="field">Короткое название подарка<input name="reward_title" required value="${esc(p.reward_title)}"></label><label class="field">Как получить<textarea name="reward_text" required>${esc(p.reward_text)}</textarea></label><button class="btn primary">Сохранить точку</button></form><button class="btn danger" onclick="rotateQr(${id})">Обновить физический QR</button><div id="qr-result"></div></section></div>`}
function closeModal(){modal.innerHTML=''}
async function savePoint(e,id){e.preventDefault();const body=Object.fromEntries(new FormData(e.currentTarget));try{model=(await api('/api/admin/points/'+id,{method:'POST',body:JSON.stringify(body)})).data;toast('Точка сохранена');closeModal();render()}catch(x){toast(x.message)}}
async function rotateQr(id){if(!confirm('Старый QR сразу перестанет работать. Продолжить?'))return;try{const p=await api('/api/admin/points/'+id+'/rotate-qr',{method:'POST',body:'{}'});document.getElementById('qr-result').innerHTML=`<img class="qr-preview" src="${p.qr_png}" alt="QR точки"><div class="code">${esc(p.manual_code)}</div><p class="muted">Короткий код нужен, если камера недоступна. Распечатай сейчас: после закрытия полный QR больше не будет показан.</p><button class="btn secondary" onclick="window.print()">Печать</button>`}catch(e){toast(e.message)}}
async function downloadCsv(e){e.preventDefault();try{const r=await fetch('/api/admin/export.csv',{headers:{Authorization:'tma '+initData}});if(!r.ok)throw new Error('Не удалось скачать');const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bibibike-premium.csv';a.click();URL.revokeObjectURL(a.href)}catch(x){toast(x.message)}}
tg?.ready();tg?.expand();tg?.setHeaderColor?.('#07110b');tg?.setBackgroundColor?.('#07110b');load();
</script></body></html>
