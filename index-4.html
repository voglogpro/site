const MAP_THEME_KEY='bbq-map-theme-v1';
let mapTheme=(()=>{try{return localStorage.getItem(MAP_THEME_KEY)==='light'?'light':'dark'}catch(_){return 'dark'}})();
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function requestId(){return crypto.randomUUID?.()||Date.now()+'-'+Math.random()}
/* Связь в долине рвётся, поэтому у запроса есть свой таймаут: без него
   fetch может висеть минутами, а человек смотрит на замерший экран. */
const API_TIMEOUT_MS=15000;
let offlineMode=false;
function setOffline(value){offlineMode=!!value;root.querySelector('.offline-banner')?.remove();if(offlineMode)root.insertAdjacentHTML('afterbegin','<div class="offline-banner" role="status">Нет сети · показан сохранённый прогресс</div>')}
async function api(path,options={}){
  const authData=initData||(dev?'dev':'');
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=ctrl?setTimeout(()=>ctrl.abort(),API_TIMEOUT_MS):null;
  let r;
  try{
    r=await fetch(path,{...options,signal:ctrl?.signal,headers:{Authorization:'tma '+authData,'Content-Type':'application/json',...(options.headers||{})}});
  }catch(err){
    setOffline(true);
    throw new Error(err?.name==='AbortError'?'Сеть отвечает слишком долго. Попробуй ещё раз':'Нет связи с сервером');
  }finally{clearTimeout(timer)}
  const p=await r.json().catch(()=>({ok:false,message:'Сервис не ответил'}));
  if(r.status===401)throw new Error('Telegram не подтвердил вход. Закрой и открой квест заново');
  if(!r.ok||p.ok===false){const error=new Error(p.message||'Ошибка');error.code=p.code||'';error.status=r.status;throw error}
  setOffline(false);
  return p}

/* Паспорт и промокоды должны открываться даже без сети: человек уже
   заработал подарок и показывает его на кассе, где связи может не быть. */
const CACHE_KEY='bbq-state-v3';
function cacheState(value){try{localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),data:value}))}catch(_){/* приватный режим */}}
function cachedState(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return null;const parsed=JSON.parse(raw);return parsed?.data||null}catch(_){return null}}
function eventLog(event_type,point_id=null,navigator=''){api('/api/quest/event',{method:'POST',keepalive:true,body:JSON.stringify({event_type,point_id,navigator,request_id:requestId()})}).catch(()=>{})}
function toast(text){const n=document.getElementById('toast');n.textContent=text;n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),3200)}
function destroyQuestMap(){routeRequestToken++;mapResizeObserver?.disconnect?.();mapResizeObserver=null;clearTimeout(mapReadyTimer);mapReadyTimer=null;mapContextCleanup?.();mapContextCleanup=null;if(glRoute){try{glRoute.destroy()}catch(_){}glRoute=null}routeSeq=null;if(glMap){try{glMap.destroy()}catch(_){}glMap=null;glStyleId='';glClear()}}
function show(html){destroyQuestMap();root.innerHTML=html;if(offlineMode)root.insertAdjacentHTML('afterbegin','<div class="offline-banner" role="status">Нет сети · показан сохранённый прогресс</div>');root.closest('.app')?.classList.toggle('with-tabbar',!!root.querySelector('.tabbar'));window.scrollTo({top:0,behavior:'auto'});requestAnimationFrame(()=>{const target=[...root.querySelectorAll('h1,h2')].find(node=>!node.closest('button'))||root.querySelector('section');if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true})}});setTimeout(syncBackButton,0)}
function completed(){return (state?.points||[]).filter(p=>p.completed_at).length}
function pointBySeq(seq){return state?.points?.find(p=>p.seq===Number(seq))}
function openPoints(){return (state?.points||[]).filter(p=>!p.completed_at)}
function orderedPoints(){const src=[...(state?.points||[])];return pointOrder.length?src.sort((a,b)=>pointOrder.indexOf(a.seq)-pointOrder.indexOf(b.seq)):src}
/* Отбрасываем дефисы и прочие разделители: без этого «Скала - Ресторан»
   превращалось на карте в обрубок «Скала -». */
function shortName(p){const words=String(p?.point_name||('Точка '+p?.seq))
  .replace(/[«»"']/g,'').split(/\s+/).filter(w=>/[\p{L}\p{N}]/u.test(w));
  return words.slice(0,2).join(' ')||('Точка '+(p?.seq||''))}
function completedTime(value){if(!value)return '';const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function distance(a,b,c,d){const r=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*r*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function localDistance(p){return localPosition?distance(localPosition.lat,localPosition.lon,p.latitude,p.longitude):null}
function fmt(m){return m==null?'':m<1000?Math.round(m)+' м':(m/1000).toFixed(1).replace('.',',')+' км'}
function header(right=''){return `<header class="topbar"><button class="brand" onclick="routeScreen()" aria-label="К маршруту"><img src="/static/bb-bike-logo.jpg" alt=""><span>Квест <b>Бибибайк</b></span></button>${right||`<span class="geo-live"><s></s>${localPosition?'позиция получена':'гео по кнопке'}</span>`}</header>`}
/* Набор иконок один — см. ICONS ниже. Раньше здесь была вторая функция icon(),
   которая перетиралась объявлением ниже, и половина иконок исчезала. */
function stampRail(active=selectedSeq){return `<section class="stamp-rail" aria-label="Отметки квеста">${(state?.points||[]).map(p=>{const done=!!p.completed_at,chosen=Number(active)===p.seq,label=`${p.seq}. ${p.point_name}. ${done?'Штамп поставлен':'Штамп не поставлен'}`;return `<button class="stamp-slot ${done?'stamped':''} ${chosen?'selected':''}" aria-label="${esc(label)}" onclick="selectPoint(${p.seq})"><span>${done?esc(shortName(p)):p.seq}</span>${done?`<small>${completedTime(p.completed_at)}</small>`:'<small>точка</small>'}</button>`}).join('')}<div class="stamp-total"><b>${completed()}</b><span>из 3<br>штампов</span></div></section>`}
function routeStage(p){const d=localDistance(p),label=d!=null?fmt(d):'точка '+p.seq;const photo=p.photo_url?`<div class="point-thumb"><img src="${esc(p.photo_url)}" alt="" loading="lazy" onload="this.classList.add('loaded')" onerror="this.closest('.point-thumb').remove()"></div>`:'';return `<section class="route-stage"><div id="quest-map" class="quest-map" aria-label="Карта партнёрских точек"><div class="map-skeleton"><span></span><span></span><span></span></div></div><div class="map-progress" style="--done:${Math.round(completed()/3*100)}%"><b>${completed()}<i>/3</i></b><span>${3-completed()===0?'всё<br>собрано':'осталось<br>'+(3-completed())+(3-completed()===1?' штамп':' штампа')}</span></div><button class="geo-cta ${localPosition?'done':''}" onclick="geoAndRoute(event,${p.seq})">${icon('geo')}<span><b>${localPosition?'Маршрут на велосипеде':'Показать, где я'}</b><i>${localPosition?'Откроется в навигаторе до «'+esc(shortName(p)||('точки '+p.seq))+'»':'Telegram спросит разрешение — позиция берётся один раз'}</i></span></button></section><section class="point-sheet"><div class="point-sheet-head"><span class="lbl">Ближайшая точка · ${p.seq} из 3</span><span class="upd">${localPosition?'обновлено только что':'гео не запрошено'}</span></div><div class="point-row">${photo}<div class="point-col"><h1>${esc(p.point_name)}</h1><p class="addr">${esc(p.address)}${p.partner_hours?' · '+esc(p.partner_hours):''}</p></div></div><div class="point-metrics"><span class="km">${d!=null?label:'—'}</span><span class="pill">${state?.scan_requires_geo?`штамп ставится за ${p.radius_m||100} м`:'QR у стойки партнёра'}</span></div></section>`}
/* Маркер-капля: острый носик смотрит точно в координату точки,
   номера нет — порядок прохождения свободный. Пройденная точка
   получает галочку, выбранная приподнимается и подсвечивается. */
/* Подложка карты.

   Раньше источник был один, и при его недоступности (роуминг, VPN,
   блокировка у оператора) карта оставалась пустой без объяснений:
   предупреждение писалось в элемент #map-health, которого нет в разметке
   и который вдобавок скрыт стилями. Теперь источники перебираются
   по очереди, а если не отвечает ни один — гость видит понятную плашку
   и всё равно может построить маршрут в навигаторе. */



/* ═══ ДВИЖОК КАРТЫ ════════════════════════════════════════════════
   Основной — 2ГИС MapGL: векторная карта, которую рисует видеочип,
   отсюда плавный зум и наклон. Запасной — прежняя растровая карта:
   она включается сама, если ключ не задан или библиотека не загрузилась,
   поэтому неудачное подключение не оставит гостя без карты. */
let glMap=null,glMarkers=[],glRoute=null,glUser=null,glStyleId='',mapEngine='none';
let mapReadyTimer=null,mapContextCleanup=null;

/* ═══ СТАРТОВЫЙ ЭКРАН ══════════════════════════════════════════════
   Живёт ровно заданное время и снимается по таймеру, а не по сигналу
   от карты. Это принципиально: любой не пришедший сигнал раньше
   оставлял человека перед вечной загрузкой. */
const SPLASH_MS=3000;
let splashShown=false;
const SPLASH_TIPS=[
  'Три партнёрские точки в долине. На каждой — свой подарок.',
  'Сканируй зелёную табличку bb.bike у стойки — штамп встанет сам.',
  'Собери все три штампа и получи Premium на 30 дней.',
];

/* Приветствие показывается после заставки, когда карта уже под ним. */
function introOverlay(){
  if(document.getElementById('intro-layer'))return;
  const geo=!!state?.scan_requires_geo,r=(state?.points?.[0]?.radius_m)||100;
  const node=document.createElement('div');
  node.className='intro-layer';node.id='intro-layer';
  node.setAttribute('role','dialog');node.setAttribute('aria-modal','true');
  node.innerHTML=`<div class="intro-card">
    <h2>Добро пожаловать в квест</h2>
    <p>Три партнёрские точки Красной Поляны. На каждой — свой подарок, за все три — Premium на 30 дней.</p>
    <div class="intro-steps">
      <div class="intro-step"><b>1</b><span>Выбирай точку на карте — увидишь адрес, часы работы и подарок.</span></div>
      <div class="intro-step"><b>2</b><span>${geo?`Подъезжай ближе ${r} метров и сканируй зелёную табличку bb.bike у стойки.`:'Заходи к партнёру и сканируй зелёную табличку bb.bike у стойки.'}</span></div>
      <div class="intro-step"><b>3</b><span>Промокод сохранится в паспорте — покажи его на кассе.</span></div>
    </div>
    <button class="btn primary" onclick="closeIntro()">Начать маршрут</button>
  </div>`;
  document.body.appendChild(node);
  requestAnimationFrame(()=>node.classList.add('in'));
  tg?.HapticFeedback?.impactOccurred?.('light');
  syncBackButton()}

function closeIntro(){
  const node=document.getElementById('intro-layer');
  if(!node)return;
  node.classList.remove('in');
  setTimeout(()=>node.remove(),360);
  syncBackButton()}

function runSplash(force=false){
  if(splashShown&&!force)return;
  splashShown=true;
  if(document.getElementById('app-splash'))return;
  const node=document.createElement('div');
  node.className='splash';node.id='app-splash';
  node.setAttribute('role','status');
  node.setAttribute('aria-live','polite');
  node.style.setProperty('--splash-ms',SPLASH_MS+'ms');
  node.innerHTML=`<div class="splash-inner">
    <img class="splash-logo" src="/static/bb-bike-logo.jpg" alt="" onerror="this.remove()">
    <p class="splash-sub">Красная Поляна</p>
    <h1 class="splash-title">Бибибайк Квест</h1>
    <p class="splash-tip" id="splash-tip">${esc(SPLASH_TIPS[0])}</p>
    <div class="splash-bar"><i></i></div>
  </div>`;
  document.body.appendChild(node);
  // Подсказки сменяются, чтобы ожидание было полезным, а не пустым.
  let index=0;
  const tip=node.querySelector('#splash-tip');
  const cycle=setInterval(()=>{
    index=(index+1)%SPLASH_TIPS.length;
    if(!tip)return;
    tip.classList.add('fade');
    setTimeout(()=>{tip.textContent=SPLASH_TIPS[index];tip.classList.remove('fade')},300);
  },1100);
  setTimeout(()=>{
    clearInterval(cycle);
    node.classList.add('done');
    setTimeout(()=>node.remove(),500);
  },SPLASH_MS)}


/* Подпись правообладателей карты. На картах 2ГИС по договорённости
   выводится «BB & 2ГИС», на запасной растровой — источник OpenStreetMap. */
function mapAttribution(){
  return mapEngine==='mapgl'?'Бибибайк & 2ГИС':(state?.map?.attribution||'© OpenStreetMap')}

function mapglKey(){return state?.map?.mapgl_key||''}
function mapglStyle(){return state?.map?.mapgl_style||''}
function mapglStyles(){return state?.map?.mapgl_styles||{}}
function mapglHasStylePair(){const styles=mapglStyles();return !!styles.light&&!!styles.dark}
function configuredMapglStyle(){return mapglHasStylePair()?mapglStyles()[mapTheme]:mapglStyle()}
// Обычного API-ключа достаточно для стандартной карты 2ГИС. Style ID
// нужен только для фирменной пары тем, а не для запуска самого MapGL.
function isIOSDevice(){return /iPad|iPhone|iPod/i.test(navigator.userAgent)||
  (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isAndroidDevice(){return /Android/i.test(navigator.userAgent)}
function chromiumMajor(){const match=navigator.userAgent.match(/(?:Chrome|Chromium)\/(\d+)/i);return match?Number(match[1]):null}
/* MapGL 2ГИС остаётся основным движком на всех поддерживаемых устройствах.
   Растр включается лишь когда официальный isSupported() или обе попытки
   инициализации подтвердили, что WebGL на конкретном устройстве не работает. */
function useMapgl(){return !!mapglKey()&&!!window.mapgl&&!window.__mapglFailed}
function themeToggleMarkup(){
  // Один прежний MAPGL_STYLE нельзя плавно вернуть к стандартному стилю.
  // Для него оставляем фиксированную тему; ключ без стиля и полноценная
  // пара LIGHT/DARK поддерживают переключатель.
  if(useMapgl()&&mapglStyle()&&!mapglHasStylePair())return '';
  const title=mapTheme==='dark'?'Светлая карта':'Тёмная карта';
  return `<button id="map-theme-toggle" class="map-theme-toggle" onclick="toggleMapTheme()" aria-label="${title}" title="${title}">${mapTheme==='dark'?'☀':'☾'}</button>`}
function refreshThemeButton(){
  const button=document.getElementById('map-theme-toggle');if(!button)return;
  const title=mapTheme==='dark'?'Светлая карта':'Тёмная карта';
  button.textContent=mapTheme==='dark'?'☀':'☾';button.setAttribute('aria-label',title);button.title=title}
function applyMapTheme(announce=false){
  const node=document.getElementById('quest-map');refreshThemeButton();if(!node)return;
  if(mapEngine==='mapgl'&&glMap&&mapglHasStylePair()){
    const next=mapglStyles()[mapTheme];
    if(next&&next!==glStyleId){
      const button=document.getElementById('map-theme-toggle');button?.setAttribute('aria-busy','true');
      try{
        const changed=glMap.setStyleById(next);glStyleId=next;
        Promise.resolve(changed).then(()=>button?.removeAttribute('aria-busy')).catch(()=>{
          button?.removeAttribute('aria-busy');toast('Не удалось сменить стиль 2ГИС')})
      }catch(_){button?.removeAttribute('aria-busy');toast('Не удалось сменить стиль 2ГИС')}}}
  if(announce)toast(mapTheme==='dark'?'Тёмная карта включена':'Светлая карта включена')}
function toggleMapTheme(){
  mapTheme=mapTheme==='dark'?'light':'dark';
  try{localStorage.setItem(MAP_THEME_KEY,mapTheme)}catch(_){}
  applyMapTheme(true);tg?.HapticFeedback?.selectionChanged?.()}

function loadMapgl(done){
  if(window.mapgl||window.__mapglFailed)return done();
  if(window.__mapglLoading){window.__mapglQueue.push(done);return}
  window.__mapglLoading=true;window.__mapglQueue=[done];
  let settled=false;
  const finish=()=>{if(settled)return;settled=true;window.__mapglLoading=false;(window.__mapglQueue||[]).forEach(fn=>fn());window.__mapglQueue=[]};
  const el=document.createElement('script');
  el.src='https://mapgl.2gis.com/api/js/v1';
  el.async=true;
  el.onload=()=>{try{
    const supportOptions={failIfMajorPerformanceCaveat:false};
    const supported=typeof window.mapgl?.isSupported!=='function'||window.mapgl.isSupported(supportOptions);
    let reason='';
    if(!supported&&typeof window.mapgl?.notSupportedReason==='function')reason=String(window.mapgl.notSupportedReason(supportOptions)||'');
    window.__mapglDiagnostics={supported,reason,android:isAndroidDevice(),chromium:chromiumMajor(),attempts:[],events:[]};
    if(!supported)window.__mapglFailed=true
  }catch(err){window.__mapglDiagnostics={supported:false,reason:String(err?.message||err),attempts:[],events:[]};window.__mapglFailed=true}finish()};
  el.onerror=()=>{window.__mapglDiagnostics={supported:false,reason:'script_load_error',attempts:[],events:[]};window.__mapglFailed=true;finish()};
  document.head.appendChild(el);
  // Если библиотека молчит, не держим человека перед пустым экраном.
  setTimeout(()=>{if(!window.mapgl){window.__mapglDiagnostics={supported:false,reason:'script_timeout',attempts:[],events:[]};window.__mapglFailed=true;finish()}},9000)}

function pinIcon(active,done){
  const fill=done?'#2f6b33':(active?'#8fe300':'#2a4432');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="46" height="60" viewBox="0 0 46 60">`+
    `<path d="M23 59C23 59 43 36.5 43 23A20 20 0 0 0 3 23C3 36.5 23 59 23 59Z" fill="${fill}" stroke="#07110b" stroke-width="2.5"/>`+
    `<circle cx="23" cy="22" r="7.5" fill="#07110b"/><circle cx="23" cy="22" r="4.5" fill="#fff"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}

function userIcon(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">`+
    `<circle cx="17" cy="17" r="15" fill="#3d8bfd" opacity=".22"/>`+
    `<circle cx="17" cy="17" r="8" fill="#3d8bfd" stroke="#fff" stroke-width="3"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}

function glClear(){
  glMarkers.forEach(m=>{try{m.destroy()}catch(_){}});glMarkers=[];
  if(glUser){try{glUser.destroy()}catch(_){}glUser=null}}

function initGlMap(node,p,compatAttempt=0){
  mapEngine='mapgl';
  const themeButton=document.getElementById('map-theme-toggle');if(themeButton)themeButton.hidden=false;
  try{
    clearTimeout(mapReadyTimer);mapReadyTimer=null;mapContextCleanup?.();mapContextCleanup=null;
    if(glMap){try{glMap.destroy()}catch(_){}glMap=null}
    glClear();glRoute=null;
    const initialStyle=configuredMapglStyle(),android=isAndroidDevice();
    const opts={center:[p.longitude,p.latitude],zoom:14,key:mapglKey(),
      defaultBackgroundColor:mapTheme==='dark'?'#101317':'#e9eee8',zoomControl:false,
      pitch:android?0:32,maxZoom:19,minZoom:10,
      disableAntiAliasing:true,useRtlTextPlugin:'always-off',enableTrackResize:true,
      graphicsPreset:android?'light':'normal'};
    /* Современный Android сначала получает штатный контекст MapGL. WebGL1
       включается только повторной попыткой: постоянное принуждение к нему и
       было причиной чёрной подложки на новых WebView/Mali. */
    if(compatAttempt>0){opts.webglVersion=1;opts.disableRenderingCache=true;opts.graphicsPreset='light'}
    if(initialStyle)opts.style=initialStyle;
    const instance=new mapgl.Map(node,opts);glMap=instance;
    const diag=window.__mapglDiagnostics||(window.__mapglDiagnostics={supported:true,attempts:[],events:[]});
    diag.attempts=diag.attempts||[];diag.events=diag.events||[];
    diag.attempts.push({mode:compatAttempt?'webgl1-compat':'automatic',at:Date.now()});
    glStyleId=initialStyle;
    applyMapTheme(false);
    let styleReady=false,renderReady=false,finished=false,preRenderErrors=0;
    const alive=()=>instance===glMap&&document.body.contains(node)&&mapEngine==='mapgl';
    const record=(type,value='')=>{diag.events.push({type,value:String(value||'').slice(0,180),at:Date.now()});if(diag.events.length>20)diag.events.shift()};
    const fallback=(reason='render_timeout')=>{
      if(finished||renderReady||!alive())return;finished=true;record('retry',reason);
      clearTimeout(mapReadyTimer);mapReadyTimer=null;mapContextCleanup?.();mapContextCleanup=null;
      try{instance.destroy()}catch(_){}if(glMap===instance)glMap=null;glClear();
      node.classList.remove('map-ready');node.innerHTML='<div class="map-skeleton"><span></span><span></span><span></span></div>';
      if(!isIOSDevice()&&compatAttempt===0){mapNotice(node,'Настраиваем 2ГИС для этого устройства…');setTimeout(()=>{if(document.body.contains(node))initGlMap(node,p,1)},80);return}
      window.__mapglFailed=true;mapEngine='none';diag.reason=reason;node.innerHTML='';mapErrorScreen(node,'2ГИС не смог запустить карту на этом устройстве. Попробуй ещё раз.')};
    instance.on?.('styleload',()=>{if(!alive())return;styleReady=true;record('styleload');clearTimeout(mapReadyTimer);mapReadyTimer=setTimeout(()=>fallback('tiles_not_rendered'),18000)});
    instance.on?.('idle',()=>{if(!alive())return;renderReady=true;finished=true;clearTimeout(mapReadyTimer);mapReadyTimer=null;node.classList.add('map-ready');node.querySelector('.map-notice')?.remove();record('idle')});
    instance.on?.('styleloaderror',event=>fallback(event?.error?.message||'styleloaderror'));
    instance.on?.('error',event=>{
      const kind=event?.error?.type||event?.type||'',message=event?.error?.message||event?.message||kind||'map_error';
      const signature=`${kind} ${message}`.toLowerCase();record('error',message);
      const fatal=/invalidtilekey|styleloaderror|webglcontextlost|context lost/.test(signature);
      if(!renderReady&&(fatal||!styleReady||++preRenderErrors>=4))fallback(kind||message);
      else if(renderReady)mapNotice(node,'Часть карты временно не загрузилась — повторяем автоматически.')});
    mapReadyTimer=setTimeout(()=>fallback('style_timeout'),12000);
    requestAnimationFrame(()=>{
      if(!alive())return;const canvas=node.querySelector('canvas');if(!canvas)return;
      const lost=event=>{event.preventDefault?.();record('webglcontextlost');fallback('webglcontextlost')};
      canvas.addEventListener('webglcontextlost',lost,{once:true});mapContextCleanup=()=>canvas.removeEventListener('webglcontextlost',lost)});
    (state?.points||[]).forEach(point=>{
      const marker=new mapgl.Marker(glMap,{
        coordinates:[point.longitude,point.latitude],
        icon:pinIcon(point.seq===p.seq,!!point.completed_at),
        anchor:[23,59],
        label:{text:shortName(point),offset:[0,10],relativeAnchor:[0.5,0],
               fontSize:13,color:'#eaf5ea',haloColor:'#07110b',haloRadius:2}});
      marker.on('click',()=>{sheetOpen=true;selectPoint(point.seq)});
      marker.__seq=point.seq;
      glMarkers.push(marker)});
    if(localPosition){
      glUser=new mapgl.Marker(glMap,{coordinates:[localPosition.lon,localPosition.lat],
        icon:userIcon(),anchor:[17,17]})}
    glFitAll(p);
    if(!node.querySelector('.map-attrib')){
      const a=document.createElement('span');a.className='map-attrib';
      a.textContent=mapAttribution();node.appendChild(a)}
  }catch(err){
    const diag=window.__mapglDiagnostics||(window.__mapglDiagnostics={supported:true,attempts:[],events:[]});
    diag.events=(diag.events||[]).concat({type:'constructor_error',value:String(err?.message||err).slice(0,180),at:Date.now()});
    clearTimeout(mapReadyTimer);mapReadyTimer=null;mapContextCleanup?.();mapContextCleanup=null;
    try{glMap?.destroy()}catch(_){}glMap=null;glClear();
    if(!isIOSDevice()&&compatAttempt===0){node.innerHTML='<div class="map-skeleton"><span></span><span></span><span></span></div>';setTimeout(()=>initGlMap(node,p,1),80);return}
    window.__mapglFailed=true;mapEngine='none';diag.reason=String(err?.message||err);
    mapErrorScreen(node,'2ГИС не смог запустить карту на этом устройстве. Попробуй ещё раз.')}}

function glFitAll(p){
  if(!glMap)return;
  const pts=(state?.points||[]).map(x=>[x.longitude,x.latitude]);
  if(localPosition)pts.push([localPosition.lon,localPosition.lat]);
  if(pts.length<2){glMap.setCenter([p.longitude,p.latitude]);glMap.setZoom(15);return}
  const lons=pts.map(x=>x[0]),lats=pts.map(x=>x[1]);
  const bottom=Math.round(window.innerHeight*(sheetOpen?0.5:0.24))+40;
  try{
    glMap.fitBounds({southWest:[Math.min(...lons),Math.min(...lats)],
                     northEast:[Math.max(...lons),Math.max(...lats)]},
                    {padding:{top:100,bottom:bottom,left:46,right:46},maxZoom:16});
  }catch(_){glMap.setCenter([p.longitude,p.latitude])}}

function routeFacts(){
  /* Раньше «7,8 км» и «~1 ч» были вписаны в вёрстку и продолжали бы врать
     после любой правки точек в CRM. Теперь считаем из реального маршрута. */
  const m=Number(state?.campaign?.route_distance_m)||0;
  const km=m?(m/1000).toFixed(1).replace('.',','):null;
  // 11 км/ч — спокойный темп по долине с остановками у партнёров.
  const minutes=m?Math.max(20,Math.round(m/1000/11*60)+25):null;
  const h=minutes?Math.floor(minutes/60):0,rest=minutes?Math.round((minutes%60)/5)*5:0;
  const time=!minutes?'~1 ч':h?`~${h} ч${rest?' '+rest:''}`:`~${minutes} мин`;
  return `<div><b>${km||'3'}</b><span>${km?'км по долине':'точки в долине'}</span></div>`+
         `<div><b>${time}</b><span>спокойным темпом</span></div>`+
         `<div><b>30</b><span>дней подписки</span></div>`}
/* ─── Сканирование обычной камерой телефона ───────────────────
   На табличке напечатана ссылка https://t.me/<бот>?startapp=<код>.
   Камера открывает Telegram, Telegram передаёт код сюда в start_param —
   и штамп ставится сам, без открытия сканера внутри приложения. */
function questCodeFrom(value){
  value=String(value||'').trim();
  if(!value)return '';
  if(/^(https?:|tg:)/i.test(value)||value.includes('t.me/')){
    try{const u=new URL(value.replace(/^tg:\/\//i,'https://'));
      const q=u.searchParams;
      for(const key of ['startapp','start','tgWebAppStartParam']){const found=q.get(key);if(found)return found.trim()}
      return u.pathname.replace(/\/+$/,'').split('/').pop()||'';
    }catch(_){return value}}
  return value}

function startParam(){
  const raw=tg?.initDataUnsafe?.start_param
    ||new URLSearchParams(location.search).get('startapp')
    ||new URLSearchParams(location.search).get('tgWebAppStartParam')||'';
  const code=questCodeFrom(raw);
  return /^bbq-/i.test(code)?code:''}

async function applyPendingScan(){
  if(!pendingScan)return false;
  const code=pendingScan;
  try{
    if(state?.scan_requires_geo&&!localPosition){toast('Для этого штампа нужна разовая геопозиция');const pos=await oneLocation();if(!pos){routeScreen(selectedSeq,false);toast('Разреши геопозицию и нажми «Где я» — QR сохранён');return false}localPosition=pos}
    const before=completed();
    const payload={qr_code:code,request_id:requestId()};
    if(state?.scan_requires_geo&&localPosition){payload.latitude=localPosition.lat;payload.longitude=localPosition.lon}
    state=(await api('/api/quest/scan',{method:'POST',body:JSON.stringify(payload)})).data;
    pendingScan='';
    cacheState(state);
    const ev=state.event||{};
    if(completed()>before){
      tg?.HapticFeedback?.notificationOccurred?.('success');
      // Сначала печать штампа, дальше человек попадает к партнёру.
      stampSuccess(ev.point_completed);
      setTimeout(()=>partnerScreen(ev.point_completed,true),1600);
      return true}
    if(ev.already_completed){toast('Эта точка уже отмечена');partnerScreen(ev.already_completed);return true}
  }catch(x){if(!offlineMode&&!['geo_required','too_far'].includes(x.code))pendingScan='';toast(x.message)}
  return false}

function cover(){const pts=(state?.points||[]).slice(0,3);show(`<section class="passport-cover">
  <div class="cover-halo"></div>
  ${pendingScan?'<div class="scan-banner">Ты отсканировал табличку партнёра. Прими правила — и штамп за эту точку засчитается сразу.</div>':''}
  <div class="cover-brand"><span class="cover-bb">БИБИБАЙК</span><b>Квест Красной Поляны</b></div>
  <p class="cover-eyebrow">Красная Поляна · 3 штампа</p>
  <h1 class="cover-title">Пройди городской квест</h1>
  <p class="cover-lead">Три точки, три штампа, три подарка партнёров. Полный квест открывает подписку на 30 дней для бесплатного старта на байке.</p>
  <div class="cover-stamps">${[0,1,2].map(i=>`<span><b>${i+1}</b><small>${esc(shortName(pts[i])||'точка')}</small></span>`).join('')}</div>
  <div class="cover-facts">${routeFacts()}</div>
  <label class="consent"><input id="rules-ok" type="checkbox"><span>Принимаю <a href="/privacy.html" target="_blank">правила квеста</a>. Разовая геопозиция не сохраняется ботом.</span></label>
  <button class="btn primary cover-button" onclick="startQuest(event)"><span>Начать квест</span></button>
  <button class="text-button" onclick="rules()">Как всё работает</button></section>`)}
async function startQuest(e){if(!document.getElementById('rules-ok')?.checked)return toast('Сначала прими правила квеста');const sawRules=rulesShown;e.currentTarget.disabled=true;try{state=(await api('/api/quest/start',{method:'POST',body:JSON.stringify({privacy_accepted:true,request_id:requestId()})})).data;cacheState(state);selectedSeq=openPoints()[0]?.seq||state.points[0]?.seq;
    // Человек подтвердил правила — показываем заставку, а карта и точки
    // готовятся за ней, пока он читает подсказки.
    runSplash();
    // Карта поднимается прямо сейчас, под заставкой: к моменту, когда
    // она уйдёт, точки и 2ГИС уже готовы. Правила показываем поверх
    // готовой карты, чтобы не поднимать её заново.
    rulesShown=true;
    // Пришёл по QR — сразу засчитываем точку, правила покажем в профиле.
    if(await applyPendingScan())return;
    routeScreen();
    if(!sawRules)setTimeout(()=>introOverlay(),SPLASH_MS+120);
  }catch(x){toast(x.message);e.currentTarget.disabled=false}}
/* Маршрут рисуется прямо в приложении: линия по дорогам, длина и время.
   Кнопки внешних навигаторов остаются — они нужны для голосовой навигации
   в пути, а здесь человек просто прикидывает, далеко ли ехать. */
let routeSeq=null;

function clearRoute(){
  if(glRoute){try{glRoute.destroy()}catch(_){}glRoute=null}
  routeSeq=null;renderRouteInfo(null)}

async function waitForMap(token,seq){
  for(let i=0;i<180;i++){
    if(token!==routeRequestToken||selectedSeq!==seq)return false;
    if(mapEngine==='mapgl'&&glMap&&document.getElementById('quest-map')?.classList.contains('map-ready'))return true;
    await new Promise(resolve=>setTimeout(resolve,100))}
  return false}

async function drawRoute(seq,ev){
  const p=pointBySeq(seq);
  if(!p)return;
  let token=++routeRequestToken;const button=ev?.currentTarget;
  if(button){button.disabled=true;button.setAttribute('aria-busy','true')}
  if(!localPosition){
    /* Не отправляем человека искать другую кнопку: сразу спрашиваем
       позицию и, получив её, строим маршрут тем же нажатием. */
    toast('Нужна твоя геопозиция — Telegram спросит разрешение');
    const pos=await oneLocation();
    if(!pos){toast('Без геопозиции маршрут не построить. Разреши доступ и попробуй снова');if(button){button.disabled=false;button.removeAttribute('aria-busy')}return}
    localPosition=pos;
    routeScreen(selectedSeq,false);
    token=++routeRequestToken;
    if(!await waitForMap(token,seq)){if(button?.isConnected){button.disabled=false;button.removeAttribute('aria-busy')}return}
  }
  if(routeSeq===seq){clearRoute();renderRouteInfo(null);if(button){button.disabled=false;button.removeAttribute('aria-busy')}return}
  toast('Строим маршрут…');
  try{
    const q=new URLSearchParams({from_lat:localPosition.lat,from_lon:localPosition.lon,
      to_lat:p.latitude,to_lon:p.longitude,mode:'bike'});
    const data=await api('/api/quest/route?'+q.toString());
    if(token!==routeRequestToken||selectedSeq!==seq||!document.querySelector('.map-screen'))return;
    if(mapEngine==='mapgl'){
      if(!glMap)return;
      clearRoute();
      routeSeq=seq;
      glRoute=new mapgl.Polyline(glMap,{
        coordinates:data.points.map(pt=>[pt[1],pt[0]]),
        width:6,color:'#8fe300',zIndex:6});
      const lons=data.points.map(pt=>pt[1]),lats=data.points.map(pt=>pt[0]);
      const bottom=Math.round(window.innerHeight*(sheetOpen?.5:.24))+40;
      try{glMap.fitBounds({southWest:[Math.min(...lons),Math.min(...lats)],
                           northEast:[Math.max(...lons),Math.max(...lats)]},
                          {padding:{top:100,bottom:bottom,left:46,right:46}})}catch(_){}
      renderRouteInfo(data);
      tg?.HapticFeedback?.impactOccurred?.('light');
      return}
    // Карта одна, и это 2ГИС: если её нет, рисовать линию негде.
    toast('Карта недоступна — маршрут можно открыть в навигаторе');
  }catch(x){toast(x.message||'Не удалось построить маршрут')}
  finally{if(button?.isConnected){button.disabled=false;button.removeAttribute('aria-busy')}}}

function renderRouteInfo(data){
  const box=document.getElementById('route-info');
  if(!box)return;
  if(!data){box.classList.remove('show');box.innerHTML='';return}
  const km=(data.distance_m/1000).toFixed(1).replace('.',','),
        min=Math.max(1,Math.round(data.duration_s/60));
  box.innerHTML=`<b>${km} км</b><span>·</span><b>${min} мин</b>`+
    `<span>${data.fallback?'по прямой':'на велосипеде'}</span>`+
    `<button onclick="clearRoute();renderRouteInfo(null)" aria-label="Убрать маршрут">×</button>`;
  box.classList.add('show')}

/* ═══ ЭКРАН МАРШРУТА: карта во весь экран + шторка локации ═══════ */

function toggleSheet(force){
  const el=document.getElementById('loc-sheet');
  if(!el)return;
  sheetOpen=force===undefined?!sheetOpen:!!force;
  el.classList.toggle('open',sheetOpen);
  el.querySelector('.loc-head')?.setAttribute('aria-expanded',String(sheetOpen));
  tg?.HapticFeedback?.selectionChanged?.();
  syncBackButton()}

/* Смахивание работает по всей карточке, а не только по полоске сверху:
   палец ложится куда угодно. Карточка едет за пальцем и решает судьбу
   по расстоянию и скорости броска — как привычные шторки в телефоне.

   Тонкость: внутри есть прокручиваемый текст. Если он не в самом верху,
   жест отдаётся прокрутке, иначе карточку невозможно было бы читать. */
let dragFrom=null,dragAt=0,dragTime=0,dragLive=false,dragNode=null;

function sheetDragStart(ev){
  const sheet=document.getElementById('loc-sheet');
  if(!sheet)return;
  const body=sheet.querySelector('.loc-body');
  const insideScroll=body&&body.contains(ev.target);
  if(sheetOpen&&insideScroll&&body.scrollTop>2)return;   // читает текст — не мешаем
  dragFrom=ev.touches?.[0]?.clientY??null;
  if(dragFrom==null)return;
  dragAt=dragFrom;dragTime=Date.now();dragLive=false;dragNode=sheet;
  window.addEventListener('touchmove',sheetDragMove,{passive:false});
  window.addEventListener('touchend',sheetDragEnd,{once:true});
  window.addEventListener('touchcancel',sheetDragEnd,{once:true})}

function sheetDragMove(ev){
  if(dragFrom==null||!dragNode)return;
  const y=ev.touches?.[0]?.clientY??dragAt,delta=y-dragFrom;
  dragAt=y;
  if(!dragLive){
    if(Math.abs(delta)<7)return;                          // случайное касание
    dragLive=true;dragNode.style.transition='none'}
  ev.preventDefault?.();
  // Открытую тянем вниз, свёрнутую — вверх. В обратную сторону ход тугой.
  const base=sheetOpen?0:dragNode.offsetHeight-sheetPeek();
  let shift=base+delta;
  const min=0,max=dragNode.offsetHeight-sheetPeek();
  if(shift<min)shift=min-Math.pow(min-shift,.55);
  if(shift>max)shift=max+Math.pow(shift-max,.55);
  dragNode.style.transform=`translateY(${shift}px)`}

function sheetPeek(){
  const raw=getComputedStyle(document.documentElement).getPropertyValue('--sheet-peek');
  return parseFloat(raw)||150}

function sheetDragEnd(){
  window.removeEventListener('touchmove',sheetDragMove);
  if(dragNode){dragNode.style.transition='';dragNode.style.transform=''}
  if(dragLive&&dragFrom!=null){
    const delta=dragAt-dragFrom,speed=delta/Math.max(Date.now()-dragTime,1);
    // Быстрый бросок засчитывается даже на коротком расстоянии.
    if(delta>60||speed>0.55)toggleSheet(false);
    else if(delta<-60||speed<-0.55)toggleSheet(true);
  }
  dragFrom=null;dragLive=false;dragNode=null}

function routeScreen(seq=selectedSeq,track=true){
  // Первый вход на карту в этом сеансе тоже прикрываем заставкой:
  // так вернувшийся участник не видит пустой прямоугольник.
  if(!splashShown&&state?.session)runSplash();
  if(!state?.session)return cover();
  if(!rulesShown&&completed()<3){rulesShown=true;return rules()}
  const pending=openPoints(),fallback=pending[0]||state.points[0];
  let p=pointBySeq(seq)||fallback;
  if(p.completed_at&&pending.length)p=pending[0];
  selectedSeq=p.seq;
  if(track){eventLog('catalog_open');eventLog('point_view',p.point_id)}
  const chips=orderedPoints().map(pt=>`<button data-seq="${pt.seq}" class="map-chip ${pt.seq===p.seq?'active':''} ${pt.completed_at?'done':''}" onclick="selectPoint(${pt.seq})" aria-pressed="${pt.seq===p.seq}" aria-label="Точка ${pt.seq}: ${esc(pt.point_name)}. ${pt.seq===p.seq?'Выбрана. ':''}${pt.completed_at?'Штамп получен':'Штамп не получен'}">${pt.completed_at?icon('check'):pt.seq}</button>`).join('');
  show(`<section class="map-screen" aria-label="Маршрут к точке ${esc(p.point_name)}">
    <div id="quest-map" class="quest-map" aria-label="Карта партнёрских точек"></div>
    
    <div class="map-top">
      <div class="map-progress-pill"><b>${completed()}/3</b><span>${3-completed()===0?'всё собрано':'штампов собрано'}</span></div>
      ${themeToggleMarkup()}
      <div class="map-chip-row">${chips}</div>
    </div>
    <div id="route-info" class="route-info"></div>
    <button class="map-geo" onclick="geoAndRoute(event,${p.seq})">${icon('geo')}<b>${localPosition?'Маршрут к точке':'Где я'}</b></button>
    ${locSheet(p)}
  </section>${tabbar('route')}`);
  requestAnimationFrame(()=>initUserMap(p))}


function selectPoint(seq){
  if(state?.campaign?.status!=='active'||!['active','completed'].includes(state?.session?.status))
    return toast('Сейчас можно смотреть квест и полученные подарки, но продолжить маршрут нельзя');
  routeRequestToken++;if(routeSeq!==Number(seq))clearRoute();selectedSeq=Number(seq);
  const target=pointBySeq(selectedSeq);
  if(!target)return;
  const screen=document.querySelector('.map-screen');
  if(!screen)return routeScreen(selectedSeq);
  // Карта остаётся тем же экземпляром: меняются только чипы и нижняя
  // карточка. Это убирает чёрный кадр при каждом выборе точки.
  screen.querySelectorAll('.map-chip').forEach(button=>{const active=Number(button.dataset.seq)===selectedSeq;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});
  const oldSheet=document.getElementById('loc-sheet');
  if(oldSheet)oldSheet.outerHTML=locSheet(target);
  const geo=screen.querySelector('.map-geo');
  if(geo)geo.setAttribute('onclick',`geoAndRoute(event,${selectedSeq})`);
  glMarkers.forEach(marker=>{try{const point=pointBySeq(marker.__seq);if(point&&typeof marker.setIcon==='function')marker.setIcon(pinIcon(point.seq===selectedSeq,!!point.completed_at))}catch(_){}});
  eventLog('point_view',target.point_id);
  requestAnimationFrame(()=>{
    if(mapEngine==='mapgl'&&glMap){try{glMap.setCenter([target.longitude,target.latitude],{animate:true})}catch(_){}}
  });
  tg?.HapticFeedback?.selectionChanged?.();
  syncBackButton()}

/* Одна кнопка на карте закрывает два сценария:
   нет позиции — запрашиваем разрешение и подбираем ближайшую точку;
   позиция есть — сразу открываем веломаршрут в навигаторе. */
async function geoAndRoute(ev,seq){
  ev?.preventDefault?.();
  if(!localPosition){
    const btn=ev?.currentTarget;
    /* Ожидание может занять до 20 секунд, поэтому кнопка не просто
       блокируется, а показывает, что процесс идёт, и через 7 секунд
       объясняет задержку. */
    /* Кнопка бывает двух видов: широкая с подписями и круглая иконка на
       карте. Подписи меняем только если они есть, иначе показываем занятость
       классом — раньше на круглой кнопке это падало с ошибкой. */
    let hint=null;
    const label=btn?.querySelector('b'),sub=btn?.querySelector('i');
    if(btn){btn.disabled=true;btn.classList.add('busy')}
    if(label)label.textContent='Ищу спутники…';
    if(sub){sub.textContent='Обычно занимает пару секунд';
      hint=setTimeout(()=>{sub.textContent='В горах сигнал ловится дольше — выйди на открытое место'},7000)}
    if(!label&&!sub)toast('Ищу спутники — в горах это занимает до 20 секунд');
    const restore=()=>{clearTimeout(hint);
      if(btn){btn.disabled=false;btn.classList.remove('busy')}
      if(label)label.textContent='Показать, где я';
      if(sub)sub.textContent='Telegram спросит разрешение — позиция берётся один раз'};
    try{
      const pos=await oneLocation();
      if(!pos){toast('Не поймали спутники. Проверь разрешение на геопозицию и попробуй на открытом месте');
        restore();return}
      clearTimeout(hint);
      localPosition=pos;
      if(pendingScan){toast('Позиция получена — проверяю отсканированный QR');await applyPendingScan();return}
      pointOrder=[...openPoints()].sort((a,b)=>
        distance(pos.lat,pos.lon,a.latitude,a.longitude)-
        distance(pos.lat,pos.lon,b.latitude,b.longitude)).map(x=>x.seq);
      if(pointOrder[0])selectedSeq=pointOrder[0];
      tg?.HapticFeedback?.notificationOccurred?.('success');
      routeScreen();
      toast('Ближайшая точка выбрана. Координата не сохраняется.');
    }catch(_){
      toast('Не удалось определить позицию');
      restore();
    }
    return;
  }
  // Позиция уже есть — ведём на велосипеде.
  bikeRoute(seq);
}

/* Веломаршрут: Яндекс Карты понимают режим велосипеда напрямую. */
function bikeRoute(seq){
  const p=pointBySeq(seq)||openPoints()[0];
  if(!p)return;
  eventLog('navigator_open',p.point_id,'yandex');
  const url=`https://yandex.ru/maps/?rtext=~${p.latitude},${p.longitude}&rtt=bc`;
  tg?.openLink?tg.openLink(url):window.open(url,'_blank','noopener');
}

async function nearest(){try{const pos=await oneLocation();if(!pos)return toast('Не удалось определить местоположение');localPosition=pos;pointOrder=[...openPoints()].sort((a,b)=>distance(pos.lat,pos.lon,a.latitude,a.longitude)-distance(pos.lat,pos.lon,b.latitude,b.longitude)).map(x=>x.seq);const first=pointOrder[0];if(first)selectedSeq=first;routeScreen();toast('Ближайшая точка выбрана. Бот не сохраняет координату.')}catch(_){toast('Разреши разовую геопозицию в настройках Telegram')}}
/* Бюджет ожидания — 20 секунд. Прежние 6,5 с не хватало холодному GPS
   в горах: телефон был исправен, а человек видел «не удалось определить
   позицию». Высокая точность важна, потому что расстояния до точек
   показываются в метрах. */
const GEO_TIMEOUT_MS=20000;
function oneLocation(){return new Promise(resolve=>{let ended=false,browserStarted=false;const finish=v=>{if(!ended){ended=true;resolve(v)}},browser=()=>{if(ended||browserStarted)return;browserStarted=true;navigator.geolocation?navigator.geolocation.getCurrentPosition(v=>finish({lat:v.coords.latitude,lon:v.coords.longitude,accuracy:v.coords.accuracy}),()=>finish(null),{enableHighAccuracy:true,timeout:GEO_TIMEOUT_MS-1500,maximumAge:60000}):finish(null)};setTimeout(()=>finish(null),GEO_TIMEOUT_MS);const manager=tg?.LocationManager,supported=!!manager&&tg?.isVersionAtLeast?.('8.0')===true;if(!supported)return browser();const get=()=>{try{manager.getLocation(v=>v?finish({lat:v.latitude,lon:v.longitude}):browser())}catch(_){browser()}};try{manager.isInited?get():manager.init(get)}catch(_){browser()}})}
async function updateProfileLocation(event){const button=event?.currentTarget;if(button)button.disabled=true;toast('Определяю позицию…');const pos=await oneLocation();if(!pos){if(button)button.disabled=false;return toast('Не удалось определить позицию. Проверь разрешение на геолокацию.')}localPosition=pos;pointOrder=[...openPoints()].sort((a,b)=>distance(pos.lat,pos.lon,a.latitude,a.longitude)-distance(pos.lat,pos.lon,b.latitude,b.longitude)).map(x=>x.seq);tg?.HapticFeedback?.notificationOccurred?.('success');if(pendingScan){toast('Позиция получена — проверяю отсканированный QR');await applyPendingScan();return}profileScreen();toast('Позиция обновлена и не отправлена на сервер')}

async function submitQr(value,event){
  event?.preventDefault?.();const submit=event?.submitter||modal.querySelector('form .btn.primary');if(submit)submit.disabled=true;
  value=questCodeFrom(value);
  if(!value){if(submit)submit.disabled=false;document.getElementById('manual-code')?.focus();return toast('Код не распознан')}
  try{
    const before=completed();
    const payload={qr_code:value,request_id:requestId()};
    if(state?.scan_requires_geo&&localPosition){payload.latitude=localPosition.lat;payload.longitude=localPosition.lon}
    state=(await api('/api/quest/scan',{method:'POST',body:JSON.stringify(payload)})).data;
    cacheState(state);
    closeModal();
    const after=completed(),ev=state.event||{};
    if(after>before)return stampSuccess(ev.point_completed);
    /* Тот же код второй раз: раньше экран просто молча возвращался на карту.
       Теперь человек видит, что штамп на месте, и сразу может открыть подарок. */
    if(ev.already_completed){
      tg?.HapticFeedback?.notificationOccurred?.('warning');
      toast('Эта точка уже отмечена — подарок сохранён в квесте');
      return showReward(ev.already_completed);
    }
    routeScreen();
  }catch(x){if(submit)submit.disabled=false;const input=document.getElementById('manual-code');input?.focus();input?.select();tg?.HapticFeedback?.notificationOccurred?.('error');toast(x.message)}}

let rulesReturn='';
function rules(next=''){rulesShown=true;rulesReturn=next;const r=(state?.points?.[0]?.radius_m)||100,geo=!!state?.scan_requires_geo;show(`${header(`<button class="icon-button" aria-label="Назад" onclick="closeRules()">${icon('back')}</button>`)}
<section class="rules-screen">
  <p class="rules-eyebrow">Как проходит квест</p>
  <h1 class="rules-title">Три правила</h1>
  <p class="rules-lead">Гуляй по Красной Поляне, отмечайся на локациях и забирай подарки партнёров. За полный квест — Подписка 30 дней для бесплатного старта на байке.</p>

  <div class="rules-steps">
    <div class="rules-line"></div>
    <div class="rule"><span class="rule-n">1</span><div><b>Выбери точку и доезжай</b>
      <p>Три партнёрские локации в долине. Порядок свободный — начни с той, что ближе. Маршрут построится в Яндекс Картах или 2ГИС прямо из приложения.</p></div></div>
    <div class="rule"><span class="rule-n">2</span><div><b>${geo?`Подъезжай ближе ${r} метров`:'Заходи к партнёру'}</b>
      <p>${geo?'Штамп ставится только рядом с точкой: нажми «Показать, где я», и круг на карте покажет зону.':'Расстояние до точки видно на карте — нажми «Показать, где я». Подарок ждёт внутри, у стойки партнёра.'}</p></div></div>
    <div class="rule"><span class="rule-n">3</span><div><b>Сканируй QR у стойки</b>
      <p>${geo?'Гео и код сходятся — отметка засчитана, подарок сразу твой.':'Зелёная табличка Бибибайк у стойки. Отсканировал — отметка засчитана, подарок сразу твой.'} Три уникальных кода закрывают квест.</p></div></div>
  </div>

  <div class="rules-gift">
    <span class="gift-ic">${icon('gift')}</span>
    <div><b>Что в конце</b><p>После трёх штампов появится код участника. Подписка 30 дней подключится после проверки администратором.</p></div>
  </div>

  <div class="rules-geo">
    <span class="geo-dot"><i></i><b></b></span>
    <div><b>Гео работает только внутри квеста</b>
      <p>Позиция запрашивается по кнопке и не отслеживается постоянно. Партнёр видит только отметку, а не твой маршрут. ${geo?'Координата проверяется в момент сканирования и не сохраняется.':'Расстояния считаются прямо в телефоне, координата никуда не уходит.'}</p></div>
  </div>

  <div class="rules-safety">${icon('shield')}<p>Во время поездки следи за дорогой. Телефон — только после полной остановки.</p></div>

  <button class="btn primary rules-btn" onclick="closeRules()"><span>${next==='profile'?'Понятно, назад':state?.session?(completed()===3?'Понятно, к квесту':'Понятно, к карте'):'Понятно, к началу'}</span></button>
</section>`)}
function emptyState(title,text,action='refresh()'){show(`${header()}<section class="empty"><div class="empty-stamp">БИБИБАЙК</div><h1>${esc(title)}</h1><p>${esc(text)}</p><button class="btn secondary" onclick="${action}">Проверить снова</button></section>`)}
/* Выход из инструкции: если квест уже начат — на карту,
   если ещё нет — обратно на приветственный экран. */
function closeRules(){
  rulesShown=true;
  const target=rulesReturn;rulesReturn='';
  if(target==='profile')return profileScreen();
  if(!state?.session) return cover();
  return completed()===3?passportScreen():routeScreen();
}

function render(track=true){
  // Пока человек читает инструкцию, фоновое обновление данных
  // не должно подменять экран картой.
  if(root.querySelector('.rules-screen'))return;
  if(!state?.campaign)return emptyState('Маршрут ещё готовят','Скоро здесь появятся точки Красной Поляны.');
  /* Код с таблички обрабатывается раньше обычных экранов: человек стоит
     у стойки партнёра и ждёт штамп, а не карту. */
  if(pendingScan&&state.campaign.status==='active'&&state.session?.status==='active'){applyPendingScan();return}if(state.campaign.status!=='active')return state.session&&completed()?passportScreen('Квест сейчас на паузе. Полученные штампы и подарки сохранены.'):emptyState('Квест сейчас на паузе','Прогресс и уже полученные подарки останутся на месте.');if(!state.session)return cover();if(state.session.status==='expired')return completed()?passportScreen('Маршрут приостановлен. Нажми «Проверить снова», чтобы продолжить.'):emptyState('Маршрут приостановлен','Прогресс сохранён. Открой квест снова, чтобы продолжить.');selectedSeq=selectedSeq||openPoints()[0]?.seq||state.points[0]?.seq;
  completed()===3?passportScreen():routeScreen(selectedSeq,track)}
function stateFingerprint(value){return JSON.stringify({campaign:value?.campaign,session:value?.session,points:value?.points,premium:value?.premium})}
function canAutoRender(){const tag=document.activeElement?.tagName;return !document.hidden&&!modal.innerHTML&&!qrPopupOpen&&!['INPUT','TEXTAREA','SELECT'].includes(tag)&&!root.querySelector('.rules,.rules-screen,.stamp-success,.stamp-screen,.saved-reward,.scanner-screen')}
async function refresh(options={}){const silent=!!options.silent;if(syncInFlight)return;syncInFlight=true;try{const payload=await api('/api/quest/state');if(lastBuildVersion&&payload.build_version&&payload.build_version!==lastBuildVersion){if(canAutoRender())location.reload();return}if(payload.build_version)lastBuildVersion=payload.build_version;const before=stateFingerprint(state),after=stateFingerprint(payload.data),changed=before!==after;state=payload.data;botUsername=payload.bot_username||'';cacheState(state);if(!silent){pendingAutoRender=false;render(true)}else if(changed||pendingAutoRender){if(canAutoRender()){pendingAutoRender=false;render(false)}else pendingAutoRender=true}}catch(e){if(silent)return;const saved=cachedState();if(saved){state=saved;setOffline(true);toast('Нет связи — открыт сохранённый квест');return render(false)}emptyState('Не получилось открыть квест',e.message||'Проверь интернет и попробуй ещё раз.')}finally{syncInFlight=false}}
async function publicLanding(){try{const payload=await fetch('/api/public/info',{cache:'no-store'}).then(r=>r.json());const app=payload.app_url||payload.chat_url,chat=payload.chat_url||app;show(`<section class="passport-cover public-cover"><div class="cover-grain"></div><div class="cover-brand"><img src="/static/bb-bike-logo.jpg" alt="Бибибайк"><span>КВЕСТ · КРАСНАЯ ПОЛЯНА</span></div><div class="cover-copy"><p class="micro">КВЕСТ КРАСНОЙ ПОЛЯНЫ</p><h1>Пройди городской квест</h1><p>Три места, три подарка и Подписка 30 дней. Прогресс хранится внутри Telegram.</p></div><a class="btn cover-button public-link" href="${esc(app)}">Открыть приложение</a><a class="btn quiet public-link" href="${esc(chat)}">Перейти в чат с ботом</a></section>`)}catch(_){emptyState('Открой квест в Telegram','Эта страница работает внутри личного чата с ботом.')}}
window.addEventListener('offline',()=>{setOffline(true);toast('Нет сети. Прогресс квеста сохранён.')});
window.addEventListener('online',()=>refresh({silent:true}));
window.addEventListener('pageshow',()=>initData&&refresh({silent:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&initData)refresh({silent:true})});
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.innerHTML)return closeModal();if(event.key==='Tab'&&modal.innerHTML){const items=[...modal.querySelectorAll('button,input,a[href]')].filter(x=>!x.disabled);if(!items.length)return;const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
tg?.BackButton?.onClick(handleBack);
tg?.onEvent?.('scanQrPopupClosed',()=>{qrPopupOpen=false});
tg?.ready();tg?.expand();tg?.setHeaderColor?.('#06130b');tg?.setBackgroundColor?.('#06130b');tg?.disableVerticalSwipes?.();
setInterval(()=>{if(initData&&canAutoRender())refresh({silent:true})},30000);
/* Три разных случая, которые раньше сводились к одному экрану:
   1) обычный запуск внутри Telegram;
   2) мини-апп открыт в Telegram, но telegram-web-app.js не загрузился —
      лендинг с кнопкой «Открыть приложение» вёл сам в себя;
   3) страница открыта в обычном браузере — это и есть лендинг. */
/* Офлайн-оболочка. Регистрируется тихо: если браузер Telegram её не
   поддерживает, приложение работает ровно как раньше. */
function registerOfflineShell(){
  if(!('serviceWorker' in navigator)||location.protocol==='http:'&&!dev)return;
  navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{})}
registerOfflineShell();

function boot(){
  if(initData||dev)return refresh();
  const insideTelegram=/tgWebApp/i.test(location.hash+location.search)||!!window.TelegramWebviewProxy;
  if(insideTelegram||window.__tgSdkFailed){
    const saved=cachedState();
    if(saved){state=saved;setOffline(true);render(false);return toast('Telegram не отвечает — открыт сохранённый квест')}
    return emptyState('Telegram не отвечает','Не удалось загрузить связь с Telegram. Проверь интернет и открой квест заново.','location.reload()');
  }
  publicLanding();
}
setTimeout(boot,80);
</script>
</body>
</html>
